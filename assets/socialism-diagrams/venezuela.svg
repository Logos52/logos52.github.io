<svg viewBox="0 0 680 176" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Venezuela's output per head rose from $4,000 to $14,200 and fell to $1,800" style="max-width:100%;height:auto">
<title>Venezuela's output per head rose from $4,000 to $14,200 and fell to $1,800</title>
<text x="60" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">VENEZUELA, OUTPUT PER HEAD</text>
<line x1="60.0" y1="150.0" x2="400.0" y2="150.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<path d="M60.0,118.5 L298.0,38.2 L400.0,135.8" fill="none" stroke="#8156a6" stroke-width="2" stroke-opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="60.0" cy="118.5" r="5" fill="#8156a6"/>
<text x="60.0" y="108.5" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">$4,000</text>
<text x="60.0" y="164" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">1999</text>
<circle cx="298.0" cy="38.2" r="5" fill="#8156a6"/>
<text x="298.0" y="28.174999999999997" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">$14,200</text>
<text x="298.0" y="164" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2013</text>
<circle cx="400.0" cy="135.8" r="5" fill="#8156a6"/>
<text x="400.0" y="125.82499999999999" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">$1,800</text>
<text x="400.0" y="164" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2019</text>
<text x="430" y="40" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">303 billion barrels of oil, the most on earth</text>
<text x="430" y="60" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">an 87% fall in output per head, 2013 to 2019</text>
<text x="430" y="80" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">inflation in 2018: 130,000% by the central bank,</text>
<text x="430" y="96" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">nearly a million percent by the IMF</text>
<text x="430" y="116" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">24 pounds lost per person in a year</text>
<text x="430" y="136" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">7.4 million people gone by 2024, one in four</text>
</svg>
