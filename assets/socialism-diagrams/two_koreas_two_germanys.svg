<svg viewBox="0 0 680 108" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One culture split in two, twice: output per head in the two Koreas and the two Germanys" style="max-width:100%;height:auto">
<title>One culture split in two, twice: output per head in the two Koreas and the two Germanys</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">OUTPUT PER HEAD, THE KOREAS</text>
<text x="122" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">South Korea</text>
<g><title>About $35,000</title><rect x="130.0" y="24.0" width="200.0" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="336.0" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$35,000</text>
<text x="122" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">North Korea</text>
<g><title>About $640</title><rect x="130.0" y="50.0" width="3.7" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="139.65714285714284" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$640</text>
<text x="370" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">OUTPUT PER HEAD, THE GERMANYS, 1989</text>
<text x="462" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">West Germany</text>
<g><title>About $28,000</title><rect x="470.0" y="24.0" width="136.0" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="612.0" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$28,000</text>
<text x="462" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">East Germany</text>
<g><title>About $12,000</title><rect x="470.0" y="50.0" width="58.3" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="534.2857142857143" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$12,000</text>
<text x="20" y="96" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">East Germany's population fell from 18.4 million to 16.4 million as people fled west. At least 140 died at the wall built to keep them in.</text>
</svg>
