<svg viewBox="0 0 680 200" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Few Americans define socialism as state ownership, and the same millennials liked socialism and wanted a free market" style="max-width:100%;height:auto">
<title>Few Americans define socialism as state ownership, and the same millennials liked socialism and wanted a free market</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">HOW AMERICANS DEFINE SOCIALISM, 2018</text>
<text x="292" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">government ownership of production</text>
<g><title>17% gave the textbook definition</title><rect x="300.0" y="24.0" width="54.4" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="360.4" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">17%</text>
<text x="292" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">equality</text>
<g><title>23% said equality</title><rect x="300.0" y="50.0" width="73.6" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="379.6" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">23%</text>
<text x="292" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">free healthcare, college, benefits, the Nordics</text>
<g><title>The rest named benefits or the Nordic countries</title><rect x="300.0" y="76.0" width="192.0" height="14.0" rx="3" fill="rgba(129,86,166,0.4)"/></g>
<text x="498.0" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">the rest</text>
<text x="20" y="108" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">MILLENNIALS, 2014</text>
<text x="292" y="129" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">like socialism</text>
<g><title>42% liked socialism</title><rect x="300.0" y="118.0" width="134.4" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="440.4" y="129" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">42%</text>
<text x="292" y="155" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">can define it</text>
<g><title>16% could define it</title><rect x="300.0" y="144.0" width="51.2" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="357.2" y="155" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">16%</text>
<text x="292" y="181" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">want a free market</text>
<g><title>64% wanted a free-market economy</title><rect x="300.0" y="170.0" width="204.8" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="510.8" y="181" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">64%</text>
</svg>
