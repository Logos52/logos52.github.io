<svg viewBox="0 0 680 124" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The pay gap is 83 cents as a raw average and 94 to 99 cents for young childless workers in the same jobs" style="max-width:100%;height:auto">
<title>The pay gap is 83 cents as a raw average and 94 to 99 cents for young childless workers in the same jobs</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WHAT WOMEN EARN PER DOLLAR MEN EARN</text>
<text x="332" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">all full-time workers, raw average</text>
<g><title>83 cents, the headline figure</title><rect x="340.0" y="24.0" width="182.6" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="528.6" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">83 cents</text>
<text x="332" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">young childless workers, same hours, job, industry</text>
<g><title>94 to 99 cents</title><rect x="340.0" y="50.0" width="212.3" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="558.3" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">94 to 99 cents</text>
<line x1="560.0" y1="22.0" x2="560.0" y2="76.0" stroke="rgba(130,130,130,.8)" stroke-width="1.2"/>
<text x="560" y="90" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">$1</text>
<text x="20" y="112" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Most of the remaining gap opens at the birth of the first child. The 83-cent figure is taught at 16 and the 99-cent figure is not.</text>
</svg>
