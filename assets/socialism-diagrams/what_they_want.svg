<svg viewBox="0 0 680 240" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Young Americans distrust both parties, and support for every label is low" style="max-width:100%;height:auto">
<title>Young Americans distrust both parties, and support for every label is low</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">YOUNG AMERICANS, 2025</text>
<text x="242" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">country headed the right way</text>
<g><title>13%</title><rect x="250.0" y="24.0" width="48.1" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="304.1" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">13%</text>
<text x="242" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">negative word for the Democrats</text>
<g><title>58%</title><rect x="250.0" y="50.0" width="214.6" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="470.6" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">58%</text>
<text x="242" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">negative word for the Republicans</text>
<g><title>56%</title><rect x="250.0" y="76.0" width="207.2" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="463.2" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">56%</text>
<text x="242" y="113" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">negative word for both</text>
<g><title>40%</title><rect x="250.0" y="102.0" width="148.0" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="404.0" y="113" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">40%</text>
<text x="20" y="130" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">LABELS, YOUNG AMERICANS, 2025</text>
<text x="242" y="151" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">support socialism</text>
<g><title>21%, down from earlier highs</title><rect x="250.0" y="140.0" width="77.7" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="333.7" y="151" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">21%</text>
<text x="242" y="177" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">support democratic socialism</text>
<g><title>29%</title><rect x="250.0" y="166.0" width="107.3" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="363.3" y="177" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">29%</text>
<text x="242" y="203" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">call themselves capitalist</text>
<g><title>19%</title><rect x="250.0" y="192.0" width="70.3" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="326.3" y="203" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">19%</text>
<text x="20" y="228" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Americans as a whole favoured capitalism over socialism 54% to 39% in 2025.</text>
</svg>
