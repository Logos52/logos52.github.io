<svg viewBox="0 0 680 114" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Soviet price bureau set about 200,000 prices a year against the 20 million a working economy needs" style="max-width:100%;height:auto">
<title>The Soviet price bureau set about 200,000 prices a year against the 20 million a working economy needs</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">PRICES SET OR NEEDED IN A YEAR</text>
<text x="222" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Soviet price bureau, 1985</text>
<g><title>About 200,000 prices reviewed a year</title><rect x="230.0" y="24.0" width="3.9" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="239.9" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">200,000</text>
<text x="222" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">a working modern economy</text>
<g><title>About 20 million prices, updated continuously</title><rect x="230.0" y="50.0" width="390.0" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="626.0" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">20,000,000</text>
<text x="20" y="86" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The gap was filled by shortages, black markets, and waiting lists.</text>
<text x="20" y="102" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">By 1991 the deficit was 34% of output and trade among the republics had fallen 83%.</text>
</svg>
