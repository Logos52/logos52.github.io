<svg viewBox="0 0 680 128" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three facts about the Nordic countries that make them market economies with a welfare state on top" style="max-width:100%;height:auto">
<title>Three facts about the Nordic countries that make them market economies with a welfare state on top</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE NORDIC COUNTRIES PEOPLE POINT TO</text>
<rect x="20" y="24" width="200" height="64" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="120.0" y="45.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">all five in the top 15</text>
<text x="120.0" y="59.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">of the economic-freedom index;</text>
<text x="120.0" y="73.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">Denmark above the United States</text>
<rect x="240" y="24" width="200" height="64" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="340.0" y="45.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">Sweden: school vouchers since 1992,</text>
<text x="340.0" y="59.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">wealth tax abolished 2007;</text>
<text x="340.0" y="73.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">Norway: estate tax abolished 2014</text>
<rect x="460" y="24" width="200" height="64" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="560.0" y="45.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a 25% sales tax on everyone,</text>
<text x="560.0" y="59.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">top income brackets starting</text>
<text x="560.0" y="73.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">at middle-class incomes</text>
<text x="20" y="116" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The welfare state is the second floor. The privately owned market is the foundation.</text>
</svg>
