<svg viewBox="0 0 680 144" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The four-step cycle behind the reply that it was not real socialism" style="max-width:100%;height:auto">
<title>The four-step cycle behind the reply that it was not real socialism</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE CYCLE THE VIDEO DESCRIBES</text>
<rect x="20" y="24" width="150" height="64" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="95.0" y="45.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a regime rises</text>
<text x="95.0" y="59.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">and is praised</text>
<text x="95.0" y="73.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">as the future</text>
<line x1="170.0" y1="56.0" x2="185.0" y2="56.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="185" y="24" width="150" height="64" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="260.0" y="45.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">famine, purge,</text>
<text x="260.0" y="59.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">or flight</text>
<text x="260.0" y="73.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">follows</text>
<line x1="335.0" y1="56.0" x2="350.0" y2="56.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="350" y="24" width="150" height="64" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="425.0" y="52.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the admirers</text>
<text x="425.0" y="66.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">go quiet</text>
<line x1="500.0" y1="56.0" x2="515.0" y2="56.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="515" y="24" width="150" height="64" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="590.0" y="45.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a new generation</text>
<text x="590.0" y="59.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">finds a new regime,</text>
<text x="590.0" y="73.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the real thing this time</text>
<text x="20" y="116" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Asked what the real version looks like, the answer is Denmark, Sweden, or Norway.</text>
<text x="20" y="132" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Asked why every attempt failed, the answer is corruption, sanctions, or bad luck.</text>
</svg>
