<svg viewBox="0 0 680 174" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deaths under the Soviet, Chinese, Cambodian, and North Korean regimes in millions" style="max-width:100%;height:auto">
<title>Deaths under the Soviet, Chinese, Cambodian, and North Korean regimes in millions</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">DEATHS UNDER SOCIALIST REGIMES, MILLIONS, AS THE VIDEO COUNTS THEM</text>
<text x="242" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Soviet Union, total</text>
<g><title>About 15 to 20 million</title><rect x="250.0" y="24.0" width="148.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="404.0" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">15 to 20</text>
<text x="242" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">China, famine of 1958 to 1962</text>
<g><title>36 to 45 million</title><rect x="250.0" y="50.0" width="333.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="589.0" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">36 to 45</text>
<text x="242" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Cambodia, 1975 to 1979</text>
<g><title>About 1.87 million of 7.89 million, one in four</title><rect x="250.0" y="76.0" width="13.8" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="269.838" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">1.87</text>
<text x="242" y="113" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">North Korea, famine of the 1990s</text>
<g><title>600,000 to a million</title><rect x="250.0" y="102.0" width="7.4" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="263.4" y="113" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">0.6 to 1</text>
<text x="242" y="139" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Ukraine famine, 1932 to 1933</text>
<g><title>Three to five million</title><rect x="250.0" y="128.0" width="37.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="293.0" y="139" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">3 to 5</text>
<text x="20" y="162" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The video's total for the century: 65 to 100 million.</text>
</svg>
