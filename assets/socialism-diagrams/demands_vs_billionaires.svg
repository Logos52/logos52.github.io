<svg viewBox="0 0 680 174" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The programmes asked for against what seizing every billionaire's wealth would raise once" style="max-width:100%;height:auto">
<title>The programmes asked for against what seizing every billionaire's wealth would raise once</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WHAT IS ASKED FOR, TRILLIONS OVER A DECADE</text>
<text x="312" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">universal healthcare</text>
<g><title>$30 to $40 trillion</title><rect x="320.0" y="24.0" width="110.5" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="436.5263157894737" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$30 to $40 tn</text>
<text x="312" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">a green programme, its own advocates' estimate</text>
<g><title>About $90 trillion</title><rect x="320.0" y="50.0" width="284.2" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="610.2105263157895" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$90 tn</text>
<text x="312" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">cancel student debt</text>
<g><title>$1.7 trillion once</title><rect x="320.0" y="76.0" width="5.4" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="331.36842105263156" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$1.7 tn</text>
<text x="20" y="108" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WHAT IS ON OFFER</text>
<text x="312" y="129" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">every billionaire taxed at 100%, once</text>
<g><title>About $5 trillion, one time, about 18 months of deficit</title><rect x="320.0" y="118.0" width="15.8" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="341.7894736842105" y="129" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$5 tn, about 18 months of deficit</text>
<text x="20" y="162" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The honest ways to pay are a broad sales tax like Denmark's 25%, or cuts to the programmes the same voters want expanded.</text>
</svg>
