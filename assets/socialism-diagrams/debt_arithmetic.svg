<svg viewBox="0 0 680 162" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Debt heads from 120% to 156% of output, interest doubles, and the trust funds run out in 2033" style="max-width:100%;height:auto">
<title>Debt heads from 120% to 156% of output, interest doubles, and the trust funds run out in 2033</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">DEBT AS A SHARE OF OUTPUT</text>
<line x1="20.0" y1="114.0" x2="220.0" y2="114.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<path d="M40.0,54.7 L200.0,36.9" fill="none" stroke="#8156a6" stroke-width="2" stroke-opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="40.0" cy="54.7" r="5" fill="#8156a6"/>
<text x="40" y="44.705882352941174" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">120%</text>
<circle cx="200.0" cy="36.9" r="5" fill="#8156a6"/>
<text x="200" y="26.917647058823533" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">156%</text>
<text x="40" y="128" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2026</text>
<text x="200" y="128" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2055</text>
<text x="250" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">NET INTEREST, TRILLIONS A YEAR</text>
<line x1="250.0" y1="114.0" x2="450.0" y2="114.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<path d="M270.0,80.4 L430.0,43.4" fill="none" stroke="#8156a6" stroke-width="2" stroke-opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="270.0" cy="80.4" r="5" fill="#8156a6"/>
<text x="270" y="70.4" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">1</text>
<circle cx="430.0" cy="43.4" r="5" fill="#8156a6"/>
<text x="430" y="33.44" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">2.1</text>
<text x="270" y="128" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2025</text>
<text x="430" y="128" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2036</text>
<text x="480" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">2033, BY LAW</text>
<rect x="480" y="24" width="180" height="84" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="570.0" y="48.916666666666664" font-size="9.5" fill="currentColor" opacity="0.85" text-anchor="middle">Social Security trust fund</text>
<text x="570.0" y="62.416666666666664" font-size="9.5" fill="currentColor" opacity="0.85" text-anchor="middle">runs out: benefits cut 23%</text>
<text x="570.0" y="75.91666666666666" font-size="9.5" fill="currentColor" opacity="0.85" text-anchor="middle">Medicare hospital fund</text>
<text x="570.0" y="89.41666666666666" font-size="9.5" fill="currentColor" opacity="0.85" text-anchor="middle">runs out: benefits cut 11%</text>
<text x="20" y="150" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">By 2050 about 22% of Americans are over 65. Interest already costs more than the military.</text>
</svg>
