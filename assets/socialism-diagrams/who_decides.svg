<svg viewBox="0 0 680 160" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Who decides under a market and under a plan, and what happens to each one's mistakes" style="max-width:100%;height:auto">
<title>Who decides under a market and under a plan, and what happens to each one's mistakes</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WHO DECIDES</text>
<rect x="20" y="24" width="310" height="96" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="175.0" y="54.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a market</text>
<text x="175.0" y="68.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">millions decide on their own knowledge,</text>
<text x="175.0" y="82.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">coordinated by prices;</text>
<text x="175.0" y="96.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">mistakes are small, local, and corrected</text>
<rect x="350" y="24" width="310" height="96" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="505.0" y="54.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a plan</text>
<text x="505.0" y="68.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a small group sets one policy for everyone;</text>
<text x="505.0" y="82.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">mistakes are large and stay,</text>
<text x="505.0" y="96.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">because admitting them undermines the planners</text>
<text x="20" y="148" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The Nordic model is what social democrats settle for after they win. It is not what socialists promise.</text>
</svg>
