<svg viewBox="0 0 680 190" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A price carries a shortage to every user at once; without private buyers and sellers there is no price" style="max-width:100%;height:auto">
<title>A price carries a shortage to every user at once; without private buyers and sellers there is no price</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">IN A MARKET</text>
<rect x="20" y="24" width="180" height="56" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="110.0" y="55.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">copper runs short</text>
<line x1="200.0" y1="52.0" x2="240.0" y2="52.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="242" y="24" width="180" height="56" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="332.0" y="55.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">the price of copper rises</text>
<line x1="422.0" y1="52.0" x2="462.0" y2="52.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="464" y="24" width="196" height="56" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="562.0" y="48.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">every copper user on earth</text>
<text x="562.0" y="62.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">gets the signal and adjusts</text>
<text x="20" y="112" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">UNDER STATE OWNERSHIP</text>
<rect x="20" y="120" width="300" height="56" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="170.0" y="144.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">no private buyers or sellers</text>
<text x="170.0" y="158.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">of factories, farms, or mines</text>
<line x1="320.0" y1="148.0" x2="360.0" y2="148.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="362" y="120" width="298" height="56" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="511.0" y="144.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">no prices for them,</text>
<text x="511.0" y="158.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">so the planners have nothing to calculate with</text>
</svg>
