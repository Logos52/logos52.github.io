<svg viewBox="0 0 680 150" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The political gap between young women and young men in four countries, and Korea's 2022 vote" style="max-width:100%;height:auto">
<title>The political gap between young women and young men in four countries, and Korea's 2022 vote</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">HOW FAR YOUNG WOMEN SIT LEFT OF YOUNG MEN, IN POINTS</text>
<text x="122" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">United States</text>
<g><title>About 30 points</title><rect x="130.0" y="24.0" width="162.0" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="298.0" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">30</text>
<text x="122" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Germany</text>
<g><title>About 30 points</title><rect x="130.0" y="50.0" width="162.0" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="298.0" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">30</text>
<text x="122" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Britain</text>
<g><title>About 25 points</title><rect x="130.0" y="76.0" width="135.0" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="271.0" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">25</text>
<text x="122" y="113" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">South Korea</text>
<g><title>About 40 points</title><rect x="130.0" y="102.0" width="216.0" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="352.0" y="113" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">40</text>
<text x="430" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">KOREA 2022, VOTERS IN THEIR TWENTIES</text>
<text x="532" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">men, conservative</text>
<g><title>59% of men in their twenties</title><rect x="540.0" y="24.0" width="59.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="605.0" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">59%</text>
<text x="532" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">women, liberal</text>
<g><title>59% to 66% of women in their twenties</title><rect x="540.0" y="50.0" width="62.0" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="608.0" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">59 to 66%</text>
<text x="20" y="138" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The American gap opened in six years, from near zero in 2017.</text>
</svg>
