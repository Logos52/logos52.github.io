<svg viewBox="0 0 680 108" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Home prices rose twice as fast as incomes, and women hold two-thirds of student debt" style="max-width:100%;height:auto">
<title>Home prices rose twice as fast as incomes, and women hold two-thirds of student debt</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">2019 TO 2024</text>
<text x="182" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">median home price</text>
<g><title>Up 48%</title><rect x="190.0" y="24.0" width="168.0" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="364.0" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">+48%</text>
<text x="182" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">median household income</text>
<g><title>Up 22%</title><rect x="190.0" y="50.0" width="77.0" height="14.0" rx="3" fill="rgba(129,86,166,0.5)"/></g>
<text x="273.0" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">+22%</text>
<text x="430" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">STUDENT DEBT, $1.7 TRILLION</text>
<text x="512" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">held by women</text>
<g><title>$929 billion, about two-thirds</title><rect x="520.0" y="24.0" width="111.5" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="637.48" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$929 bn</text>
<text x="512" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">held by men</text>
<g><title>About $771 billion</title><rect x="520.0" y="50.0" width="92.5" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="618.52" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$771 bn</text>
<text x="20" y="96" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Price-to-income ratio 5.0, the worst on record. 3% of home buyers are Gen Z. Childcare averages $13,128 a child a year.</text>
</svg>
