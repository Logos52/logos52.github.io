<svg viewBox="0 0 680 226" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Margins among voters under 30 in 2024: women toward the Democrat, men toward the Republican" style="max-width:100%;height:auto">
<title>Margins among voters under 30 in 2024: women toward the Democrat, men toward the Republican</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">MARGIN AMONG VOTERS UNDER 30, 2024, IN POINTS</text>
<line x1="190.0" y1="22.0" x2="190.0" y2="150.0" stroke="rgba(130,130,130,.18)" stroke-width="1"/>
<text x="190.0" y="164" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">D +40</text>
<line x1="302.5" y1="22.0" x2="302.5" y2="150.0" stroke="rgba(130,130,130,.18)" stroke-width="1"/>
<text x="302.5" y="164" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">D +20</text>
<line x1="415.0" y1="22.0" x2="415.0" y2="150.0" stroke="rgba(130,130,130,.18)" stroke-width="1"/>
<text x="415.0" y="164" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">0</text>
<line x1="527.5" y1="22.0" x2="527.5" y2="150.0" stroke="rgba(130,130,130,.18)" stroke-width="1"/>
<text x="527.5" y="164" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">R +20</text>
<line x1="640.0" y1="22.0" x2="640.0" y2="150.0" stroke="rgba(130,130,130,.18)" stroke-width="1"/>
<text x="640.0" y="164" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">R +40</text>
<text x="182" y="39" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">young women, national</text>
<g><title>Young women under 30 backed the Democrat by 24 points</title><rect x="280.0" y="28.0" width="135.0" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="274.0" y="39" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="end">-24</text>
<text x="182" y="63" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">young men, national</text>
<g><title>Young men under 30 backed the Republican by 16 points</title><rect x="415.0" y="52.0" width="90.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="511.0" y="63" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">+16</text>
<text x="182" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">young women, North Carolina</text>
<g><title>North Carolina: young women, Democrat by 33</title><rect x="229.4" y="76.0" width="185.6" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="223.375" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="end">-33</text>
<text x="182" y="111" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">young men, North Carolina</text>
<g><title>North Carolina: young men, Republican by 23</title><rect x="415.0" y="100.0" width="129.4" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="550.375" y="111" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">+23</text>
<text x="182" y="135" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">young men in 2020</text>
<g><title>In 2020 young men backed the Democrat by 8</title><rect x="370.0" y="124.0" width="45.0" height="14.0" rx="3" fill="rgba(91,108,176,0.4)"/></g>
<text x="364.0" y="135" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="end">-8</text>
<line x1="415.0" y1="22.0" x2="415.0" y2="150.0" stroke="rgba(130,130,130,.8)" stroke-width="1.2"/>
<text x="20" y="190" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The gap between young women and young men was 40 points nationally. Young men swung 24 points in one election.</text>
<rect x="20.0" y="206.0" width="10.0" height="10.0" rx="2" fill="rgba(47,158,143,1.0)"/><text x="35" y="214" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">young women</text>
<rect x="130.0" y="206.0" width="10.0" height="10.0" rx="2" fill="rgba(91,108,176,1.0)"/><text x="145" y="214" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">young men</text>
<rect x="230.0" y="206.0" width="10.0" height="10.0" rx="2" fill="rgba(91,108,176,0.4)"/><text x="245" y="214" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">young men in 2020</text>
</svg>
