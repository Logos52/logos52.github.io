<svg viewBox="0 0 680 200" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The college population flipped from 58% men in 1970 to 60% women by 2015, and women lead on degrees and on finishing" style="max-width:100%;height:auto">
<title>The college population flipped from 58% men in 1970 to 60% women by 2015, and women lead on degrees and on finishing</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WHO IS IN AMERICAN COLLEGE, OUT OF EVERY 100 STUDENTS</text>
<text x="122" y="40" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">1970</text>
<g><title>1970: 58 men</title><rect x="130.0" y="26.0" width="154.6" height="20.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<g><title>1970: 42 women</title><rect x="286.6" y="26.0" width="111.4" height="20.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="138" y="40" font-size="10.5" fill="currentColor" opacity="0.95" text-anchor="start">58 men</text>
<text x="394" y="40" font-size="10.5" fill="currentColor" opacity="0.95" text-anchor="end">42 women</text>
<text x="122" y="70" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">2015</text>
<g><title>2015: 40 men</title><rect x="130.0" y="56.0" width="106.0" height="20.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<g><title>2015: 60 women</title><rect x="238.0" y="56.0" width="160.0" height="20.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="138" y="70" font-size="10.5" fill="currentColor" opacity="0.95" text-anchor="start">40 men</text>
<text x="394" y="70" font-size="10.5" fill="currentColor" opacity="0.95" text-anchor="end">60 women</text>
<text x="430" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">BACHELOR'S DEGREES</text>
<text x="472" y="37" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">women</text>
<g><title>For every 100 women who earn a bachelor's degree</title><rect x="480.0" y="26.0" width="140.0" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="626.0" y="37" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">100</text>
<text x="472" y="63" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">men</text>
<g><title>74 men earn one</title><rect x="480.0" y="52.0" width="103.6" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="589.6" y="63" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">74</text>
<text x="20" y="108" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">FINISH A FOUR-YEAR DEGREE ON TIME</text>
<text x="122" y="129" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">women</text>
<g><title>54% of women finish on time</title><rect x="130.0" y="118.0" width="145.8" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="281.8" y="129" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">54%</text>
<text x="122" y="155" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">men</text>
<g><title>43% of men</title><rect x="130.0" y="144.0" width="116.1" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="252.1" y="155" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">43%</text>
<text x="430" y="108" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">AGES 25 TO 34 WITH A BACHELOR'S</text>
<text x="472" y="129" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">women</text>
<g><title>47% of women aged 25 to 34</title><rect x="480.0" y="118.0" width="65.8" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="551.8" y="129" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">47%</text>
<text x="472" y="155" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">men</text>
<g><title>37% of men</title><rect x="480.0" y="144.0" width="51.8" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="537.8" y="155" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">37%</text>
<rect x="20.0" y="182.0" width="10.0" height="10.0" rx="2" fill="rgba(91,108,176,1.0)"/><text x="35" y="190" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">men</text>
<rect x="80.0" y="182.0" width="10.0" height="10.0" rx="2" fill="rgba(47,158,143,1.0)"/><text x="95" y="190" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">women</text>
</svg>
