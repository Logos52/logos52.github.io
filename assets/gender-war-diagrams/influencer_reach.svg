<text x="613.2" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">42%</text>
<text x="20" y="110" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The kickboxer had 13.6 billion TikTok views by 2022. The professor's 2018 book sold over 5 million copies.</text>
