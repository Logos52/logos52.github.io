<svg viewBox="0 0 680 122" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Share of young men with a positive view of the two best-known male influencers, by country" style="max-width:100%;height:auto">
<title>Share of young men with a positive view of the two best-known male influencers, by country</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">YOUNG MEN WITH A POSITIVE VIEW OF THE KICKBOXER</text>
<text x="192" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Britain, men 16 to 29</text>
<g><title>One in five British men 16 to 29</title><rect x="200.0" y="24.0" width="80.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="286.0" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">20%</text>
<text x="192" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Australia, teenage boys, 2023</text>
<g><title>28% of Australian teenage boys looked up to him</title><rect x="200.0" y="50.0" width="112.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="318.0" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">28%</text>
<text x="192" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">United States, Gen Z men</text>
<g><title>13% of American Gen Z men</title><rect x="200.0" y="76.0" width="52.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="258.0" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">13%</text>
<text x="430" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE PSYCHOLOGY PROFESSOR</text>
<text x="532" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Britain, Gen Z men</text>
