<svg viewBox="0 0 680 124" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="33% of Gen Z men say a wife should obey her husband, against 18% of Gen Z women and 13% of boomer men" style="max-width:100%;height:auto">
<title>33% of Gen Z men say a wife should obey her husband, against 18% of Gen Z women and 13% of boomer men</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">AGREE THAT A WIFE SHOULD OBEY HER HUSBAND, 29 COUNTRIES, 2025</text>
<text x="142" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Gen Z men</text>
