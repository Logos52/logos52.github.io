<text x="466.2" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">33%</text>
<text x="142" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Gen Z women</text>
