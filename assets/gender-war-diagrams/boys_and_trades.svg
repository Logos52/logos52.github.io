<svg viewBox="0 0 680 188" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three things that fall harder on boys at school, and the pay of the trades many men choose instead" style="max-width:100%;height:auto">
<title>Three things that fall harder on boys at school, and the pay of the trades many men choose instead</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WHAT FALLS HARDER ON BOYS</text>
<rect x="20" y="22" width="200" height="56" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="120.0" y="46.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">verbal and executive skills</text>
<text x="120.0" y="60.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">12 to 18 months later than girls</text>
<rect x="240" y="22" width="200" height="56" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="340.0" y="46.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">ADHD diagnosed at</text>
<text x="340.0" y="60.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">twice the rate of girls</text>
<rect x="460" y="22" width="200" height="56" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="560.0" y="46.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">zero-tolerance discipline,</text>
<text x="560.0" y="60.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">less movement, sitting still</text>
<text x="20" y="110" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE OTHER ROAD</text>
<text x="292" y="129" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">electrician, plumber, HVAC technician, a year</text>
<g><title>$50,000 to $80,000 a year without tuition debt</title><rect x="300.0" y="118.0" width="260.0" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="566.0" y="129" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$50,000 to $80,000</text>
<text x="20" y="160" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Vocational enrolment at community colleges is up nearly 20% since 2020.</text>
<text x="20" y="176" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">42% of Gen Z adults were in or heading for blue-collar work in 2025.</text>
</svg>
