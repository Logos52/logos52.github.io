<svg viewBox="0 0 680 190" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four waves on the women's side and the growth of the manosphere on the men's side" style="max-width:100%;height:auto">
<title>Four waves on the women's side and the growth of the manosphere on the men's side</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE WOMEN'S SIDE, FOUR WAVES</text>
<rect x="20" y="22" width="150" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="95.0" y="40.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">1848 to 1920</text>
<text x="95.0" y="54.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the vote, property,</text>
<text x="95.0" y="68.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">citizenship</text>
<line x1="170.0" y1="51.0" x2="180.0" y2="51.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="180" y="22" width="150" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="255.0" y="40.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">1963 on</text>
<text x="255.0" y="54.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a book on unhappy wives,</text>
<text x="255.0" y="68.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">equal pay, Title IX</text>
<line x1="330.0" y1="51.0" x2="340.0" y2="51.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="340" y="22" width="150" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="415.0" y="40.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">1990s</text>
<text x="415.0" y="54.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">race, sex, and class</text>
<text x="415.0" y="68.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">overlap</text>
<line x1="490.0" y1="51.0" x2="500.0" y2="51.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="500" y="22" width="150" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="575.0" y="40.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">2012 on, online</text>
<text x="575.0" y="54.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">2017: one tweet,</text>
<text x="575.0" y="68.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">12 million engagements</text>
<text x="20" y="112" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE MEN'S SIDE</text>
<rect x="20" y="120" width="150" height="58" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="95.0" y="138.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">1993</text>
<text x="95.0" y="152.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a book on male</text>
<text x="95.0" y="166.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">disadvantage</text>
<line x1="170.0" y1="149.0" x2="180.0" y2="149.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="180" y="120" width="150" height="58" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="255.0" y="138.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">2008 and 2012</text>
<text x="255.0" y="152.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">two forums; one reached</text>
<text x="255.0" y="166.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">300,000 members</text>
<line x1="330.0" y1="149.0" x2="340.0" y2="149.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="340" y="120" width="150" height="58" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="415.0" y="138.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the manosphere</text>
<text x="415.0" y="152.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">rights activists, men who</text>
<text x="415.0" y="166.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">swore off women, incels</text>
<line x1="490.0" y1="149.0" x2="500.0" y2="149.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="500" y="120" width="150" height="58" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="575.0" y="138.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">2020s</text>
<text x="575.0" y="152.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a kickboxer with</text>
<text x="575.0" y="166.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">13.6 billion views</text>
</svg>
