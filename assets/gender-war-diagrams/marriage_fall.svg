<text x="430" y="138" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2024</text>
<text x="480" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WILL EVER MARRY</text>
<text x="532" y="41" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">boomers</text>
<g><title>87% to 92% of boomers</title><rect x="540.0" y="30.0" width="45.0" height="14.0" rx="3" fill="rgba(129,86,166,0.4)"/></g>
<text x="591.0" y="41" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">87 to 92%</text>
<text x="532" y="67" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Gen Z</text>
