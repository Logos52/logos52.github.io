<text x="200" y="138" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2024</text>
<text x="250" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">MEDIAN AGE AT FIRST MARRIAGE, MEN</text>
<line x1="250.0" y1="124.0" x2="450.0" y2="124.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<path d="M270.0,59.9 L430.0,40.5" fill="none" stroke="#5b6cb0" stroke-width="2" stroke-opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="270.0" cy="59.9" r="5" fill="#5b6cb0"/>
<text x="270" y="49.85882352941178" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">23.2</text>
<circle cx="430.0" cy="40.5" r="5" fill="#5b6cb0"/>
