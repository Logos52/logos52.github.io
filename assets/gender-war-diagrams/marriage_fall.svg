<svg viewBox="0 0 680 172" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Marriages per thousand fell from 10.6 to 6.2, first marriage moved past 30 for men, and barely half of Gen Z is expected to marry" style="max-width:100%;height:auto">
<title>Marriages per thousand fell from 10.6 to 6.2, first marriage moved past 30 for men, and barely half of Gen Z is expected to marry</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">MARRIAGES PER 1,000 AMERICANS</text>
<line x1="20.0" y1="124.0" x2="220.0" y2="124.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<path d="M40.0,42.3 L200.0,76.2" fill="none" stroke="#8156a6" stroke-width="2" stroke-opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="40.0" cy="42.3" r="5" fill="#8156a6"/>
