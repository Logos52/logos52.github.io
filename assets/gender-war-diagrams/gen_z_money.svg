<svg viewBox="0 0 680 122" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gen Z carries about $94,000 of debt each against $59,000 for millennials, and names housing and student debt as the barriers to marriage" style="max-width:100%;height:auto">
<title>Gen Z carries about $94,000 of debt each against $59,000 for millennials, and names housing and student debt as the barriers to marriage</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">AVERAGE PERSONAL DEBT AT THE SAME AGE</text>
<text x="122" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Gen Z</text>
<g><title>Gen Z: about $94,000</title><rect x="130.0" y="24.0" width="253.8" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="389.8" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$94,000</text>
<text x="122" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">millennials</text>
<g><title>millennials: about $59,000</title><rect x="130.0" y="50.0" width="159.3" height="14.0" rx="3" fill="rgba(129,86,166,0.6)"/></g>
<text x="295.3" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$59,000</text>
<text x="122" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Gen X</text>
<g><title>Gen X: about $53,000</title><rect x="130.0" y="76.0" width="143.1" height="14.0" rx="3" fill="rgba(129,86,166,0.4)"/></g>
<text x="279.1" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">$53,000</text>
<text x="430" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE BARRIER TO MARRIAGE</text>
<text x="512" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">housing costs</text>
<g><title>55% name housing costs</title><rect x="520.0" y="24.0" width="66.0" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="592.0" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">55%</text>
<text x="512" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">student debt</text>
<g><title>64% name student debt</title><rect x="520.0" y="50.0" width="76.8" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="602.8" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">64%</text>
<text x="20" y="110" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">41% of Gen Z run out of money before the month ends. 22% call themselves financially stable. 7.6% hold a mortgage.</text>
</svg>
