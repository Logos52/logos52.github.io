<svg viewBox="0 0 680 212" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The women's exit, 4B, and the two men's exits, going their own way and relocating abroad" style="max-width:100%;height:auto">
<title>The women's exit, 4B, and the two men's exits, going their own way and relocating abroad</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE WOMEN'S EXIT</text>
<rect x="20" y="22" width="300" height="70" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="170.0" y="46.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">4B, South Korea, about 2015</text>
<text x="170.0" y="60.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">no dating men, no sex with men,</text>
<text x="170.0" y="75.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">no marriage, no childbirth</text>
<rect x="340" y="22" width="320" height="70" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="500.0" y="46.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">United States, November 2024</text>
<text x="500.0" y="60.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">record searches within hours;</text>
<text x="500.0" y="75.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">one tweet, 17 million views that night</text>
<text x="20" y="122" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE MEN'S EXITS</text>
<rect x="20" y="130" width="300" height="70" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="170.0" y="154.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">men going their own way, from 2001</text>
<text x="170.0" y="168.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">no relationships, to avoid the risk</text>
<text x="170.0" y="183.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">of marriage and divorce; forum banned 2021</text>
<rect x="340" y="130" width="320" height="70" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="500.0" y="154.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">passport bros</text>
<text x="500.0" y="168.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">relocating to Thailand, Colombia,</text>
<text x="500.0" y="183.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">the Philippines, or Brazil for a partner</text>
</svg>
