<svg viewBox="0 0 680 156" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The young gender gap across 30 countries, Germany, and Britain, and young men's vote for AfD and Reform" style="max-width:100%;height:auto">
<title>The young gender gap across 30 countries, Germany, and Britain, and young men's vote for AfD and Reform</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE YOUNG GENDER GAP IN POLITICS, IN POINTS</text>
<text x="162" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">30 countries, 2000</text>
<g><title>Across 30 countries in 2000 the gap was 6 points</title><rect x="170.0" y="24.0" width="34.5" height="14.0" rx="3" fill="rgba(129,86,166,0.4)"/></g>
<text x="210.5" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">6 points</text>
<text x="162" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">30 countries, 2025</text>
<g><title>Across 30 countries in 2025 the gap is 30 points</title><rect x="170.0" y="50.0" width="172.5" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="348.5" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">30 points</text>
<text x="162" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Germany, under 30</text>
<g><title>Germany: 30 points</title><rect x="170.0" y="76.0" width="172.5" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="348.5" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">30 points</text>
<text x="162" y="113" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Britain, under 30</text>
<g><title>Britain: 25 points</title><rect x="170.0" y="102.0" width="143.8" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="319.75" y="113" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">25 points</text>
<text x="430" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE VOTE FOR THE NEW RIGHT, UNDER 25</text>
<text x="552" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">German men, AfD, 2025</text>
<g><title>One in four German men aged 18 to 24 voted AfD in 2025</title><rect x="560.0" y="24.0" width="66.7" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="632.6666666666666" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">25%</text>
<text x="552" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">British men, Reform, 2024</text>
<g><title>12% of British men under 24 voted Reform in 2024</title><rect x="560.0" y="50.0" width="32.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="598.0" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">12%</text>
<text x="552" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">British women, Reform, 2024</text>
<g><title>6% of British women under 24 voted Reform in 2024</title><rect x="560.0" y="76.0" width="16.0" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="582.0" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">6%</text>
</svg>
