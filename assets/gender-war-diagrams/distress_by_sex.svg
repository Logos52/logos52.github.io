<svg viewBox="0 0 680 180" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Girls report more sadness, men die by suicide at nearly four times the rate, and time with friends has more than halved" style="max-width:100%;height:auto">
<title>Girls report more sadness, men die by suicide at nearly four times the rate, and time with friends has more than halved</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">PERSISTENT SADNESS, HIGH SCHOOL, 2023</text>
