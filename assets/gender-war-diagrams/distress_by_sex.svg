<text x="340" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">SUICIDES PER 100,000</text>
<text x="392" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">men</text>
