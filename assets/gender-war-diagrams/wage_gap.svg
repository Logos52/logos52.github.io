<svg viewBox="0 0 680 126" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The pay gap narrows from 85 cents to 99 cents as the comparison tightens" style="max-width:100%;height:auto">
<title>The pay gap narrows from 85 cents to 99 cents as the comparison tightens</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WHAT WOMEN EARN PER DOLLAR MEN EARN</text>
<text x="322" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">all full-time workers</text>
<g><title>85 cents across all full-time workers</title><rect x="330.0" y="24.0" width="246.5" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="582.5" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">85 cents</text>
<text x="322" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">workers aged 25 to 35</text>
<g><title>95 cents at ages 25 to 35</title><rect x="330.0" y="50.0" width="275.5" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="611.5" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">95 cents</text>
<text x="322" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">same title, hours, experience, industry, education</text>
<g><title>about 99 cents in truly equivalent roles</title><rect x="330.0" y="76.0" width="287.1" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="623.1" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">99 cents</text>
<line x1="620.0" y1="22.0" x2="620.0" y2="100.0" stroke="rgba(130,130,130,.8)" stroke-width="1.2"/>
<text x="620" y="114" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">$1</text>
</svg>
