<svg viewBox="0 0 680 152" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The squares were isolated for almost 40,000 years; dogs became a species 15,000 to 30,000 years ago" style="max-width:100%;height:auto">
<title>The squares were isolated for almost 40,000 years; dogs became a species 15,000 to 30,000 years ago</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">YEARS, AS THE ACCOUNT GIVES THEM</text>
<text x="252" y="39" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">the squares' desert isolation</text>
<g><title>almost 40,000 years</title><rect x="260.0" y="26.0" width="380.0" height="16.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="646.0" y="39" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">40,000</text>
<text x="252" y="69" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">dogs as a species, upper figure</text>
<g><title>about 30,000 years</title><rect x="260.0" y="56.0" width="285.0" height="16.0" rx="3" fill="rgba(130,130,130,.55)"/></g>
<text x="551.0" y="69" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">30,000</text>
<text x="252" y="99" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">dogs as a species, lower figure</text>
<g><title>about 15,000 years</title><rect x="260.0" y="86.0" width="142.5" height="16.0" rx="3" fill="rgba(130,130,130,.55)"/></g>
<text x="408.5" y="99" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">15,000</text>
<text x="20" y="140" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Longer than dogs have been dogs, with little mixing, is where the account puts the distance.</text>
</svg>
