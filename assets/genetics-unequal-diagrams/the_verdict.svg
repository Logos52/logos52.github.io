<svg viewBox="0 0 680 160" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The account's verdict: mixed societies pleased nobody, and the people who kept their society for themselves chose right" style="max-width:100%;height:auto">
<title>The account's verdict: mixed societies pleased nobody, and the people who kept their society for themselves chose right</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE ACCOUNT'S CLOSING VERDICT</text>
<rect x="20" y="26" width="305" height="96" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="172.5" y="55.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">circles tried mixed societies</text>
<text x="172.5" y="70.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">results pleased nobody:</text>
<text x="172.5" y="84.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">not circles, not squares,</text>
<text x="172.5" y="99.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">not square-circles</text>
<rect x="355" y="26" width="305" height="96" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="507.5" y="55.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">triangles declined to try</text>
<text x="507.5" y="70.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">kept their society tuned</text>
<text x="507.5" y="84.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">to themselves; called callous,</text>
<text x="507.5" y="99.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">hard to argue with, on the results</text>
<text x="20" y="148" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The one indicator the account names for how squares fare is how far circles run the administration.</text>
</svg>
