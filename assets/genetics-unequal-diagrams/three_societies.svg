<svg viewBox="0 0 680 136" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The societies each shape built: circles decentralized, triangles centralized, squares none comparable" style="max-width:100%;height:auto">
<title>The societies each shape built: circles decentralized, triangles centralized, squares none comparable</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE SOCIETIES EACH SHAPE BUILT, ON THE ACCOUNT</text>
<rect x="20" y="26" width="200" height="70" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="120.0" y="50.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">circles</text>
<text x="120.0" y="64.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">individualistic,</text>
<text x="120.0" y="79.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">decentralized</text>
<rect x="240" y="26" width="200" height="70" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="340.0" y="50.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">triangles</text>
<text x="340.0" y="64.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">collectivist,</text>
<text x="340.0" y="79.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">centralized</text>
<rect x="460" y="26" width="200" height="70" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="560.0" y="50.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">squares</text>
<text x="560.0" y="64.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">no comparable</text>
<text x="560.0" y="79.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">civilization</text>
<text x="20" y="124" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Each people, the account says, built the society its own neurology runs best in, so no one system fits all three.</text>
</svg>
