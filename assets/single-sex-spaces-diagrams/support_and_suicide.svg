<svg viewBox="0 0 680 108" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="85% of men rely on a spouse for emotional support, and 44% reported thoughts of suicide in a two-week window" style="max-width:100%;height:auto">
<title>85% of men rely on a spouse for emotional support, and 44% reported thoughts of suicide in a two-week window</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">SPOUSE IS THE MAIN EMOTIONAL SUPPORT, 2025</text>
<text x="72" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">men</text>
<g><title>85% of men</title><rect x="80.0" y="24.0" width="187.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="273.0" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">85%</text>
<text x="72" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">women</text>
<g><title>72% of women</title><rect x="80.0" y="50.0" width="158.4" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="244.4" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">72%</text>
<text x="340" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">AMERICAN MEN, 2023 SURVEY</text>
<text x="552" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">thought of suicide in the past two weeks</text>
<g><title>44% of men</title><rect x="560.0" y="24.0" width="35.2" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="601.2" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">44%</text>
<text x="552" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">aged 18 to 23: nobody really knows me</text>
<g><title>65% of men aged 18 to 23</title><rect x="560.0" y="50.0" width="52.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="618.0" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">65%</text>
<text x="20" y="96" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Almost 39,000 American men killed themselves in 2023, one every 14 minutes. Almost 80% of American suicides are male.</text>
</svg>
