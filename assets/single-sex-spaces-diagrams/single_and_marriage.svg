<svg viewBox="0 0 680 206" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="63% of young men are single against 34% of young women, and half of working-class men under 40 have never married" style="max-width:100%;height:auto">
<title>63% of young men are single against 34% of young women, and half of working-class men under 40 have never married</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">SINGLE, AGES 18 TO 29, 2022</text>
<text x="72" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">men</text>
<g><title>63% of men 18 to 29 were single</title><rect x="80.0" y="24.0" width="138.6" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="224.6" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">63%</text>
<text x="72" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">women</text>
<g><title>34% of women 18 to 29 were single</title><rect x="80.0" y="50.0" width="74.8" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="160.8" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">34%</text>
<text x="340" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WORKING-CLASS MEN UNDER 40 NEVER MARRIED</text>
<line x1="340.0" y1="110.0" x2="640.0" y2="110.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<path d="M360.0,76.7 L620.0,43.3" fill="none" stroke="#5b6cb0" stroke-width="2" stroke-opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="360.0" cy="76.7" r="5" fill="#5b6cb0"/>
<text x="360" y="66.66666666666666" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">25%</text>
<circle cx="620.0" cy="43.3" r="5" fill="#5b6cb0"/>
<text x="620" y="33.33333333333333" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">50%</text>
<text x="360" y="124" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">1980</text>
<text x="620" y="124" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2018</text>
<text x="20" y="96" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">SINGLE PEOPLE LOOKING FOR A RELATIONSHIP OR DATES</text>
<text x="102" y="117" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">men, 2019</text>
<g><title>61% of single men in 2019</title><rect x="110.0" y="106.0" width="115.9" height="14.0" rx="3" fill="rgba(91,108,176,0.5)"/></g>
<text x="231.9" y="117" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">61%</text>
<text x="102" y="139" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">men, 2022</text>
<g><title>50% in 2022</title><rect x="110.0" y="128.0" width="95.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="211.0" y="139" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">50%</text>
<text x="102" y="161" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">women, 2019</text>
<g><title>38% of single women in 2019</title><rect x="110.0" y="150.0" width="72.2" height="14.0" rx="3" fill="rgba(47,158,143,0.5)"/></g>
<text x="188.2" y="161" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">38%</text>
<text x="102" y="183" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">women, 2022</text>
<g><title>35% in 2022</title><rect x="110.0" y="172.0" width="66.5" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="182.5" y="183" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">35%</text>
<text x="340" y="150" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Median first marriage: 23.2 for men and 20.8 for women in 1970,</text>
<text x="340" y="166" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">30.5 and 28.6 in 2024.</text>
</svg>
