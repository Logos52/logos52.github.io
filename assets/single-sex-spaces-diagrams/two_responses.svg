<svg viewBox="0 0 680 146" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The two visible male responses, the manosphere and the performative male" style="max-width:100%;height:auto">
<title>The two visible male responses, the manosphere and the performative male</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">TWO VISIBLE MALE RESPONSES</text>
<rect x="20" y="24" width="310" height="84" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="175.0" y="48.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the manosphere</text>
<text x="175.0" y="62.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">podcasts, channels, servers, forums</text>
<text x="175.0" y="76.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">that name the grievance head on;</text>
<text x="175.0" y="90.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">some of it holds, some distorts, some is false</text>
<rect x="350" y="24" width="310" height="84" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="505.0" y="48.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the performative male</text>
<text x="505.0" y="62.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a feminist slogan on the tote bag,</text>
<text x="505.0" y="76.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a visible feminist book,</text>
<text x="505.0" y="90.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">read as a mating strategy</text>
<text x="20" y="134" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The majority of men in the middle are neither, and they stop participating.</text>
</svg>
