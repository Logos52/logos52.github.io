<svg viewBox="0 0 680 124" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Millions of American men in fraternal orders in 1897, the 1950s, and 1990" style="max-width:100%;height:auto">
<title>Millions of American men in fraternal orders in 1897, the 1950s, and 1990</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">AMERICAN MEN IN FRATERNAL ORDERS, MILLIONS</text>
<text x="182" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">1897, all orders</text>
<g><title>5.4 million men, about one in five adults</title><rect x="190.0" y="24.0" width="285.4" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="481.42857142857144" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">5.4 million</text>
<text x="182" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">1950s, Freemasons alone</text>
<g><title>About 4 million Freemasons at the peak</title><rect x="190.0" y="50.0" width="211.4" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="407.42857142857144" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">4 million</text>
<text x="182" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">1990, all orders</text>
<g><title>Over 6 million members across 568 orders</title><rect x="190.0" y="76.0" width="317.1" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="513.1428571428571" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">6 million</text>
<text x="20" y="112" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The orders paid rent, funerals, and widows' stipends before Social Security in 1935 and Medicare in 1965.</text>
</svg>
