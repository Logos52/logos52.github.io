<svg viewBox="0 0 680 174" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The pessimistic, optimistic, and realistic paths the video draws" style="max-width:100%;height:auto">
<title>The pessimistic, optimistic, and realistic paths the video draws</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THREE PATHS THE VIDEO DRAWS</text>
<rect x="20" y="24" width="200" height="110" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="120.0" y="54.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">pessimistic</text>
<text x="120.0" y="68.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">suspicion of men's groups stays,</text>
<text x="120.0" y="82.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">grievance turns to resentment,</text>
<text x="120.0" y="96.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">dating fractures, births fall,</text>
<text x="120.0" y="110.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">deaths of despair hold or rise</text>
<rect x="240" y="24" width="200" height="110" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="340.0" y="54.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">optimistic</text>
<text x="340.0" y="68.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">boys start school later,</text>
<text x="340.0" y="82.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">male teachers, sheds funded,</text>
<text x="340.0" y="96.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">tax credit for non-college men,</text>
<text x="340.0" y="110.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">loneliness as a health crisis</text>
<rect x="460" y="24" width="200" height="110" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="560.0" y="54.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">realistic</text>
<text x="560.0" y="68.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">men's status clubs keep shrinking,</text>
<text x="560.0" y="82.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">women's spaces keep protection,</text>
<text x="560.0" y="96.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">men's spaces survive as health,</text>
<text x="560.0" y="110.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">faith, service, sport, or craft</text>
<text x="20" y="162" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">In 2025 California's governor signed an executive order on boys' and men's mental health and schooling.</text>
</svg>
