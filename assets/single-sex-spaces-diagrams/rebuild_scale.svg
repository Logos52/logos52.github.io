<svg viewBox="0 0 680 124" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The men's sheds and the dawn-workout network against the four million Freemasons of the 1950s" style="max-width:100%;height:auto">
<title>The men's sheds and the dawn-workout network against the four million Freemasons of the 1950s</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE REBUILDS AGAINST THE OLD SCALE</text>
<text x="252" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Freemasons, 1950s</text>
<g><title>About 4 million Freemasons</title><rect x="260.0" y="24.0" width="360.0" height="14.0" rx="3" fill="rgba(91,108,176,0.4)"/></g>
<text x="626.0" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">4,000,000</text>
<text x="252" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">dawn-workout network, 2024</text>
<g><title>Over 50,000 participants at 3,500 sites</title><rect x="260.0" y="50.0" width="4.5" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="270.5" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">50,000</text>
<text x="252" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">men's sheds worldwide, 2026, sheds</text>
<g><title>About 3,000 sheds across 12 countries</title><rect x="260.0" y="76.0" width="0.3" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="266.27" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">3,000</text>
<text x="20" y="112" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Sheds: more than 1,200 in Australia and over 450 in Ireland. Regulars score lower on loneliness and depression.</text>
</svg>
