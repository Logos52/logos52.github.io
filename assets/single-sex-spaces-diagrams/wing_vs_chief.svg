<svg viewBox="0 0 680 162" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The coworking club that lost its women-only rule and the executive club valued at $1.1 billion that kept it" style="max-width:100%;height:auto">
<title>The coworking club that lost its women-only rule and the executive club valued at $1.1 billion that kept it</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">TWO WOMEN-ONLY CLUBS</text>
<rect x="20" y="24" width="310" height="100" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="175.0" y="49.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the coworking club, 2016 to 2022</text>
<text x="175.0" y="63.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">$75 million raised, valued at $200 to $400 million</text>
<text x="175.0" y="77.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">12,000 members, 35,000 waiting</text>
<text x="175.0" y="91.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a 2018 complaint ended women-only;</text>
<text x="175.0" y="105.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">closed August 2022</text>
<rect x="350" y="24" width="310" height="100" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="505.0" y="49.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the executive club, 2019 on</text>
<text x="505.0" y="63.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">$140 million raised, valued at $1.1 billion</text>
<text x="505.0" y="77.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">20,000 members, 60,000 waiting</text>
<text x="505.0" y="91.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">$5,800 to $8,900 a year;</text>
<text x="505.0" y="105.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">no complaint, no male equivalent</text>
<text x="20" y="150" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The complaint against the first used the same city law that had opened the New York Athletic Club in 1988.</text>
</svg>
