<svg viewBox="0 0 680 114" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Boy Scouts membership fell from about 6 million in 1972 to about 1 million" style="max-width:100%;height:auto">
<title>Boy Scouts membership fell from about 6 million in 1972 to about 1 million</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">BOY SCOUTS MEMBERSHIP, MILLIONS</text>
<text x="122" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">1972, the peak</text>
<g><title>About 6 million members in 1972</title><rect x="130.0" y="24.0" width="368.6" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="504.57142857142856" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">about 6 million</text>
<text x="122" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">today</text>
<g><title>About 1 million members</title><rect x="130.0" y="50.0" width="61.4" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="197.42857142857144" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">about 1 million</text>
<text x="20" y="86" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Girls admitted in 2018 and 2019. The organisation renamed itself in 2024 and left bankruptcy with a $2.46 billion settlement.</text>
<text x="20" y="102" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The Girl Scouts stayed girls-only.</text>
</svg>
