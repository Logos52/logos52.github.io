<svg viewBox="0 0 680 124" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The women-only gym chain's locations at its 2006 peak and in 2019" style="max-width:100%;height:auto">
<title>The women-only gym chain's locations at its 2006 peak and in 2019</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE WOMEN-ONLY GYM CHAIN, LOCATIONS</text>
<text x="172" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">worldwide, 2006 peak</text>
<g><title>Over 10,000 locations worldwide in October 2006</title><rect x="180.0" y="24.0" width="345.5" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="531.4545454545455" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">10,000</text>
<text x="172" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">United States, 2006</text>
<g><title>7,848 in the United States</title><rect x="180.0" y="50.0" width="271.1" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="457.1127272727273" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">7,848</text>
<text x="172" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">United States, 2019</text>
<g><title>About 367 American franchises by 2019</title><rect x="180.0" y="76.0" width="12.7" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="198.67818181818183" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">367</text>
<text x="20" y="112" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Still legal under state carve-outs in Massachusetts, New York, and Connecticut. No state permits a male-only gym chain.</text>
</svg>
