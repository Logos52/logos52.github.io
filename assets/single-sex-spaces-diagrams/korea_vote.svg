<svg viewBox="0 0 680 124" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Young men and women split 59 to 34 in Korea's 2022 election and about 56 to 60 the other way in America's 2024 election" style="max-width:100%;height:auto">
<title>Young men and women split 59 to 34 in Korea's 2022 election and about 56 to 60 the other way in America's 2024 election</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">SOUTH KOREA, 2022 PRESIDENTIAL VOTE FOR THE WINNER</text>
<text x="122" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">men 18 to 29</text>
<g><title>59% of men aged 18 to 29</title><rect x="130.0" y="24.0" width="112.1" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="248.1" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">59%</text>
<text x="122" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">women 18 to 29</text>
<g><title>34% of women aged 18 to 29</title><rect x="130.0" y="50.0" width="64.6" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="200.6" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">34%</text>
<text x="360" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">UNITED STATES, 2024, AGES 18 TO 29</text>
<text x="472" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">men, Republican</text>
<g><title>About 56% to 57% of young men</title><rect x="480.0" y="24.0" width="89.6" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="575.6" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">56%</text>
<text x="472" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">women, Democrat</text>
<g><title>About 60% of young women</title><rect x="480.0" y="50.0" width="96.0" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="582.0" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">60%</text>
<text x="20" y="96" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">66% of Korean men in their twenties could not accept a feminist as a neighbour or friend in 2021.</text>
<text x="20" y="112" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Korea's births per woman: 0.72 to 0.74 in 2024.</text>
</svg>
