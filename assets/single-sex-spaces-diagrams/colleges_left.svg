<svg viewBox="0 0 680 124" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="More than 250 women's colleges in 1960, about 30 today, and three men's colleges" style="max-width:100%;height:auto">
<title>More than 250 women's colleges in 1960, about 30 today, and three men's colleges</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">SINGLE-SEX COLLEGES IN THE UNITED STATES</text>
<text x="252" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">women's colleges, 1960</text>
<g><title>More than 250 women's colleges in 1960</title><rect x="260.0" y="24.0" width="346.2" height="14.0" rx="3" fill="rgba(47,158,143,0.5)"/></g>
<text x="612.1538461538462" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">more than 250</text>
<text x="252" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">women's colleges, still women-only</text>
<g><title>About 30 remain women-only</title><rect x="260.0" y="50.0" width="41.5" height="14.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="307.53846153846155" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">about 30</text>
<text x="252" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">men's colleges, still men-only, 2026</text>
<g><title>Three four-year colleges remain all-male</title><rect x="260.0" y="76.0" width="4.2" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="270.15384615384613" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">3</text>
<text x="20" y="112" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Title IX exempts institutions that have always been single-sex, which is what keeps the women's colleges legal.</text>
</svg>
