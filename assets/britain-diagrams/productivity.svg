<svg viewBox="0 0 680 108" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="British output per hour grew 0.6% a year against 1.9% in America, on the lowest investment in the G7" style="max-width:100%;height:auto">
<title>British output per hour grew 0.6% a year against 1.9% in America, on the lowest investment in the G7</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">GROWTH IN OUTPUT PER HOUR, A YEAR, 2008 TO 2024</text>
<text x="122" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">United States</text>
<g><title>1.9% a year</title><rect x="130.0" y="24.0" width="233.2" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="369.18181818181813" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">1.9%</text>
<text x="122" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Britain</text>
<g><title>0.6% a year, worst in the G7 after Italy</title><rect x="130.0" y="50.0" width="73.6" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="209.63636363636363" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">0.6%</text>
<text x="430" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">INVESTMENT, SHARE OF OUTPUT, 2024</text>
<text x="482" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Britain</text>
<g><title>18.9%, the lowest in the G7</title><rect x="490.0" y="24.0" width="113.4" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="609.4" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">18.9%</text>
<text x="20" y="96" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Between 2019 and 2024 British productivity fell 0.5%, the second worst five years since the series began.</text>
</svg>
