<svg viewBox="0 0 680 174" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Net immigration of 944,000 in one year, then a two-thirds fall as visas tightened" style="max-width:100%;height:auto">
<title>Net immigration of 944,000 in one year, then a two-thirds fall as visas tightened</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">NET IMMIGRATION, A YEAR</text>
<text x="182" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">year to March 2023</text>
<g><title>944,000, about the population of Glasgow</title><rect x="190.0" y="24.0" width="349.3" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="545.28" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">944,000</text>
<text x="182" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">year to June 2025</text>
<g><title>204,000 after visa rules tightened</title><rect x="190.0" y="50.0" width="75.5" height="14.0" rx="3" fill="rgba(91,108,176,0.5)"/></g>
<text x="271.48" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">204,000</text>
<text x="20" y="90" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">CARE-WORKER VISAS</text>
<text x="182" y="111" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">2023</text>
<g><title>145,823</title><rect x="190.0" y="100.0" width="337.2" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="533.2156875000001" y="111" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">145,823</text>
<text x="182" y="137" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">2024</text>
<g><title>27,174, down 81% after dependants were barred</title><rect x="190.0" y="126.0" width="62.8" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="258.839875" y="137" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">27,174</text>
<text x="20" y="162" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">2021 to 2024: 2.55 million net arrivals, 3.8% of the population. About 89% of the decade's rise in England's housing shortfall.</text>
</svg>
