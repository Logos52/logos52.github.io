<svg viewBox="0 0 680 214" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Britain has the land and withholds the permission; Texas builds and its rents fall" style="max-width:100%;height:auto">
<title>Britain has the land and withholds the permission; Texas builds and its rents fall</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">PERMISSION, NOT LAND</text>
<rect x="20" y="24" width="150" height="84" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="95.0" y="48.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">8.7% of Britain</text>
<text x="95.0" y="62.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">is built on;</text>
<text x="95.0" y="76.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">12.6% of England</text>
<text x="95.0" y="90.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">is green belt</text>
<rect x="190" y="24" width="150" height="84" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="265.0" y="55.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">£100 million tunnel</text>
<text x="265.0" y="69.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">for bats on a railway,</text>
<text x="265.0" y="83.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">8,276 approvals</text>
<rect x="360" y="24" width="150" height="84" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="435.0" y="55.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">449 flats refused</text>
<text x="435.0" y="69.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">because one block</text>
<text x="435.0" y="83.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">was five storeys</text>
<rect x="530" y="24" width="130" height="84" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="595.0" y="48.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a nuclear plant</text>
<text x="595.0" y="62.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">delayed for terns,</text>
<text x="595.0" y="76.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a theme park</text>
<text x="595.0" y="90.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">killed by spiders</text>
<text x="20" y="138" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">TEXAS BUILDS</text>
<rect x="20" y="146" width="310" height="56" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="175.0" y="170.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">Austin: 120,000 homes in nine years,</text>
<text x="175.0" y="184.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">rents down 16% to 22% from the peak</text>
<rect x="350" y="146" width="310" height="56" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="505.0" y="170.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">Dallas and Fort Worth, 2024: 71,788 permits,</text>
<text x="505.0" y="184.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">about what all of Britain builds</text>
</svg>
