<svg viewBox="0 0 680 124" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Britons guessed their country would rank seventh among American states on income per person; it ranks last" style="max-width:100%;height:auto">
<title>Britons guessed their country would rank seventh among American states on income per person; it ranks last</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">IF BRITAIN WERE AN AMERICAN STATE, ITS RANK ON INCOME PER PERSON</text>
<line x1="60.0" y1="60.0" x2="620.0" y2="60.0" stroke="rgba(130,130,130,.35)" stroke-width="1.5"/>
<line x1="60.0" y1="54.0" x2="60.0" y2="66.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<text x="60.0" y="82" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">1st, richest</text>
<line x1="160.8" y1="54.0" x2="160.8" y2="66.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<text x="160.8" y="82" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">10th</text>
<line x1="328.8" y1="54.0" x2="328.8" y2="66.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<text x="328.8" y="82" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">25th</text>
<line x1="496.8" y1="54.0" x2="496.8" y2="66.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<text x="496.8" y="82" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">40th</text>
<line x1="620.0" y1="54.0" x2="620.0" y2="66.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<text x="620.0" y="82" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">51st, last</text>
<circle cx="127.2" cy="60" r="7" fill="#8156a6"/>
<text x="127.2" y="40" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">the average guess: 7th</text>
<circle cx="620.0" cy="60" r="7" fill="#5b6cb0"/>
<text x="610.0" y="40" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="end">the answer: 51st</text>
<text x="20" y="112" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">3,000 voters were asked in April 2026. Britain sits behind Alabama, West Virginia, Arkansas, and Mississippi.</text>
</svg>
