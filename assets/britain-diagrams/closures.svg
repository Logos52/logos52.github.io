<svg viewBox="0 0 680 162" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Britain has no green steel projects and closed its last blast furnace and refinery as electricity costs four times America's" style="max-width:100%;height:auto">
<title>Britain has no green steel projects and closed its last blast furnace and refinery as electricity costs four times America's</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">GREEN STEEL PROJECTS UNDER CONSTRUCTION</text>
<text x="102" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Germany</text>
<g><title>8</title><rect x="110.0" y="24.0" width="168.9" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="284.8888888888889" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">8</text>
<text x="102" y="57" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">France</text>
<g><title>3</title><rect x="110.0" y="46.0" width="63.3" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="179.33333333333334" y="57" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">3</text>
<text x="102" y="79" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Spain</text>
<g><title>2</title><rect x="110.0" y="68.0" width="42.2" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="158.22222222222223" y="79" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">2</text>
<text x="102" y="101" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Britain</text>
<g><title>0</title><rect x="110.0" y="90.0" width="0.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="116.0" y="101" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">0</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<rect x="340" y="24" width="320" height="100" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="500.0" y="49.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">2024: the last blast furnace in Wales closes</text>
<text x="500.0" y="63.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">2025: Scotland's last refinery shuts, 400 jobs</text>
<text x="500.0" y="77.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">2025: the largest company on the exchange</text>
<text x="500.0" y="91.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">cancels a £450 million plant at home</text>
<text x="500.0" y="105.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">and commits $50 billion to America</text>
<text x="20" y="150" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Industrial electricity: 26.63 pence a kilowatt-hour in 2026, about four times the American price.</text>
</svg>
