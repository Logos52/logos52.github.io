<svg viewBox="0 0 680 162" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Debt heading for 275% of output while total output grows and income per person slides in rank" style="max-width:100%;height:auto">
<title>Debt heading for 275% of output while total output grows and income per person slides in rank</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">DEBT, SHARE OF OUTPUT</text>
<line x1="20.0" y1="114.0" x2="220.0" y2="114.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<path d="M40.0,91.0 L200.0,46.1" fill="none" stroke="#5b6cb0" stroke-width="2" stroke-opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="40.0" cy="91.0" r="5" fill="#5b6cb0"/>
<text x="40" y="81.02352941176471" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">93%</text>
<circle cx="200.0" cy="46.1" r="5" fill="#5b6cb0"/>
<text x="200" y="36.05882352941177" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">275%</text>
<text x="40" y="128" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2026</text>
<text x="200" y="128" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2070s</text>
<text x="250" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">TOTAL OUTPUT, $ TRILLION</text>
<line x1="250.0" y1="114.0" x2="450.0" y2="114.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<path d="M270.0,72.0 L430.0,42.6" fill="none" stroke="#8156a6" stroke-width="2" stroke-opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="270.0" cy="72.0" r="5" fill="#8156a6"/>
<text x="270" y="62.0" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">4</text>
<circle cx="430.0" cy="42.6" r="5" fill="#8156a6"/>
<text x="430" y="32.60000000000001" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">6.8</text>
<text x="270" y="128" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">mid-2020s</text>
<text x="430" y="128" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2040</text>
<text x="480" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">RANK ON INCOME PER PERSON</text>
<rect x="480" y="24" width="180" height="60" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
