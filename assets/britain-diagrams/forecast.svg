<text x="570.0" y="64.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">low 20s by 2040</text>
<text x="20" y="150" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Fifth largest economy on paper, sliding on the ground. 9% of Britons think the country is wealthy enough and 70% expect it to get worse.</text>
