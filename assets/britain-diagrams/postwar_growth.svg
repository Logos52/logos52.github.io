<svg viewBox="0 0 680 124" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Post-war growth: Japan 10% a year, West Germany 8%, Britain 2.5%" style="max-width:100%;height:auto">
<title>Post-war growth: Japan 10% a year, West Germany 8%, Britain 2.5%</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">GROWTH A YEAR, THE DECADES AFTER THE WAR</text>
<text x="182" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Japan, 1960s</text>
<g><title>10% a year</title><rect x="190.0" y="24.0" width="336.4" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="532.3636363636364" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">10%</text>
<text x="182" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">West Germany, 1950s</text>
<g><title>8% a year</title><rect x="190.0" y="50.0" width="269.1" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="465.09090909090907" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">8%</text>
<text x="182" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Britain</text>
<g><title>2.5% a year</title><rect x="190.0" y="76.0" width="84.1" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="280.0909090909091" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">2.5%</text>
<text x="20" y="112" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">By 1970 the richest large economy in Europe of 1945 was fourteenth in the world on income per person.</text>
</svg>
