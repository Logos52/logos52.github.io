<svg viewBox="0 0 680 124" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Social tenants stay three times as long as private renters while 1.34 million households wait" style="max-width:100%;height:auto">
<title>Social tenants stay three times as long as private renters while 1.34 million households wait</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">STAYED IN THE SAME HOME OVER TEN YEARS</text>
<text x="122" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">social tenants</text>
<g><title>45%</title><rect x="130.0" y="24.0" width="85.5" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="221.5" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">45%</text>
<text x="122" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">private renters</text>
<g><title>15%</title><rect x="130.0" y="50.0" width="28.5" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="164.5" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">15%</text>
<text x="360" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WAITING OUTSIDE</text>
<text x="562" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">households on waiting lists</text>
<g><title>1.34 million households</title><rect x="570.0" y="24.0" width="28.7" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="604.7142857142857" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">1.34 million</text>
<text x="562" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">children in temporary accommodation</text>
<g><title>165,000 children</title><rect x="570.0" y="50.0" width="3.5" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="579.5357142857143" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">165,000</text>
<text x="20" y="96" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">6% of social homes came free in a year, 2.7% in London. 78% of new tenancies are for life.</text>
<text x="20" y="112" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Three London boroughs have waits over a hundred years.</text>
</svg>
