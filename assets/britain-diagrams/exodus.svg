<svg viewBox="0 0 680 174" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Millionaires and young citizens leaving, and a junior doctor's pay in Britain against Perth" style="max-width:100%;height:auto">
<title>Millionaires and young citizens leaving, and a junior doctor's pay in Britain against Perth</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WHO LEFT IN ONE YEAR</text>
<text x="182" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">millionaires, 2025</text>
<g><title>16,500 millionaires, taking $91.8 billion</title><rect x="190.0" y="24.0" width="23.5" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="219.48076923076923" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">16,500</text>
<text x="182" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">citizens, all, 2024</text>
<g><title>252,000 citizens, three-quarters under 35</title><rect x="190.0" y="50.0" width="358.6" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="554.6153846153846" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">252,000</text>
<text x="20" y="90" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">A JUNIOR DOCTOR'S PAY FOR THE SAME WORK</text>
<text x="182" y="111" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Britain</text>
<g><title>About £37,000</title><rect x="190.0" y="100.0" width="161.1" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="357.05882352941177" y="111" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">£37,000</text>
<text x="182" y="137" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Perth, Australia</text>
<g><title>About £80,000, shorter shifts</title><rect x="190.0" y="126.0" width="348.2" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="544.2352941176471" y="137" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">£80,000</text>
<text x="20" y="162" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">British-trained doctors were the largest overseas source for the whole Australian health system in 2024.</text>
</svg>
