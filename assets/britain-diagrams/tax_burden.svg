<svg viewBox="0 0 680 150" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="More taxpayers pushed into the 40% rate, and a 62% marginal rate on the income band a country most wants to keep" style="max-width:100%;height:auto">
<title>More taxpayers pushed into the 40% rate, and a 62% marginal rate on the income band a country most wants to keep</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">TAXPAYERS ON THE 40% RATE</text>
<line x1="20.0" y1="114.0" x2="220.0" y2="114.0" stroke="rgba(130,130,130,.35)" stroke-width="1"/>
<path d="M40.0,72.0 L200.0,46.8" fill="none" stroke="#5b6cb0" stroke-width="2" stroke-opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="40.0" cy="72.0" r="5" fill="#5b6cb0"/>
<text x="40" y="62.0" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">15%</text>
<circle cx="200.0" cy="46.8" r="5" fill="#5b6cb0"/>
<text x="200" y="36.8" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="middle">24%</text>
<text x="40" y="128" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2021</text>
<text x="200" y="128" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">2030</text>
<text x="250" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">EFFECTIVE MARGINAL RATE</text>
<text x="392" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">£100,000 to £125,140</text>
<g><title>62%, as the tax-free allowance is withdrawn</title><rect x="400.0" y="24.0" width="194.9" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="600.8571428571429" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">62%</text>
<text x="392" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">£400,000</text>
<g><title>Lower than the band below it</title><rect x="400.0" y="50.0" width="141.4" height="14.0" rx="3" fill="rgba(91,108,176,0.5)"/></g>
<text x="547.4285714285714" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">lower</text>
<text x="250" y="90" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Total tax reaches 37.7% of output by 2027. The £12,570 allowance is frozen to 2031,</text>
<text x="250" y="106" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">which raises £55.5 billion a year by 2030 without a vote.</text>
</svg>
