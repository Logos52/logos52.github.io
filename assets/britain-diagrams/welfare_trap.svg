<svg viewBox="0 0 680 140" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A single parent who takes a £10,000 raise can keep under £2,000 of it" style="max-width:100%;height:auto">
<title>A single parent who takes a £10,000 raise can keep under £2,000 of it</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">A SINGLE PARENT WITH TWO CHILDREN IN COUNCIL HOUSING</text>
<rect x="20" y="24" width="200" height="60" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="120.0" y="57.666666666666664" font-size="11" fill="currentColor" opacity="0.85" text-anchor="middle">a £20,000 job</text>
<line x1="220.0" y1="54.0" x2="260.0" y2="54.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="262" y="24" width="200" height="60" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="362.0" y="57.666666666666664" font-size="11" fill="currentColor" opacity="0.85" text-anchor="middle">a £30,000 job</text>
<line x1="462.0" y1="54.0" x2="502.0" y2="54.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="504" y="24" width="156" height="60" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="582.0" y="50.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">keeps under £2,000</text>
<text x="582.0" y="64.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">of the extra £10,000</text>
<text x="20" y="112" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Withdrawn housing benefit, withdrawn credits, withdrawn childcare help, and higher tax take more than 80% in the worst cases.</text>
<text x="20" y="128" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">About 2.8 million people are on long-term sickness benefits, and the state pays more in working-age welfare than it collects in income tax.</text>
</svg>
