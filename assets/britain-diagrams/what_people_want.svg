<svg viewBox="0 0 680 190" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The public asks for growth, cheap energy, lower taxes, and easier planning, and support for higher taxes is at a twelve-year low" style="max-width:100%;height:auto">
<title>The public asks for growth, cheap energy, lower taxes, and easier planning, and support for higher taxes is at a twelve-year low</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">BRITONS WHO SUPPORT, APRIL 2026</text>
<text x="202" y="35" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">more economic growth</text>
<g><title>87%</title><rect x="210.0" y="24.0" width="304.5" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="520.5" y="35" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">87%</text>
<text x="202" y="61" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">cheaper energy</text>
<g><title>77%</title><rect x="210.0" y="50.0" width="269.5" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="485.5" y="61" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">77%</text>
<text x="202" y="87" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">lower taxes on workers</text>
<g><title>72%</title><rect x="210.0" y="76.0" width="252.0" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="468.0" y="87" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">72%</text>
<text x="202" y="113" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">easier planning rules</text>
<g><title>59%</title><rect x="210.0" y="102.0" width="206.5" height="14.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="422.5" y="113" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">59%</text>
<text x="202" y="139" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">higher taxes and spending</text>
<g><title>36%, the lowest since 2013</title><rect x="210.0" y="128.0" width="126.0" height="14.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="342.0" y="139" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">36%</text>
<text x="20" y="162" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Chancellor's net approval: minus 51. Prime minister's: minus 48.</text>
<text x="20" y="178" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The insurgent party leads at 24%, Conservatives 19%, Liberal Democrats 13%.</text>
</svg>
