<svg viewBox="0 0 680 134" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three British inventions that ended up owned abroad or sold for scrap" style="max-width:100%;height:auto">
<title>Three British inventions that ended up owned abroad or sold for scrap</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WHAT BRITAIN INVENTED AND DID NOT KEEP</text>
<rect x="20" y="24" width="200" height="70" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="120.0" y="48.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the chip designer</text>
<text x="120.0" y="62.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">sold to Japan for £24.3 billion, 2016;</text>
<text x="120.0" y="76.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">listed in New York, 2023</text>
<rect x="240" y="24" width="200" height="70" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="340.0" y="48.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the AI lab</text>
<text x="340.0" y="62.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">sold to an American</text>
<text x="340.0" y="76.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">search company, 2014</text>
<rect x="460" y="24" width="200" height="70" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="560.0" y="48.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the battery plant</text>
<text x="560.0" y="62.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">£3.8 billion promised;</text>
<text x="560.0" y="76.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">sold for £8.6 million, 2023</text>
<text x="20" y="122" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Whatever a British university invents is sold to an American buyer within about five years.</text>
</svg>
