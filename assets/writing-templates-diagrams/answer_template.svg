<svg viewBox="0 0 680 202" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Start at the end as a section is answer then reasons, and as a page is sentence one then parts then close" style="max-width:100%;height:auto">
<title>Start at the end as a section is answer then reasons, and as a page is sentence one then parts then close</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">START AT THE END, AS A SECTION AND AS A PAGE</text>
<rect x="20" y="26" width="140" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="90.0" y="44.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the section's</text>
<text x="90.0" y="58.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">first sentence:</text>
<text x="90.0" y="72.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">its answer</text>
<line x1="162.0" y1="55.0" x2="184.0" y2="55.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="186" y="26" width="140" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="256.0" y="58.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">reason one</text>
<line x1="328.0" y1="55.0" x2="350.0" y2="55.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="352" y="26" width="140" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="422.0" y="58.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">reason two</text>
<line x1="494.0" y1="55.0" x2="516.0" y2="55.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="518" y="26" width="140" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="588.0" y="58.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">reason three</text>
<text x="20" y="100" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">As a section: the answer, then the reasons in the order that supports it.</text>
<rect x="20" y="116" width="196" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="118.0" y="134.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">sentence one of</text>
<text x="118.0" y="148.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the page:</text>
<text x="118.0" y="162.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the answer</text>
<line x1="218.0" y1="145.0" x2="240.0" y2="145.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="242" y="116" width="196" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="340.0" y="141.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the parts:</text>
<text x="340.0" y="155.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the reasons</text>
<line x1="440.0" y1="145.0" x2="462.0" y2="145.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="464" y="116" width="196" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="562.0" y="134.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the close:</text>
<text x="562.0" y="148.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the answer with the</text>
<text x="562.0" y="162.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">reasons now behind it</text>
<text x="20" y="190" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">As a page: the same three moves at page size. If sentence one will not come, there is no page yet.</text>
</svg>
