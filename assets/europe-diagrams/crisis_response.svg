<svg viewBox="0 0 680 160" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The answer to 2008: America spent and printed, Europe cut and raised rates" style="max-width:100%;height:auto">
<title>The answer to 2008: America spent and printed, Europe cut and raised rates</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE ANSWER TO 2008, ON EACH SIDE</text>
<rect x="20" y="26" width="305" height="96" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="172.5" y="55.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">United States</text>
<text x="172.5" y="70.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">475 billion for banks in 3 weeks,</text>
<text x="172.5" y="84.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">bond buying, 831 billion stimulus,</text>
<text x="172.5" y="99.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">a deficit of 10% of the economy</text>
<rect x="355" y="26" width="305" height="96" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="507.5" y="55.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">Europe</text>
<text x="507.5" y="70.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">cut spending, raise taxes,</text>
<text x="507.5" y="84.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">shrink deficits, and a central bank</text>
<text x="507.5" y="99.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">raising rates in 2011</text>
<text x="20" y="148" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">America finished its recovery by 2012. Italy's economy in 2026 has still not returned to its level before the crisis.</text>
</svg>
