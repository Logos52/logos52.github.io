<svg viewBox="0 0 680 116" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="European Union working-age population, aged 20 to 64, millions" style="max-width:100%;height:auto">
<title>European Union working-age population, aged 20 to 64, millions</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">EUROPEAN UNION WORKING-AGE POPULATION, AGED 20 TO 64, MILLIONS</text>
<text x="152" y="38" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">2025</text>
<g><title>262 million</title><rect x="160.0" y="26.0" width="449.1" height="15.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="615.1428571428571" y="38" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">262</text>
<text x="152" y="66" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">2100, projected</text>
<g><title>198 million</title><rect x="160.0" y="54.0" width="339.4" height="15.0" rx="3" fill="rgba(47,158,143,0.5)"/></g>
<text x="505.42857142857144" y="66" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">198</text>
<text x="20" y="104" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">A loss of 64 million workers. In Italy the retiree-to-worker ratio could reach 90%.</text>
</svg>
