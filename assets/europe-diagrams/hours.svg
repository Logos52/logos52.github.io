<text x="152" y="38" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">United States</text>
<g><title>1,811</title><rect x="160.0" y="26.0" width="457.5" height="15.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="623.5157894736842" y="38" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">1,811</text>
<text x="152" y="66" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">France</text>
<g><title>1,490</title><rect x="160.0" y="54.0" width="376.4" height="15.0" rx="3" fill="rgba(47,158,143,0.7)"/></g>
<text x="542.421052631579" y="66" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">1,490</text>
