<svg viewBox="0 0 680 144" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="jobs cut, announced 2023 to 2024" style="max-width:100%;height:auto">
<title>jobs cut, announced 2023 to 2024</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">JOBS CUT, ANNOUNCED 2023 TO 2024</text>
<text x="272" y="38" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Volkswagen, German plants, by 2030</text>
<g><title>35,000</title><rect x="280.0" y="26.0" width="315.0" height="15.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="601.0" y="38" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">35,000</text>
<text x="272" y="66" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Bosch</text>
<g><title>22,000</title><rect x="280.0" y="54.0" width="198.0" height="15.0" rx="3" fill="rgba(47,158,143,0.7)"/></g>
<text x="484.0" y="66" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">22,000</text>
<text x="272" y="94" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">ThyssenKrupp</text>
<g><title>11,000</title><rect x="280.0" y="82.0" width="99.0" height="15.0" rx="3" fill="rgba(47,158,143,0.5)"/></g>
<text x="385.0" y="94" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">11,000</text>
<text x="20" y="132" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">BASF shut 11 plants at Ludwigshafen and moved its next 10 billion dollar complex to China. Europe lost half its aluminum smelting.</text>
</svg>
