<svg viewBox="0 0 680 234" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The four choices: Europe took leisure, precaution, fragmentation, and dependency; America took output, speed, unity, and independence" style="max-width:100%;height:auto">
<title>The four choices: Europe took leisure, precaution, fragmentation, and dependency; America took output, speed, unity, and independence</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE FOUR CHOICES, AS THE ACCOUNT FRAMES THEM</text>
<rect x="20" y="26" width="260" height="34" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="150.0" y="46.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">Europe chose leisure</text>
<text x="330" y="47" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">over</text>
<rect x="380" y="26" width="280" height="34" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="520.0" y="46.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">America chose output</text>
<rect x="20" y="72" width="260" height="34" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="150.0" y="92.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">Europe chose precaution</text>
<text x="330" y="93" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">over</text>
<rect x="380" y="72" width="280" height="34" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="520.0" y="92.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">America chose speed</text>
<rect x="20" y="118" width="260" height="34" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="150.0" y="138.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">Europe chose fragmentation</text>
<text x="330" y="139" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">over</text>
<rect x="380" y="118" width="280" height="34" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="520.0" y="138.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">America chose unity</text>
<rect x="20" y="164" width="260" height="34" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="150.0" y="184.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">Europe chose dependency</text>
<text x="330" y="185" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">over</text>
<rect x="380" y="164" width="280" height="34" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="520.0" y="184.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">America chose independence</text>
<text x="20" y="222" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Neither path was wrong in the abstract. One stops working when the world changes.</text>
</svg>
