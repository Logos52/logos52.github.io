<svg viewBox="0 0 680 160" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Who came: skilled students and founders to America, asylum seekers to Europe" style="max-width:100%;height:auto">
<title>Who came: skilled students and founders to America, asylum seekers to Europe</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WHO CAME, ON THE ACCOUNT</text>
<rect x="20" y="26" width="305" height="96" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="172.5" y="56.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">America</text>
<text x="172.5" y="70.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">1,177,000 international students in 2024,</text>
<text x="172.5" y="84.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">55% of unicorns with an immigrant founder,</text>
<text x="172.5" y="98.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">engineers on work visas at 200,000 dollars</text>
<rect x="355" y="26" width="305" height="96" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="507.5" y="56.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">Europe</text>
<text x="507.5" y="70.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">1.3 million asylum applications in 2015,</text>
<text x="507.5" y="84.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">890,000 in Germany, 78% of unemployed</text>
<text x="507.5" y="98.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">immigrants with no vocational qualification</text>
<text x="20" y="148" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">America took the skilled immigrants and Europe absorbed the humanitarian caseload, and the politics followed from Britain to Austria.</text>
</svg>
