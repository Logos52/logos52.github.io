<svg viewBox="0 0 680 116" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="American natural gas production, trillion cubic feet a year" style="max-width:100%;height:auto">
<title>American natural gas production, trillion cubic feet a year</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">AMERICAN NATURAL GAS PRODUCTION, TRILLION CUBIC FEET A YEAR</text>
<text x="112" y="38" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">2005</text>
<g><title>18 trillion cubic feet</title><rect x="120.0" y="26.0" width="234.0" height="15.0" rx="3" fill="rgba(91,108,176,0.6)"/></g>
<text x="360.0" y="38" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">18</text>
<text x="112" y="66" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">2024</text>
<g><title>nearly 38 trillion cubic feet</title><rect x="120.0" y="54.0" width="494.0" height="15.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="620.0" y="66" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">38</text>
<text x="20" y="104" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">By 2018 the largest oil producer, by 2023 the largest gas exporter, and $2.21 per million BTUs in 2024.</text>
</svg>
