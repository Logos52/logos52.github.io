<svg viewBox="0 0 680 206" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The three conditions a shared currency needs, none of which the eurozone met at launch" style="max-width:100%;height:auto">
<title>The three conditions a shared currency needs, none of which the eurozone met at launch</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WHAT A SHARED CURRENCY NEEDS, AND WHAT THE EUROZONE HAD AT LAUNCH</text>
<rect x="20" y="26" width="280" height="40" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="160.0" y="49.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">economies that move together</text>
<line x1="304.0" y1="46.0" x2="336.0" y2="46.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="340" y="26" width="320" height="40" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="500.0" y="49.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">German and Greek labor markets had almost nothing in common</text>
<rect x="20" y="78" width="280" height="40" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="160.0" y="101.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">workers who can move between regions</text>
<line x1="304.0" y1="98.0" x2="336.0" y2="98.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="340" y="78" width="320" height="40" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="500.0" y="101.33333333333333" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">a Portuguese welder could not move to Finland</text>
<rect x="20" y="130" width="280" height="40" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="160.0" y="153.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">a treasury that moves money between regions</text>
<line x1="304.0" y1="150.0" x2="336.0" y2="150.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="340" y="130" width="320" height="40" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="500.0" y="153.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">no European tax authority existed</text>
<text x="20" y="194" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The warning was that the euro as designed would amplify shocks rather than absorb them.</text>
</svg>
