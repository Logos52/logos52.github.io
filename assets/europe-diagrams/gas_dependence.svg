<svg viewBox="0 0 680 144" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Germany's dependence on Russia, 2021" style="max-width:100%;height:auto">
<title>Germany's dependence on Russia, 2021</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">GERMANY'S DEPENDENCE ON RUSSIA, 2021</text>
<text x="152" y="38" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">natural gas</text>
<g><title>55%</title><rect x="160.0" y="26.0" width="440.0" height="15.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="606.0" y="38" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">55%</text>
<text x="152" y="66" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">hard coal</text>
<g><title>50%</title><rect x="160.0" y="54.0" width="400.0" height="15.0" rx="3" fill="rgba(47,158,143,0.7)"/></g>
<text x="566.0" y="66" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">50%</text>
<text x="152" y="94" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">oil</text>
<g><title>35%</title><rect x="160.0" y="82.0" width="280.0" height="15.0" rx="3" fill="rgba(47,158,143,0.5)"/></g>
<text x="446.0" y="94" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">35%</text>
<text x="20" y="132" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">10 European Union countries took more than half their imported gas from Russia. The invasion of 24 February 2022 ended the supply.</text>
</svg>
