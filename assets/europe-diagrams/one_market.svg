<svg viewBox="0 0 680 148" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One market of 335 million against 27 legal systems" style="max-width:100%;height:auto">
<title>One market of 335 million against 27 legal systems</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">REACHING A CONTINENT OF CUSTOMERS</text>
<rect x="20" y="26" width="305" height="84" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="172.5" y="57.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">an American software company</text>
<text x="172.5" y="71.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">335 million consumers,</text>
<text x="172.5" y="86.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">one legal framework, day one</text>
<rect x="355" y="26" width="305" height="84" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="507.5" y="57.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">a company founded in Berlin</text>
<text x="507.5" y="71.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">27 governments, 24 languages,</text>
<text x="507.5" y="86.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">27 legal systems</text>
<text x="20" y="136" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Internal barriers in the single market equal a 45% tariff on goods and a 110% tariff on services. 57% of relocating founders chose America.</text>
</svg>
