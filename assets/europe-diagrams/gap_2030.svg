<svg viewBox="0 0 680 116" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="projected economy size in 2030, trillions of dollars" style="max-width:100%;height:auto">
<title>projected economy size in 2030, trillions of dollars</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">PROJECTED ECONOMY SIZE IN 2030, TRILLIONS OF DOLLARS</text>
<text x="172" y="38" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">United States</text>
<g><title>40 trillion</title><rect x="180.0" y="26.0" width="460.0" height="15.0" rx="3" fill="rgba(91,108,176,0.9)"/></g>
<text x="646.0" y="38" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">40</text>
<text x="172" y="66" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">European Union</text>
<g><title>25 trillion</title><rect x="180.0" y="54.0" width="287.5" height="15.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="473.5" y="66" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">25</text>
<text x="20" y="104" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The gap of 10 trillion in 2024 becomes 15 trillion by 2030 on the late-2025 projection.</text>
