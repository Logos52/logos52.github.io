<svg viewBox="0 0 680 144" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="the south after the crisis, percent" style="max-width:100%;height:auto">
<title>the south after the crisis, percent</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE SOUTH AFTER THE CRISIS, PERCENT</text>
<text x="262" y="38" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">Greek economy, 2010 to 2014</text>
<g><title>shrank 26%</title><rect x="270.0" y="26.0" width="160.3" height="15.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="436.33333333333337" y="38" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">26%</text>
<text x="262" y="66" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">youth unemployment, Greece, peak</text>
<g><title>59.5%</title><rect x="270.0" y="54.0" width="366.9" height="15.0" rx="3" fill="rgba(47,158,143,0.7)"/></g>
<text x="642.9166666666667" y="66" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">59.5%</text>
<text x="262" y="94" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">youth unemployment, Spain, peak</text>
<g><title>56.4%</title><rect x="270.0" y="82.0" width="347.8" height="15.0" rx="3" fill="rgba(47,158,143,0.7)"/></g>
<text x="623.8" y="94" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">56.4%</text>
<text x="20" y="132" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Italian real wages are lower than in 1990, the only G7 country where workers earn less than their parents did.</text>
</svg>
