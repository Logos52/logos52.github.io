<svg viewBox="0 0 680 174" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Every thought elaborated becomes the one or two lines that carry the important points" style="max-width:100%;height:auto">
<title>Every thought elaborated becomes the one or two lines that carry the important points</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">BEFORE SPEAKING, COMPRESS</text>
<rect x="20" y="26" width="300" height="110" rx="6" fill="rgba(130,130,130,.18)" stroke="rgba(130,130,130,.35)" stroke-opacity=".55"/>
<text x="170.0" y="56.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">every thought, elaborated:</text>
<text x="170.0" y="70.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the first angle, the second,</text>
<text x="170.0" y="84.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the exception, the history,</text>
<text x="170.0" y="98.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the caveat, the other caveat,</text>
<text x="170.0" y="112.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the thing it reminds you of</text>
<line x1="324.0" y1="81.0" x2="356.0" y2="81.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="360" y="42" width="300" height="78" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="510.0" y="70.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">the one or two lines that carry</text>
<text x="510.0" y="84.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">every important point</text>
<text x="510.0" y="99.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">and none of the fluff</text>
<text x="20" y="162" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Cutting to what is necessary takes the deepest knowledge of the subject. That is why this habit takes years and the others take a week.</text>
</svg>
