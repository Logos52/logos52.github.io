<svg viewBox="0 0 680 148" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Observations first gets buy-in, lets others reach their own conclusion, and checks the giver's own bias" style="max-width:100%;height:auto">
<title>Observations first gets buy-in, lets others reach their own conclusion, and checks the giver's own bias</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WHY OBSERVATIONS FIRST WORKS</text>
<rect x="20" y="26" width="200" height="84" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="120.0" y="57.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">buy-in</text>
<text x="120.0" y="71.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">us against the problem,</text>
<text x="120.0" y="86.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">not me against you</text>
<rect x="240" y="26" width="200" height="84" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="340.0" y="57.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">their own conclusion</text>
<text x="340.0" y="71.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">the discussion is about how</text>
<text x="340.0" y="86.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">to read what was seen</text>
<rect x="460" y="26" width="200" height="84" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="560.0" y="57.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">your own bias</text>
<text x="560.0" y="71.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">you have to challenge</text>
<text x="560.0" y="86.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">your own assumptions</text>
<text x="20" y="136" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Shallow thinkers are the confident ones. Keeping what you saw apart from what you concluded is the check on yourself.</text>
</svg>
