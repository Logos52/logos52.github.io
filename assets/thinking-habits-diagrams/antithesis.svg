<svg viewBox="0 0 680 202" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The thesis sits between hypothesis and antithesis, and the antithesis gets said with the decision" style="max-width:100%;height:auto">
<title>The thesis sits between hypothesis and antithesis, and the antithesis gets said with the decision</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">HYPOTHESIS, ANTITHESIS, THESIS, AND WHAT GETS SAID</text>
<rect x="20" y="26" width="200" height="62" rx="6" fill="rgba(130,130,130,.18)" stroke="rgba(130,130,130,.35)" stroke-opacity=".55"/>
<text x="120.0" y="46.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">hypothesis</text>
<text x="120.0" y="60.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">what you think</text>
<text x="120.0" y="75.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">will happen</text>
<rect x="240" y="26" width="200" height="62" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="340.0" y="46.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">thesis</text>
<text x="340.0" y="60.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">where you land</text>
<text x="340.0" y="75.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">between the two</text>
<rect x="460" y="26" width="200" height="62" rx="6" fill="rgba(130,130,130,.18)" stroke="rgba(130,130,130,.35)" stroke-opacity=".55"/>
<text x="560.0" y="46.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">antithesis</text>
<text x="560.0" y="60.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">the counterargument</text>
<text x="560.0" y="75.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">swinging the other way</text>
<line x1="236.0" y1="57.0" x2="224.0" y2="57.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="444.0" y1="57.0" x2="456.0" y2="57.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="20" y="104" width="310" height="62" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="175.0" y="131.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">said with the decision:</text>
<text x="175.0" y="145.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">we should launch 2 months from now</text>
<rect x="350" y="104" width="310" height="62" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="505.0" y="131.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">said in the same breath:</text>
<text x="505.0" y="145.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">the three conditions that would push it back</text>
<text x="20" y="190" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The listener hears a decider who has looked past their own position. The decider gets one check on a habit that may not fit this time.</text>
</svg>
