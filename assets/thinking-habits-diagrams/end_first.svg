<svg viewBox="0 0 680 202" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The chain of reasoning loses the listener; the conclusion first frames every reason that follows" style="max-width:100%;height:auto">
<title>The chain of reasoning loses the listener; the conclusion first frames every reason that follows</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE CHAIN, AND THE END FIRST</text>
<rect x="20" y="26" width="140" height="58" rx="6" fill="rgba(130,130,130,.18)" stroke="rgba(130,130,130,.35)" stroke-opacity=".55"/>
<text x="90.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">from this</text>
<text x="90.0" y="65.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">angle</text>
<line x1="162.0" y1="55.0" x2="184.0" y2="55.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="186" y="26" width="140" height="58" rx="6" fill="rgba(130,130,130,.18)" stroke="rgba(130,130,130,.35)" stroke-opacity=".55"/>
<text x="256.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">then this</text>
<text x="256.0" y="65.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">factor</text>
<line x1="328.0" y1="55.0" x2="350.0" y2="55.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="352" y="26" width="140" height="58" rx="6" fill="rgba(130,130,130,.18)" stroke="rgba(130,130,130,.35)" stroke-opacity=".55"/>
<text x="422.0" y="44.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">in this context</text>
<text x="422.0" y="58.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">it gets</text>
<text x="422.0" y="72.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">complicated</text>
<line x1="494.0" y1="55.0" x2="516.0" y2="55.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="518" y="26" width="140" height="58" rx="6" fill="rgba(130,130,130,.18)" stroke="rgba(130,130,130,.35)" stroke-opacity=".55"/>
<text x="588.0" y="44.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">therefore,</text>
<text x="588.0" y="58.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">here is my</text>
<text x="588.0" y="72.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">opinion</text>
<text x="20" y="100" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">About 5 minutes in, the listener has lost the thread and could not say what the conclusion was.</text>
<rect x="20" y="116" width="140" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="90.0" y="141.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">this is what</text>
<text x="90.0" y="155.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">I think</text>
<line x1="162.0" y1="145.0" x2="184.0" y2="145.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="186" y="116" width="140" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="256.0" y="141.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">here is why:</text>
<text x="256.0" y="155.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">reason one</text>
<line x1="328.0" y1="145.0" x2="350.0" y2="145.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="352" y="116" width="140" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="422.0" y="148.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">reason two</text>
<line x1="494.0" y1="145.0" x2="516.0" y2="145.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="518" y="116" width="140" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="588.0" y="148.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">reason three</text>
<text x="20" y="190" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The conclusion frames the issue, so the listener knows how to hear everything that follows.</text>
</svg>
