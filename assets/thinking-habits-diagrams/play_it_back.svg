<svg viewBox="0 0 680 202" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An ask kept silent comes back as not what was asked; an ask played back finds its parts before the work starts" style="max-width:100%;height:auto">
<title>An ask kept silent comes back as not what was asked; an ask played back finds its parts before the work starts</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE ASK, SAID BACK OR NOT</text>
<rect x="20" y="26" width="140" height="58" rx="6" fill="rgba(130,130,130,.18)" stroke="rgba(130,130,130,.35)" stroke-opacity=".55"/>
<text x="90.0" y="58.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the ask</text>
<line x1="162.0" y1="55.0" x2="184.0" y2="55.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="186" y="26" width="140" height="58" rx="6" fill="rgba(130,130,130,.18)" stroke="rgba(130,130,130,.35)" stroke-opacity=".55"/>
<text x="256.0" y="44.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">kept silent:</text>
<text x="256.0" y="58.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">your own unspoken</text>
<text x="256.0" y="72.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">reading</text>
<line x1="328.0" y1="55.0" x2="350.0" y2="55.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="352" y="26" width="140" height="58" rx="6" fill="rgba(130,130,130,.18)" stroke="rgba(130,130,130,.35)" stroke-opacity=".55"/>
<text x="422.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the work</text>
<text x="422.0" y="65.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">delivered</text>
<line x1="494.0" y1="55.0" x2="516.0" y2="55.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="518" y="26" width="140" height="58" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="588.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">this is not</text>
<text x="588.0" y="65.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">what I asked for</text>
<rect x="20" y="104" width="140" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="90.0" y="136.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the ask</text>
<line x1="162.0" y1="133.0" x2="184.0" y2="133.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="186" y="104" width="140" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="256.0" y="122.33333333333333" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">said back:</text>
<text x="256.0" y="136.33333333333331" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">so what you are</text>
<text x="256.0" y="150.33333333333331" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">really asking is...</text>
<line x1="328.0" y1="133.0" x2="350.0" y2="133.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="352" y="104" width="140" height="58" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="422.0" y="122.33333333333333" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the asker:</text>
<text x="422.0" y="136.33333333333331" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">yes, and now there</text>
<text x="422.0" y="150.33333333333331" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">is a third part</text>
<line x1="494.0" y1="133.0" x2="516.0" y2="133.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="518" y="104" width="140" height="58" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="588.0" y="129.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">work that</text>
<text x="588.0" y="143.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">matches the ask</text>
<text x="20" y="190" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Playing it back buys thinking time, exposes gaps in your reading while they are cheap, and organizes the asker's own thinking.</text>
</svg>
