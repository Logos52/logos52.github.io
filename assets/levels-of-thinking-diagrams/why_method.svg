<svg viewBox="0 0 680 218" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The why method run on one reaction until the source shows" style="max-width:100%;height:auto" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The why method run on one reaction until the source shows</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity=".8"/></marker><marker id="arbig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".85"/></marker></defs>
<text x="20" y="16" font-size="12.5" fill="currentColor" opacity="0.92" text-anchor="start" font-weight="700">The why method, one run: embarrassed to show hand-drawn diagrams</text>
<rect x="20" y="26" width="140" height="58" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="90.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">why am I</text>
<text x="90.0" y="65.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">embarrassed?</text>
<line x1="162.0" y1="55.0" x2="184.0" y2="55.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="186" y="26" width="140" height="58" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="256.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">some negative</text>
<text x="256.0" y="65.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">impact on me</text>
<line x1="328.0" y1="55.0" x2="350.0" y2="55.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="352" y="26" width="140" height="58" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="422.0" y="58.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">what impact?</text>
<line x1="494.0" y1="55.0" x2="516.0" y2="55.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="518" y="26" width="140" height="58" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="588.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">people leave, or</text>
<text x="588.0" y="65.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">say bad things</text>
<rect x="20" y="104" width="140" height="58" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="90.0" y="129.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">why would that</text>
<text x="90.0" y="143.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">be so bad?</text>
<line x1="162.0" y1="133.0" x2="184.0" y2="133.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="186" y="104" width="140" height="58" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="256.0" y="129.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">I would lose</text>
<text x="256.0" y="143.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">opportunities</text>
<line x1="328.0" y1="133.0" x2="350.0" y2="133.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="352" y="104" width="140" height="58" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="422.0" y="136.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">how do I know?</text>
<line x1="494.0" y1="133.0" x2="516.0" y2="133.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="518" y="104" width="140" height="58" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="588.0" y="129.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">no evidence;</text>
<text x="588.0" y="143.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">it has gone fine</text>
<text x="20" y="190" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Sit with a reaction and ask why it is there, then why that matters, until you reach where it came from.</text>
<text x="20" y="206" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">This run ended in: nothing is wrong with the drawings.</text>
</svg>
