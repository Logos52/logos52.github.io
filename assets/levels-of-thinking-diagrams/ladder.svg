<svg viewBox="0 0 680 252" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The nine levels of thinking as nine steps back from your own reaction" style="max-width:100%;height:auto" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The nine levels of thinking as nine steps back from your own reaction</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity=".8"/></marker><marker id="arbig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".85"/></marker></defs>
<text x="20" y="16" font-size="12.5" fill="currentColor" opacity="0.92" text-anchor="start" font-weight="700">Nine steps back from your own reaction</text>
<rect x="20" y="26" width="200" height="54" rx="8" fill="rgba(130,130,130,.12)" stroke="rgba(130,130,130,.55)" stroke-width="1.3"/>
<text x="120.0" y="49.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">1 survive</text>
<text x="120.0" y="63.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">my own needs</text>
<line x1="222.0" y1="53.0" x2="234.0" y2="53.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="236" y="26" width="200" height="54" rx="8" fill="rgba(130,130,130,.12)" stroke="rgba(130,130,130,.55)" stroke-width="1.3"/>
<text x="336.0" y="49.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">2 connect</text>
<text x="336.0" y="63.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">other people have minds</text>
<line x1="438.0" y1="53.0" x2="450.0" y2="53.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="452" y="26" width="200" height="54" rx="8" fill="rgba(130,130,130,.12)" stroke="rgba(130,130,130,.55)" stroke-width="1.3"/>
<text x="552.0" y="49.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">3 control</text>
<text x="552.0" y="63.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">others see each other too</text>
<rect x="20" y="92" width="200" height="54" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="120.0" y="115.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">4 belong</text>
<text x="120.0" y="129.33333333333331" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">how I look to my own people</text>
<line x1="222.0" y1="119.0" x2="234.0" y2="119.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="236" y="92" width="200" height="54" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="336.0" y="115.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">5 observe</text>
<text x="336.0" y="129.33333333333331" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">how my people look to a stranger</text>
<line x1="438.0" y1="119.0" x2="450.0" y2="119.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="452" y="92" width="200" height="54" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="552.0" y="115.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">6 the one looking</text>
<text x="552.0" y="129.33333333333331" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">who looks decides what is seen</text>
<rect x="20" y="158" width="200" height="54" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="120.0" y="181.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">7 harmonize</text>
<text x="120.0" y="195.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">my view grew over time</text>
<line x1="222.0" y1="185.0" x2="234.0" y2="185.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="236" y="158" width="200" height="54" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="336.0" y="181.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">8 watch it build</text>
<text x="336.0" y="195.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">my mind making its reaction</text>
<line x1="438.0" y1="185.0" x2="450.0" y2="185.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="452" y="158" width="200" height="54" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="552.0" y="181.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">9 choose the view</text>
<text x="552.0" y="195.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">the watching itself</text>
<text x="20" y="240" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Each step is one more step back. The first three are about getting what you want. From four on you can see yourself from outside.</text>
</svg>
