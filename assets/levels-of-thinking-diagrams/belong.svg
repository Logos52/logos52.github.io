<svg viewBox="0 0 680 202" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Step four, belong: a reaction from a phone acted on at once, and the same reaction with the step back" style="max-width:100%;height:auto" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Step four, belong: a reaction from a phone acted on at once, and the same reaction with the step back</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity=".8"/></marker><marker id="arbig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".85"/></marker></defs>
<text x="20" y="16" font-size="12.5" fill="currentColor" opacity="0.92" text-anchor="start" font-weight="700">Step four, belong: the same reaction, with and without the step back</text>
<rect x="20" y="26" width="140" height="58" rx="8" fill="rgba(130,130,130,.12)" stroke="rgba(130,130,130,.55)" stroke-width="1.3"/>
<text x="90.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">the phone says</text>
<text x="90.0" y="65.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">men are bad</text>
<line x1="162.0" y1="55.0" x2="184.0" y2="55.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="186" y="26" width="140" height="58" rx="8" fill="rgba(130,130,130,.12)" stroke="rgba(130,130,130,.55)" stroke-width="1.3"/>
<text x="256.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">she sees the man</text>
<text x="256.0" y="65.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">in her life</text>
<line x1="328.0" y1="55.0" x2="350.0" y2="55.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="352" y="26" width="140" height="58" rx="8" fill="rgba(91,108,176,.16)" stroke="rgba(91,108,176,.9)" stroke-width="1.3"/>
<text x="422.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">he must be bad,</text>
<text x="422.0" y="65.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">I felt it was true</text>
<line x1="494.0" y1="55.0" x2="516.0" y2="55.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="518" y="26" width="140" height="58" rx="8" fill="rgba(91,108,176,.16)" stroke="rgba(91,108,176,.9)" stroke-width="1.3"/>
<text x="588.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">break up</text>
<text x="588.0" y="65.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">with him</text>
<rect x="20" y="104" width="140" height="58" rx="8" fill="rgba(130,130,130,.12)" stroke="rgba(130,130,130,.55)" stroke-width="1.3"/>
<text x="90.0" y="129.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">the phone says</text>
<text x="90.0" y="143.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">men are bad</text>
<line x1="162.0" y1="133.0" x2="184.0" y2="133.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="186" y="104" width="140" height="58" rx="8" fill="rgba(130,130,130,.12)" stroke="rgba(130,130,130,.55)" stroke-width="1.3"/>
<text x="256.0" y="129.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">she sees the man</text>
<text x="256.0" y="143.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">in her life</text>
<line x1="328.0" y1="133.0" x2="350.0" y2="133.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="352" y="104" width="140" height="58" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="422.0" y="122.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">step back: is that</text>
<text x="422.0" y="136.33333333333331" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">the right thing</text>
<text x="422.0" y="150.33333333333331" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">to do?</text>
<line x1="494.0" y1="133.0" x2="516.0" y2="133.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="518" y="104" width="140" height="58" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="588.0" y="129.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">how would I look</text>
<text x="588.0" y="143.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">doing this?</text>
<text x="20" y="190" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Seeing yourself the way another person in your culture sees you. That step is where rules, and morality as most people mean it, begin.</text>
</svg>
