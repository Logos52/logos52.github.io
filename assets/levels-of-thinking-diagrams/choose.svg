<svg viewBox="0 0 680 126" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="step nine, choose where to look from: At eight you watch the show without being it. At nine how you do the looking is the thing that matters." style="max-width:100%;height:auto" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>step nine, choose where to look from: At eight you watch the show without being it. At nine how you do the looking is the thing that matters.</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity=".8"/></marker><marker id="arbig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".85"/></marker></defs>
<text x="20" y="16" font-size="12.5" fill="currentColor" opacity="0.92" text-anchor="start" font-weight="700">Step nine, choose where to look from</text>
<rect x="20" y="26" width="196" height="62" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="118.0" y="53.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">watching myself</text>
<text x="118.0" y="67.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">watch</text>
<line x1="218.0" y1="57.0" x2="240.0" y2="57.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="242" y="26" width="196" height="62" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="340.0" y="53.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">what am I looking at,</text>
<text x="340.0" y="67.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">and from where?</text>
<line x1="440.0" y1="57.0" x2="462.0" y2="57.0" stroke="currentColor" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="464" y="26" width="196" height="62" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="562.0" y="46.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">a responsibility for</text>
<text x="562.0" y="60.333333333333336" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">knowing where</text>
<text x="562.0" y="74.33333333333334" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">to look</text>
<text x="20" y="114" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">At eight you watch the show without being it. At nine how you do the looking is the thing that matters.</text>
