<svg viewBox="0 0 680 218" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Step eight: the parts of a reaction seen as they form, and then the choice whether to follow them" style="max-width:100%;height:auto" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Step eight: the parts of a reaction seen as they form, and then the choice whether to follow them</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity=".8"/></marker><marker id="arbig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".85"/></marker></defs>
<text x="20" y="16" font-size="12.5" fill="currentColor" opacity="0.92" text-anchor="start" font-weight="700">Step eight, watch the mind build itself: a doughnut on a plate</text>
<rect x="20" y="26" width="150" height="100" rx="8" fill="rgba(130,130,130,.12)" stroke="rgba(130,130,130,.55)" stroke-width="1.3"/>
<text x="95.0" y="72.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">hunger:</text>
<text x="95.0" y="86.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">it looks good</text>
<rect x="186" y="26" width="150" height="100" rx="8" fill="rgba(130,130,130,.12)" stroke="rgba(130,130,130,.55)" stroke-width="1.3"/>
<text x="261.0" y="65.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">guilt: the box</text>
<text x="261.0" y="79.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">I ate once, and</text>
<text x="261.0" y="93.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">the shame after</text>
<rect x="352" y="26" width="150" height="100" rx="8" fill="rgba(130,130,130,.12)" stroke="rgba(130,130,130,.55)" stroke-width="1.3"/>
<text x="427.0" y="72.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">the stomach ache</text>
<text x="427.0" y="86.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">I remember</text>
<rect x="518" y="26" width="142" height="100" rx="8" fill="rgba(91,108,176,.16)" stroke="rgba(91,108,176,.9)" stroke-width="1.3"/>
<text x="589.0" y="65.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="600">all of it pulling</text>
<text x="589.0" y="79.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">on what I want</text>
<text x="589.0" y="93.33333333333333" font-size="10" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">to do now</text>
<rect x="20" y="142" width="640" height="44" rx="8" fill="rgba(47,158,143,.16)" stroke="rgba(47,158,143,.9)" stroke-width="1.3"/>
<text x="340.0" y="167.5" font-size="10.5" fill="currentColor" opacity="0.92" text-anchor="middle" font-weight="500">now that I can see all of that going on in me, do I want to listen to it or not?</text>
<text x="20" y="206" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The same watching applied to a reaction from a phone, or to politics, is what gives the power not to just react.</text>
</svg>
