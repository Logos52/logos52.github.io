<svg viewBox="0 0 680 184" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two readings of the support: the argument followed to its end, and own-group loyalty that the argument only made sayable" style="max-width:100%;height:auto">
<title>Two readings of the support: the argument followed to its end, and own-group loyalty that the argument only made sayable</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">TWO READINGS OF THE SAME SUPPORT</text>
<rect x="20" y="26" width="305" height="120" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="172.5" y="60.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">the road</text>
<text x="172.5" y="75.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">an argument followed to its end:</text>
<text x="172.5" y="89.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">not yet a person, the hard cases,</text>
<text x="172.5" y="104.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">bodily autonomy, then autonomy</text>
<text x="172.5" y="118.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">past birth</text>
<rect x="355" y="26" width="305" height="120" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="507.5" y="60.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">the loyalty</text>
<text x="507.5" y="75.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">women defend women, whatever the act;</text>
<text x="507.5" y="89.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">the goal is power without</text>
<text x="507.5" y="104.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">accountability, and the argument</text>
<text x="507.5" y="118.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">only made the defense sayable</text>
<text x="20" y="172" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The road says why the defense could be spoken. The loyalty says who spoke it. Both end at a war with biology the movement loses.</text>
</svg>
