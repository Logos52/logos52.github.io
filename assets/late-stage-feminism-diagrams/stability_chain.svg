<svg viewBox="0 0 680 144" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Every lasting society became patriarchal because it is the most stable arrangement, which rests on biology, so feminism's opponent is biology" style="max-width:100%;height:auto">
<title>Every lasting society became patriarchal because it is the most stable arrangement, which rests on biology, so feminism's opponent is biology</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">WHY EVERY LASTING SOCIETY SETTLED INTO THE SAME ORDER, ON THE FIRST ACCOUNT</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<rect x="20" y="26" width="116" height="62" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="78.0" y="46.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">every lasting</text>
<text x="78.0" y="60.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">society became</text>
<text x="78.0" y="74.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">patriarchal</text>
<line x1="138.0" y1="57.0" x2="154.0" y2="57.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="156" y="26" width="116" height="62" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="214.0" y="46.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">so it is the</text>
<text x="214.0" y="60.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">most stable</text>
<text x="214.0" y="74.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">arrangement</text>
<line x1="274.0" y1="57.0" x2="290.0" y2="57.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="292" y="26" width="116" height="62" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="350.0" y="46.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">stable regardless</text>
<text x="350.0" y="60.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">of circumstance:</text>
<text x="350.0" y="74.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">biology</text>
<line x1="410.0" y1="57.0" x2="426.0" y2="57.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="428" y="26" width="116" height="62" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="486.0" y="46.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">thousands of</text>
<text x="486.0" y="60.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">years of</text>
<text x="486.0" y="74.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">adaptation</text>
<line x1="546.0" y1="57.0" x2="562.0" y2="57.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="564" y="26" width="116" height="62" rx="6" fill="rgba(91,108,176,.10)" stroke="#5b6cb0" stroke-opacity=".55"/>
<text x="622.0" y="46.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">feminism rejects it:</text>
<text x="622.0" y="60.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">its opponent</text>
<text x="622.0" y="74.33333333333334" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">is biology</text>
<text x="20" y="116" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The plainer version runs through violence. Law comes from violence and men hold the monopoly on it,</text>
<text x="20" y="132" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">so any matriarchy lives under a patriarch's protection.</text>
</svg>
