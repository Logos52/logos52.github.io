<svg viewBox="0 0 680 184" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The instincts toward authority and maternity are redirected: from husband to boss and bureaucracy, from children to pets, causes, and migrant groups" style="max-width:100%;height:auto">
<title>The instincts toward authority and maternity are redirected: from husband to boss and bureaucracy, from children to pets, causes, and migrant groups</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE INSTINCTS STAY, AND GET REDIRECTED</text>
<rect x="20" y="26" width="200" height="52" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="120.0" y="55.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">a husband, a patriarchy</text>
<line x1="224.0" y1="52.0" x2="296.0" y2="52.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="300" y="26" width="220" height="52" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="410.0" y="55.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">a boss, a bureaucracy</text>
<rect x="20" y="92" width="200" height="52" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="120.0" y="121.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">children</text>
<line x1="224.0" y1="118.0" x2="296.0" y2="118.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="300" y="92" width="220" height="52" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="410.0" y="114.25" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">pets, social causes,</text>
<text x="410.0" y="128.75" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">migrant and minority groups</text>
<text x="536" y="52" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">the instinct toward authority</text>
<text x="536" y="118" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">the instinct toward maternity</text>
<text x="20" y="172" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Thousands of years of adaptation do not erase, so each instinct finds a substitute object.</text>
</svg>
