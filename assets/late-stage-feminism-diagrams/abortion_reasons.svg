<svg viewBox="0 0 680 152" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About 3 to 4% of abortions are for rape, incest, or a fetus that cannot survive, 6 to 7% financial, and about 92% elective" style="max-width:100%;height:auto">
<title>About 3 to 4% of abortions are for rape, incest, or a fetus that cannot survive, 6 to 7% financial, and about 92% elective</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">SHARE OF ABORTIONS BY REASON, AS GIVEN, ABOUT</text>
<text x="292" y="39" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">rape, incest, or a fetus that cannot survive</text>
<g><title>About 3 to 4%</title><rect x="300.0" y="26.0" width="11.9" height="16.0" rx="3" fill="rgba(47,158,143,0.9)"/></g>
<text x="317.9" y="39" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">3 to 4%</text>
<text x="292" y="69" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">financial reasons</text>
<g><title>About 6 to 7%</title><rect x="300.0" y="56.0" width="22.1" height="16.0" rx="3" fill="rgba(47,158,143,0.6)"/></g>
<text x="328.1" y="69" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">6 to 7%</text>
<text x="292" y="99" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="end">elective, chosen for convenience</text>
<g><title>About 92%</title><rect x="300.0" y="86.0" width="312.8" height="16.0" rx="3" fill="rgba(129,86,166,0.9)"/></g>
<text x="618.8" y="99" font-size="10.5" fill="currentColor" opacity="0.9" text-anchor="start">92%</text>
<text x="20" y="140" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">The hard cases the second argument leaned on are the smallest slice. The man giving the shares calls himself pro-abortion.</text>
</svg>
