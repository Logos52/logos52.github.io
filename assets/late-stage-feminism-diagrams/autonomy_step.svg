<svg viewBox="0 0 680 160" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The list the autonomy argument rests on, stress, impairment, harm, and dependence, is the same before and after birth" style="max-width:100%;height:auto">
<title>The list the autonomy argument rests on, stress, impairment, harm, and dependence, is the same before and after birth</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THE LIST THE AUTONOMY ARGUMENT RESTS ON, BEFORE AND AFTER BIRTH</text>
<rect x="20" y="26" width="250" height="96" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="145.0" y="63.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">in the womb</text>
<text x="145.0" y="77.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">stress · impairment · harm</text>
<text x="145.0" y="92.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">depends on you</text>
<line x1="274.0" y1="74.0" x2="336.0" y2="74.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="305" y="66" font-size="10" fill="currentColor" opacity="0.7" text-anchor="middle">birth</text>
<rect x="340" y="26" width="250" height="96" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="465.0" y="63.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">after birth</text>
<text x="465.0" y="77.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">stress · impairment · harm</text>
<text x="465.0" y="92.0" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">depends on you</text>
<text x="20" y="148" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Nothing on the list changes at birth, so bodily autonomy becomes autonomy, full stop.</text>
</svg>
