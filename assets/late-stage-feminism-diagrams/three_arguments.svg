<svg viewBox="0 0 680 118" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three arguments for abortion in order: not yet a person, the hard cases, bodily autonomy" style="max-width:100%;height:auto">
<title>Three arguments for abortion in order: not yet a person, the hard cases, bodily autonomy</title>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THREE ARGUMENTS FOR ABORTION, IN ORDER, AND WHAT EACH FAILS ON</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<rect x="20" y="26" width="180" height="44" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="110.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">not yet a person</text>
<line x1="202.0" y1="48.0" x2="252.0" y2="48.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="254" y="26" width="180" height="44" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="344.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">the hard cases</text>
<line x1="436.0" y1="48.0" x2="486.0" y2="48.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="488" y="26" width="180" height="44" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="578.0" y="51.333333333333336" font-size="10" fill="currentColor" opacity="0.85" text-anchor="middle">bodily autonomy</text>
<text x="20" y="92" font-size="10" fill="currentColor" opacity="0.7" text-anchor="start">fails on late-term abortion,</text>
<text x="20" y="106" font-size="10" fill="currentColor" opacity="0.7" text-anchor="start">which the same side supports</text>
<text x="254" y="92" font-size="10" fill="currentColor" opacity="0.7" text-anchor="start">rare, and never supported</text>
<text x="254" y="106" font-size="10" fill="currentColor" opacity="0.7" text-anchor="start">abortion until birth</text>
<text x="488" y="92" font-size="10" fill="currentColor" opacity="0.7" text-anchor="start">concedes the child dies,</text>
<text x="488" y="106" font-size="10" fill="currentColor" opacity="0.7" text-anchor="start">and carries past birth</text>
</svg>
