<svg viewBox="0 0 680 230" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three predispositions and their inversions: modest to loud, submitting to unruly, protector to threat" style="max-width:100%;height:auto">
<title>Three predispositions and their inversions: modest to loud, submitting to unruly, protector to threat</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="rgba(130,130,130,.6)"/></marker></defs>
<text x="20" y="14" font-size="9.5" fill="currentColor" opacity="0.45" text-anchor="start" font-weight="700" letter-spacing=".09em">THREE PREDISPOSITIONS AND THEIR INVERSIONS</text>
<rect x="20" y="26" width="260" height="44" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="150.0" y="51.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">demure and modest</text>
<line x1="284.0" y1="48.0" x2="356.0" y2="48.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="360" y="26" width="300" height="44" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="510.0" y="51.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">loud and obnoxious</text>
<rect x="20" y="84" width="260" height="44" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="150.0" y="109.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">submits to authority</text>
<line x1="284.0" y1="106.0" x2="356.0" y2="106.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="360" y="84" width="300" height="44" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="510.0" y="109.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">unruly</text>
<rect x="20" y="142" width="260" height="44" rx="6" fill="rgba(47,158,143,.10)" stroke="#2f9e8f" stroke-opacity=".55"/>
<text x="150.0" y="167.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">the child's fiercest protector</text>
<line x1="284.0" y1="164.0" x2="356.0" y2="164.0" stroke="rgba(130,130,130,.6)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="360" y="142" width="300" height="44" rx="6" fill="rgba(129,86,166,.10)" stroke="#8156a6" stroke-opacity=".55"/>
<text x="510.0" y="167.5" font-size="10.5" fill="currentColor" opacity="0.85" text-anchor="middle">the child's greatest threat</text>
<text x="20" y="218" font-size="10.5" fill="currentColor" opacity="0.78" text-anchor="start">Offered a choice, women would not come, an early thinker of the movement said. They would have to be forced.</text>
</svg>
