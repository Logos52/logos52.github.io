# CI only. Does not upload a Pages artifact and does not deploy.
# Leak tests read dist/, so this job builds first and then discards the output.

name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-source-guard:
    name: npm test and guard:source
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Source privacy audit
        run: npm run guard:source

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
