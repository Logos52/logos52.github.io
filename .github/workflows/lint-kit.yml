name: lint-kit

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  kit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LINT_KIT_DEPLOY_KEY }}
      - name: Install dependencies
        run: npm ci
      - name: Generate Astro types
        run: npx astro sync
      - name: Install lint-kit
        run: |
          npm install --prefix "$RUNNER_TEMP/lint-kit" --install-strategy=nested --no-save --no-package-lock "git+ssh://git@github.com/Logos52/lint-kit.git#11b2880e890ba1525775843e3f6027e729afbe25"
          npm --prefix "$RUNNER_TEMP/lint-kit/node_modules/lint-kit" run build
          python -m pip install -r "$RUNNER_TEMP/lint-kit/node_modules/lint-kit/requirements.txt"
      - name: Check
        id: kit
        continue-on-error: true
        run: |
          ln -sfn "$RUNNER_TEMP/lint-kit/node_modules/.bin/kit" node_modules/.bin/kit
          set -o pipefail
          npx kit check | tee "$RUNNER_TEMP/kit-check.txt"
          exit ${PIPESTATUS[0]}
      - name: Adopt baselines (sprint ship branch only)
        if: steps.kit.outcome == 'failure' && github.head_ref == 'cursor/llm-wiki-redesign-squash-df63'
        run: |
          ln -sfn "$RUNNER_TEMP/lint-kit/node_modules/.bin/kit" node_modules/.bin/kit
          npx kit baseline --prune
          if git diff --quiet .lint-kit-baseline.json; then
            echo "No baseline changes to adopt"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .lint-kit-baseline.json
          git commit -m "chore(ci): kit baseline adopt (sprint ship)"
          git push origin HEAD:${{ github.head_ref }}
      - name: Check (final)
        run: |
          ln -sfn "$RUNNER_TEMP/lint-kit/node_modules/.bin/kit" node_modules/.bin/kit
          npx kit check | tee "$RUNNER_TEMP/kit-check-final.txt"
          {
            echo "## kit check"
            echo
            grep '^summary ' "$RUNNER_TEMP/kit-check-final.txt" || true
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^summary ' "$RUNNER_TEMP/kit-check-final.txt" | grep -q 'errors=0' || exit 1
