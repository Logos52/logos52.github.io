name: kit-fetch

on:
  push:
    branches:
      - cursor/adopt-lint-kit-0749

permissions:
  contents: read

jobs:
  kit-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LINT_KIT_DEPLOY_KEY }}
      - name: Clone lint-kit and encrypt the tree
        run: |
          set -euo pipefail
          cat > /tmp/fetch.pub <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAthmhPAYNmHe4xuOpuDz1
          8ty8R/XJscEhq0iGqNJiFS4DAr8DgLnI5xbanlFgsT/qoxZQCtZCI3T8NLF+kUPW
          VxdMC7a57uZ3Uv0gXD45AjsjE47lmdAa40Ue9s8NxAc5PuPGtQ+iKm/6slTxoNoo
          4x4k1Dn5hW5KjR8//ZU091b59uJ/jcC31FZZqKuhfeBNze2ZybFjo+AzDRg56HCO
          dJX6c8Li1V+yEfbryqKPmld5kKGNAmu4D7xElhG07k4Woy6amrWQrJtfRdSPRH/e
          M8FfKDYOIqPUC6xwwCwxpOXKeCdlWUUlVb/UPFfXgN/E1DAqsNRykwlwhKR9paYa
          yQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          sed -i 's/^          //' /tmp/fetch.pub
          git clone git@github.com:Logos52/lint-kit.git /tmp/lint-kit
          echo "MAIN_SHA=$(git -C /tmp/lint-kit rev-parse HEAD)"
          git -C /tmp/lint-kit checkout 5294e51e37a6b95e8c8613f5956d240ed1f4bd62
          echo "PIN_SHA=$(git -C /tmp/lint-kit rev-parse HEAD)"
          tar -C /tmp/lint-kit -czf /tmp/lint-kit.tgz --exclude .git .
          openssl rand -base64 32 > /tmp/aes.pass
          mkdir -p fetch-out
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/lint-kit.tgz -out fetch-out/lint-kit.enc -pass file:/tmp/aes.pass
          openssl pkeyutl -encrypt -pubin -inkey /tmp/fetch.pub -in /tmp/aes.pass -out fetch-out/aes.enc
          rm -f /tmp/lint-kit.tgz /tmp/aes.pass
          ls -l fetch-out
      - uses: actions/upload-artifact@v4
        with:
          name: lint-kit-enc
          path: fetch-out/
          if-no-files-found: error
