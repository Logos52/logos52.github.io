<figure>
<button type="button" class="fig-open" aria-label="Open the figure larger"><svg class="diagram neon-diagram" id="fsc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 530" width="688" height="530" role="img" aria-label="A skill moves through four stages. Unconscious incompetence: At the bottom you cannot do the skill correctly, and you have no idea that this is so. Conscious incompetence: You are still getting it wrong, and now you can see that you are. Conscious competence: At this stage you can do the skill correctly if you apply effort. The band is wide. Unconscious competence: At the top the correct form has become automatic.">
<defs><pattern id="dotsfsc" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.9" fill="#cfcfcf"/></pattern><marker id="ahfsc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#0094d0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>#fsc .t{font-family:'Monaspace Neon',monospace;font-size:14px;fill:#1a1a1a} #fsc .e{font-family:'Monaspace Neon',monospace;font-size:12px;fill:#6b6b6b}</style>
<rect width="688" height="530" rx="3" fill="#f7f7f7"/><rect width="688" height="530" rx="3" fill="url(#dotsfsc)"/>
<text class="t" x="40" y="36">A skill moves through four stages</text>
<path d="M300 418 L300 387" fill="none" stroke="#0094d0" stroke-width="2" marker-end="url(#ahfsc)"/>
<path d="M300 300 L300 269" fill="none" stroke="#0094d0" stroke-width="2" marker-end="url(#ahfsc)"/>
<path d="M300 164 L300 133" fill="none" stroke="#0094d0" stroke-width="2" marker-end="url(#ahfsc)"/>
<rect x="130" y="64" width="520" height="66" rx="10" fill="#e3f7fe" stroke="#0094d0" stroke-width="2"/>
<text class="t" x="148" y="90">Unconscious competence</text>
<text class="e" x="148" y="110">At the top the correct form has become automatic.</text>
<rect x="100" y="164" width="520" height="102" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<text class="t" x="118" y="190">Conscious competence</text>
<text class="e" x="118" y="210">At this stage you can do the skill correctly</text>
<text class="e" x="118" y="228">if you apply effort.</text>
<text class="e" x="118" y="246">The band is wide.</text>
<rect x="70" y="300" width="520" height="84" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<text class="t" x="88" y="326">Conscious incompetence</text>
<text class="e" x="88" y="346">You are still getting it wrong,</text>
<text class="e" x="88" y="364">and now you can see that you are.</text>
<rect x="40" y="418" width="520" height="84" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<text class="t" x="58" y="444">Unconscious incompetence</text>
<text class="e" x="58" y="464">At the bottom you cannot do the skill correctly,</text>
<text class="e" x="58" y="482">and you have no idea that this is so.</text>
</svg><span class="fig-hint" aria-hidden="true"></span></button>
<figcaption>Competence is a spectrum, not a switch.</figcaption>
</figure>
