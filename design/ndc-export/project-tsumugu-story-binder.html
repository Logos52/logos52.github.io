le":"the photo gap","note":"silent plant","text":"the core four share family photos; one unexplained photo of an old woman in 沈文's set; 阮草 asks; he slides past. Show-don't-tell, B1-vocab-legal.","k":"C1","cast":["shenwen","ruancao"],"label":"shenwen"},{"role":"subplot","title":"","note":"","text":"阿迪's big warm family fills the screen — he lingers a beat on his father's tired eyes (seed).","k":"C2","cast":["adi"],"label":"adi"},{"role":"breather","title":"","note":"","text":"星野 shows a hundred photos of Taiwan and none of Osaka; nobody notices (quiet axis texture, no hang lantern).","k":"C3","cast":["xingye"],"label":"xingye"},{"k":"HUMOR","role":"humor","title":"小圖 × 沈文","note":"","text":"owner apologizing for his (unnamed) robot: the bag chirps 「好看！好看！」 at the wrong photo; 沈文, level: 「對不起。」 (candidate first 「大家都在」 misfire — catchphrase unsigned).","cast":["shenwen","xiaotu"],"label":"shenwen"}],"plants":[{"text":"photo gap","to":[]},{"text":"father's tired eyes (→ B2L04 gigs)","to":["B2L04"]},{"text":"the robot exists and misfires","to":[]}],"core_note":"","holes":0,"marquee":"the photo gap","label":"shenwen","in_marquee":["shenwen","ruancao"],"named":["shenwen","ruancao","xingye","adi","sulaoshi","xiaotu"],"third":1,"slot":"","title_en":"My Family","theme_en":"Family members","tone_words":["warm"],"tone":1.5,"status":"packet","packet":{"readings":[{"id":"B1L02-RU1","k":"RU1","title_zh":"都很好看！","han":null,"text":"","synopsis":"Xingye narrates her endless camera roll at Ruan Cao, who answers in firm two-word verdicts and finally orders tea in self-defense. Pure photo-vocabulary texture — nothing happens, delightfully."},{"id":"B1L02-RU2","k":"RU2","title_zh":"你家有幾個人？","han":null,"text":"","synopsis":"Intake-form roll call: Su Laoshi counts everyone's family, Adi's overflows the question, and her own answer is a house full of books. Her given name stays classified; everyone suddenly has reading to do."},{"id":"B1L02-C1","k":"C1","title_zh":"這張是誰？","han":null,"text":"","synopsis":"The four trade family photos and Shen Wen's thin set holds one photo of an old woman he won't name — not his mother, not answered, changed away from behind a chirp from his bag and a round of drinks. Ruan Cao says nothing and files it; the reader keeps the photo."},{"id":"B1L02-C2","k":"C2","title_zh":"阿迪的家人","han":null,"text":"","synopsis":"Adi's phone is one endless warm family — uncles, cousins, both grandmothers, the house. On his father's photo he stalls for half a beat, declares everything fine twice, offers coffee — then quietly circles back to photo after photo of his dad."},{"id":"B1L02-C3","k":"C3","title_zh":"都是臺灣","han":null,"text":"","synopsis":"Xingye's photo roll goes around: every guess of \"is this Japan?\" is wrong — it's Taiwan, all of it, hundreds deep, including one suspiciously Japanese-looking old house. Nobody notices what isn't there; the reader can."}]}},{"id":"B1L03","book":1,"n":3,"title":"What Are You Doing Over the Weekend?","theme":"嗜好","tag":"","topic":"hobbies · common likes · suggestions/choice questions","grammar":"time words · 去+VP · 也/都/常 · 吧","cards":[{"k":"RU1","role":"runup","title":"first half — sports/hobbies: 運動·打網球·棒球·游泳·籃球·踢足球·常","note":"","text":"campus club-fair texture — 阿迪 window-shops every club, commits to none; 星野 signs three lists.","cast":["xingye","adi"],"label":"adi"},{"k":"RU2","role":"runup","title":"second half — plans/invites: 今天晚上·看電影·想·還是·吧·一起·吃晚飯","note":"","text":"a LINE group-chat log that plans nothing successfully — 「看電影還是吃飯？」 twelve messages, zero decisions (genre piece).","cast":[],"label":null},{"role":"marquee","title":"the first founding-pair clash","note":"","text":"沈文 & 阮草, new classmates, can't agree on a weekend plan — she's decisive to the bone, he's easygoing to a fault; first friction, no winner (⚔️ conflict-rule).","k":"C1","cast":["shenwen","ruancao"],"label":"shenwen"},{"role":"breather","title":"","note":"orbit","text":"across town, 白龍 spends the weekend alone with 將軍 at the café — one bowl, binoculars on the windowsill; okay-alone, worn well.","k":"C2","cast":["bailong","jiangjun"],"label":"bailong"},{"k":"HUMOR","role":"humor","title":"阮草 × 沈文","note":"","text":"certainty × observation: she presents the weekend as settled fact (\"we swim at nine\"); his one dry observation lands; her certainty doesn't move.","cast":["shenwen","ruancao"],"label":"ruancao"}],"plants":[{"text":"the founding-pair friction texture (→ B2 peak bond)","to":[]},{"text":"白龍's one-bowl range (→ L13 six close)","to":["B1L13"]}],"core_note":"","holes":0,"marquee":"the first founding-pair clash","label":"shenwen","in_marquee":["shenwen","ruancao"],"named":["shenwen","ruancao","xingye","adi","bailong","jiangjun"],"third":1,"slot":"","title_en":"What Are You Doing This Weekend?","theme_en":"Hobbies","tone_words":["funny"],"tone":2.0,"status":"packet","packet":{"readings":[{"id":"B1L03-RU1","k":"RU1","title_zh":"都好玩！","han":284,"text":"週末早上，人很多。打網球的人來，打籃球的人也來，踢足球的人、游泳的人、聽音樂的人都來。\n\n網球的人：「你好！你喜歡運動嗎？我們常打網球和棒球。明天早上你也來打，怎麼樣？」\n\n阿迪：「網球……我覺得網球很好玩。」\n\n游泳的人：「你們好！我們常游泳。游泳很好玩！你也來游泳嗎？」\n\n阿迪：「游泳也很好玩……足球呢？踢足球也好玩……我也很喜歡聽音樂……」\n\n星野：「網球好玩！籃球好玩！游泳也好玩！都好玩！我都要去！」\n\n網球的人：「請問，你叫什麼名字？」\n\n星野：「我叫星野！」\n\n游泳的人：「星野，明天早上來游泳，怎麼樣？」\n\n星野：「好！」\n\n網球的人有星野的名字，游泳的人也有星野的名字，籃球的人也有。\n\n阿迪呢？阿迪覺得網球好玩，籃球好玩，足球好玩，游泳也好玩。網球的人沒有阿迪的名字，籃球的人沒有，游泳的人也沒有。\n\n明天早上，星野去打網球，也去游泳。阿迪呢？阿迪聽音樂。","synopsis":"Weekend-morning club fair: the tennis, basketball, soccer, swimming, and music tables all make their pitch. 星野 puts her name on three lists before anyone finishes a sentence; 阿迪 finds every single club 好玩 and signs exactly none."},{"id":"B1L03-RU2","k":"RU2","title_zh":"看電影還是吃晚飯？","han":211,"text":"星野：今天晚上做什麼？\n\n星野：我們一起看電影，好不好？\n\n阿迪：好啊！看電影還是吃晚飯？\n\n星野：都可以！\n\n沈文：我都可以。\n\n阿迪：妳想看什麼電影？\n\n星野：日本電影！美國電影也可以！\n\n阿迪：妳想吃什麼菜？\n\n星野：越南菜，好不好？\n\n沈文：可以。\n\n阿迪：看電影還是吃越南菜？\n\n星野：都要！\n\n沈文：今天晚上我想學中文……\n\n星野：學中文？今天是週末啊！\n\n阿迪：我們一起學中文吧！\n\n星野：不要！看電影吧！\n\n阿迪：吃晚飯吧！\n\n星野：好啊！吃晚飯，也看電影！\n\n沈文：吃什麼菜呢？\n\n星野：越南菜！日本菜也可以！\n\n阿迪：看什麼電影呢？\n\n星野：都可以！\n\n沈文：……\n\n今天晚上，他們沒看電影，沒吃越南菜，也沒學中文。","synopsis":"A group-chat log that plans tonight with total energy and zero outcomes: movie or dinner, Japanese or Vietnamese, twelve-plus messages of 都可以. Closing caption: they watched nothing, ate nothing, and 沈文 didn't study Chinese either."},{"id":"B1L03-C1","k":"C1","title_zh":"明天早上，我們去游泳","han":200,"text":"晚上，沈文、阮草、星野和阿迪一起來珍貓喝茶。\n\n阮草：「明天是週末。明天早上，我們去游泳。」\n\n沈文：「……我們？」\n\n阮草：「我們。你、我、星野、阿迪，一起去。游泳是運動，運動很好。」\n\n沈文：「明天早上，我想喝咖啡、聽音樂、看書……」\n\n阮草：「你常坐，不常運動。」\n\n星野：「好啊好啊！我喜歡游泳！」\n\n阿迪：「我也去！我覺得游泳很好玩！」\n\n沈文：「阮草，妳常游泳嗎？」\n\n阮草：「不常。」\n\n沈文：「妳喜歡游泳嗎？」\n\n阮草：「不喜歡。」\n\n沈文：「……」\n\n阮草：「游泳很好。明天早上，我們都去。」\n\n沈文：「你們去吧。我喝咖啡。」\n\n阮草：「你也去。」\n\n沈文：「我不去。」\n\n阮草：「你去。」\n\n兩個人都喝茶。星野看沈文，阿迪看阮草。\n\n明天早上，誰去游泳呢？","synopsis":"阮草 announces the weekend as settled fact — swimming, all four, tomorrow morning, because exercise is good for you. 沈文's quiet follow-up questions reveal she neither swims nor likes swimming; her certainty doesn't move an inch, his 我不去 doesn't either, and the reading ends with both sipping tea and the question open."},{"id":"B1L03-C2","k":"C2","title_zh":"白龍的週末","han":171,"text":"週末，很多人去打網球，很多人去看電影。白龍不打網球，不踢足球，也不游泳。白龍去珍貓。\n\n吳老闆：「你要喝什麼？」\n\n白龍：「烏龍茶。」\n\n吳老闆：「好。」\n\n珍貓人不多。白龍坐，喝茶，看書。\n\n將軍來。很多人喜歡將軍，將軍都不喜歡。將軍喜歡白龍。\n\n將軍坐。白龍看書，將軍看白龍。\n\n白龍常照相。今天他也照相。將軍的照片：兩張、五張……都是將軍，都很好看。\n\n晚上，珍貓人不多。白龍喝茶，將軍坐。他們不看電影，不聽音樂，也不打網球。\n\n白龍覺得，這個週末很好。將軍呢？將軍坐。","synopsis":"Across town everyone else is off to courts and cinemas; 白龍 orders oolong at 珍貓, reads, and photographs 將軍 — who dislikes everyone, likes 白龍, and sits. Evening comes, the café stays quiet, and by his own flat verdict it is a very good weekend."}]}},{"id":"B1L04","book":1,"n":4,"title":"How Much Does That Cost in Total?","theme":"購物","tag":"","topic":"shopping · prices · reasons · object size/function","grammar":"塊/杯/支/種 · 幫 · 的-omit · 太…了 · 能","cards":[{"k":"RU1","role":"runup","title":"first half — food-stand buying: 一共·多少錢·老闆·買·杯·包子·外帶·內用","note":"","text":"breakfast-stand ordering ritual — sizes, totals, 外帶/內用; the stall owner's patience texture.","cast":[],"label":null},{"k":"RU2","role":"runup","title":"second half — phones/prices: 支·新·手機·太貴了·舊·能上網·便宜·萬·千","note":"","text":"phone-shop-window texture — new 的 vs old 的, 太貴了; 白龍 examines one phone alone and buys nothing (glimpse).","cast":["bailong"],"label":"bailong"},{"role":"marquee","title":"the haggle","note":"","text":"night-market shopping; 阮草 is scary-good — total conviction, counts every dollar (money-consciousness seed); the vendor surrenders; the group watches in awe.","k":"C1","cast":["ruancao"],"label":"ruancao"},{"role":"subplot","title":"","note":"","text":"星野's paradise — she drags everyone to one more stall, first to try what everyone dodges (the tourist at her most delightful).","k":"C2","cast":["xingye"],"label":"xingye"},{"role":"breather","title":"","note":"orbit","text":"across the market 白龍 shops alone — little things to fill a quiet room.","k":"C3","cast":["bailong"],"label":"bailong"},{"k":"HUMOR","role":"humor","title":"","note":"","text":"阮草 fierce-conviction, behavioral — she haggles for a classmate's purchase *without being asked*, wins, hands it over; no thanks expected (love as doing, comedy as certainty).","cast":["ruancao"],"label":"ruancao"}],"plants":[{"text":"counts-every-dollar (→ L15 gravity)","to":["B1L15"]},{"text":"星野 first-to-try (genki bank)","to":[]},{"text":"白龍's solitary fill-the-quiet buying (→ L13)","to":["B1L13"]}],"core_note":"","holes":0,"marquee":"the haggle","label":"ruancao","in_marquee":["ruancao"],"named":["ruancao","xingye","bailong"],"third":1,"slot":"climax","title_en":"How Much Does That Cost?","theme_en":"Shopping","tone_words":["funny"],"tone":2.0,"status":"packet","packet":{"readings":[{"id":"B1L04-RU1","k":"RU1","title_zh":"外帶還是內用？","han":261,"text":"早上，老闆來了。包子很熱，茶很熱，咖啡也很熱。很多人來買。\n\n阿迪來了。\n阿迪：「老闆，你好！我要五個大包子、兩杯熱茶，內用。」\n老闆：「好的。大的一個二十塊，熱茶一杯十塊。一共一百二十塊。」\n阿迪：「好，一共一百二十塊！」\n\n星野來了。\n星野：「老闆！一杯熱咖啡！我要大杯的！」\n老闆：「好的，大杯。」\n星野：「……對不起，我要中杯的！」\n老闆：「好的，中杯。」\n星野：「老闆，對不起對不起，我要大杯的！」\n老闆：「好的，好的。大杯的熱咖啡，外帶還是內用？」\n星野：「外帶！一共多少錢？」\n老闆：「大杯的三十塊。」\n\n沈文來了。\n沈文：「請問，包子熱不熱？」\n老闆：「這個……不熱了。我幫你微波，好不好？」\n沈文：「好的，謝謝。」\n老闆：「小的一個十塊，大的一個二十塊。你要哪種？」\n沈文：「兩個小的，外帶。一共多少錢？」\n老闆：「一共二十塊。」\n沈文：「謝謝老闆。」\n老闆：「不客氣！明天來，包子很熱！」","synopsis":"Morning at the breakfast stand: three classmates cycle through the full ordering ritual — sizes, totals, for-here-or-to-go — while the owner absorbs 星野's triple order-change without blinking. 沈文 gets the day's last cool buns microwaved; zero story, pure ritual."},{"id":"B1L04-RU2","k":"RU2","title_zh":"新的、便宜的","han":183,"text":"賣手機的老闆有很多手機：新的、舊的、大的、小的，很多種。\n新手機很貴，一支一萬五千塊。能上網，能照相，很好看。\n舊手機很便宜，一支兩千塊。不能上網，不好看，也不能照相。\n\n白龍來了。他看手機，不買手機。\n老闆：「先生！這支很新！能上網，能照相！」\n白龍：「多少錢？」\n老闆：「一萬五千塊！」\n白龍：「太貴了。」\n老闆：「那……這支呢？九千塊！」\n白龍：「太貴了。」\n老闆：「這支舊的，很便宜！兩千塊！」\n白龍：「……太舊了。」\n老闆：「先生，你要哪種手機？」\n白龍：「新的、便宜的。」\n老闆：「……沒有那種手機。」\n白龍：「嗯。」\n白龍不買。他明天也來看。\n老闆：「……為什麼？！」","synopsis":"Phone-shop-window texture: new-versus-old price signs, then the flattest customer alive walks the owner's whole pitch down to nothing — he wants a phone that is new AND cheap, and no such phone exists. He buys nothing and will be back tomorrow to look again; the owner's 為什麼 is the punchline."},{"id":"B1L04-C1","k":"C1","title_zh":"兩百五","han":261,"text":"晚上，很多人來買，很多人來賣。賣包子的、賣茶的、賣咖啡的、賣舊手機的，都來了。沈文、阮草、星野、阿迪也來了。\n\n沈文看一種烏龍茶。\n沈文：「請問老闆，這種茶多少錢？」\n老闆：「四百塊。很好喝的茶！」\n沈文覺得太貴了。他不買，他要去看包子。\n\n阮草來了。她看沈文，她看茶。\n阮草：「老闆，這種茶，四百塊？」\n老闆：「四百塊，小姐。」\n阮草：「賣茶的有三個。那個老闆賣三百塊，那個賣三百五十塊。你賣四百塊，為什麼？」\n老闆：「這……我的茶好！」\n阮草：「都是這種茶。」\n老闆：「……三百塊。」\n阮草：「兩百五。」\n老闆：「小姐！兩百五太……」\n阮草：「兩百五。」\n老闆看阮草，阮草看老闆。\n老闆：「……好、好的！兩百五十塊！」\n\n阮草買茶。她看沈文：「你的。」\n沈文：「我的？……謝謝！」\n阮草：「不客氣。」她去看包子了。\n星野：「阮草！我要幫妳照相！」\n阮草：「為什麼？」\n星野：「妳太好看了！」\n晚上的茶很好喝。","synopsis":"Night-market marquee: 沈文 walks away from an overpriced oolong, and 阮草 — unasked — steps in having already priced all three tea stalls, stares the vendor down to 250, and hands 沈文 the tea with two words: \"Yours.\" The group watches in awe; 星野 demands a photo of her."},{"id":"B1L04-C2","k":"C2","title_zh":"是茶還是咖啡？","han":252,"text":"星野：「你們看那個老闆！他賣的是什麼？我們去看吧！」\n阿迪：「我們買包子，好不好？」\n星野：「包子明天買！我們去看吧！」\n\n他們去看。老闆賣的很熱，有大杯的，有小杯的，不是茶，也不是咖啡。\n星野：「老闆，請問這是什麼？」\n老闆：「很好喝的！」\n星野：「是茶嗎？」\n老闆：「不是。」\n星野：「是咖啡嗎？」\n老闆：「也不是。」\n阿迪：「……那是什麼？」\n老闆：「你買一杯，好不好？」\n\n「好喝！好喝！」\n是誰？不是老闆，也不是星野。\n沈文：「……對不起。」\n\n星野：「我要一杯！大杯的，熱的！」\n阿迪：「我要小杯的……」\n沈文：「我不要，謝謝。」\n星野喝。他們都看星野。\n星野：「……！」\n阿迪：「怎麼樣？」\n星野：「太好喝了！老闆，這個太好喝了！我要買三杯，外帶！」\n老闆很喜歡星野。\n阿迪喝小杯的：「……嗯，好喝。」\n沈文：「……我也要一杯。」\n星野：「你們看！那個老闆賣的是什麼？我們也去看吧！」\n阿迪：「……我們的包子呢？」","synopsis":"星野's paradise: a stall selling a hot mystery drink that is not tea and not coffee — the vendor won't say, and the students don't have the word anyway. 星野 orders the large first, declares it delicious, and is already dragging everyone to the next unknown stall while 阿迪 mourns the buns they never bought."},{"id":"B1L04-C3","k":"C3","title_zh":"一個人買的","han":238,"text":"晚上，很多人一起來，一起買。白龍一個人來。\n他看新手機，不買。他看舊手機，也不買。他看，看，看。\n\n一個老闆賣包子。\n老闆：「先生，要幾個？」\n白龍：「兩個。」\n老闆：「你哪國人？是美國人嗎？」\n白龍：「不是。」\n老闆：「日本人？」\n白龍：「不是。」\n老闆：「……越南人呢？」\n白龍：「……」\n老闆：「好的，好的。兩個包子，二十塊。」\n\n一個老闆賣舊照片，很多張，都很舊。\n白龍看一張：很多人，一起吃晚飯。他看，看，看。\n老闆：「先生，這張很舊了……」\n白龍：「多少錢？」\n老闆：「十塊。」\n白龍：「好。」\n\n他買一杯熱茶，外帶。他看很多人：一個小姐買茶——「兩百五。」——三個人看她。\n白龍：「……好玩。」\n\n他買的不多：兩個包子、一杯熱茶、一張舊照片。\n他一個人來，也一個人去。\n他的家很小。晚上，他吃包子、喝熱茶，看那張舊照片——很多人，一起吃晚飯。","synopsis":"Across the same market, 白龍 shops alone: two buns from a vendor whose where-are-you-from guessing game he lets die, one cup of tea, and — after a long look — a ten-dollar old photograph of strangers sharing dinner. He watches a girl win a haggle from afar, goes home alone, and drinks his tea looking at somebody else's full table."}]}},{"id":"B1L05","book":1,"n":5,"title":"Beef Noodles Are Really Delicious","theme":"食物","tag":"","topic":"food & drink · tastes · can/can't do · asking help","grammar":"有一點 · 得-complement · 會 · 到","cards":[{"k":"RU1","role":"runup","title":"first half — the famous shop: 牛肉麵·好吃·有名·小吃·最·湯·點·碗·小籠包·臭豆腐","note":"","text":"the beef-noodle queue — line chatter about the most famous 小吃; pure appetite texture.","cast":[],"label":null},{"k":"RU2","role":"runup","title":"second half — cooking/taste: 會做飯·得·辣·怕·自己·教·甜點·有一點","note":"","text":"who-can-cook survey — 阿迪 claims mastery (credibly), 星野 claims enthusiasm (loudly), 沈文 claims survival.","cast":["shenwen","xingye","adi"],"label":"adi"},{"role":"marquee","title":"the first proper group meal","note":"","text":"阿迪 the foodie leads; the spicy-noodle dare; the table becomes a table (the binder at full shallow warmth — the meal IS the bond).","k":"C1","cast":["adi"],"label":"adi"},{"role":"subplot","title":"the familial anchor","note":"🔒-adjacent, CHARACTER-BEATS","text":"阮草 slides the best piece onto someone's plate; drawn out, she mentions her mother always did it — \"nobody said the words, they just handed you the fish.\" *Every later food gesture now reads family, never romance.*","k":"C2","cast":["ruancao"],"label":"ruancao"},{"role":"breather","title":"the taker plant","note":"locked chain","text":"星野 waves everyone ahead, states no preference, eats what's left, insists she's fine and owes no one (axis-2, shown in action).","k":"C3","cast":["xingye"],"label":"xingye"},{"k":"HUMOR","role":"humor","title":"阿迪 × any-argument","note":"","text":"defuse-by-food: the who-ordered-wrong squabble dies the moment he redistributes the dishes; nobody notices they've been managed.","cast":["adi"],"label":"adi"}],"plants":[{"text":"best-piece anchor (→ L13 adoption)","to":["B1L13"]},{"text":"taker plant","to":[]}],"core_note":"","holes":0,"marquee":"the first proper group meal","label":"adi","in_marquee":["adi"],"named":["shenwen","ruancao","xingye","adi"],"third":1,"slot":"boundary","title_en":"Beef Noodles Are Delicious","theme_en":"Food & drink","tone_words":["funny","warm"],"tone":1.75,"status":"packet","packet":{"readings":[{"id":"B1L05-RU1","k":"RU1","title_zh":"有名的牛肉麵店","han":268,"text":"星野和林薇來吃牛肉麵。店的人真多。\n星野說：「這麼多人！這家店賣什麼？」\n林薇說：「牛肉麵。這家店很有名，臺灣人都知道。」\n星野說：「牛肉麵有這麼好吃嗎？」\n林薇說：「有。人少的店，牛肉麵不一定好吃；人這麼多的店，一定好吃。」\n星野說：「臺灣的小吃真多。小籠包有名，臭豆腐也有名……」\n林薇說：「是啊，都有名。這家店最有名的是牛肉麵，湯最好喝。」\n星野說：「我知道了！我要牛肉麵，也要小籠包！」\n林薇說：「小籠包是那家店的，這家店賣牛肉麵。」\n星野說：「那我們也去那家店！」\n老闆說：「你們好，點什麼？」\n林薇說：「兩碗牛肉麵。」\n星野說：「我要大碗的！」\n牛肉麵來了。星野喝湯，說：「真好喝！這麼好喝的湯，我要喝五碗！」\n林薇說：「五碗？妳……」\n星野說：「好吧，兩碗。」\n林薇說：「人這麼多，妳知道為什麼了吧。」\n星野說：「知道！最有名的店，最好吃的牛肉麵！」","synopsis":"Hoshino and Lin Wei queue at a famous beef-noodle shop; the local explains the crowd-equals-quality law of Taiwanese 小吃 while Hoshino wants everything on the island at once.\nPure appetite texture — zero story advancement; the queue itself is the culture lesson (dangdai B1L05 culture note: queuing at food stands)."},{"id":"B1L05-RU2","k":"RU2","title_zh":"誰會做飯？","han":255,"text":"蘇老師說：「我們今天說『做飯』。誰會做飯？」\n阿迪說：「我會。我常自己做飯，做得不錯。」\n蘇老師說：「你會做什麼菜？」\n阿迪說：「很多菜我都會做，甜點也會。可是我做的菜有一點辣。」\n星野說：「我也會做飯！我很喜歡做飯！」\n阿迪說：「妳做得怎麼樣？」\n星野說：「……做得有一點不好。昨天我做了菜，我自己都不想吃。」\n蘇老師說：「所以妳要學。沈文呢？你會做飯嗎？」\n沈文說：「我會做飯。做得不好看，可是能吃。」\n星野說：「阿迪，你可以教我們做飯嗎？」\n阿迪說：「可以啊。可是我做的菜辣，你們怕辣嗎？」\n星野說：「我不怕辣！你也要教我做甜點！」\n沈文說：「我有一點怕。」\n阿迪說：「好，週末你們到我家來，我教你們做飯。」\n蘇老師說：「太好了。做得好吃，我也要吃。」\n阿迪說：「老師，做得不好呢？」\n蘇老師說：「做得不好，你們去餐廳吃。」","synopsis":"Classroom who-can-cook survey: Adi claims mastery credibly, Hoshino claims enthusiasm loudly (and confesses last night's inedible result), Shen Wen claims survival (\"ugly but edible\").\nSu Laoshi closes the loop with the restaurant escape clause; a weekend cooking lesson gets scheduled — texture only, no story advancement."},{"id":"B1L05-C1","k":"C1","title_zh":"一起吃晚飯","han":299,"text":"阿迪說：「我知道一家好餐廳，菜做得真不錯。今天晚上我們一起去吃晚飯，怎麼樣？」\n阮草說：「一個人多少錢？」\n阿迪說：「很便宜。」\n阮草說：「好，去。」\n晚上，沈文、阮草、星野和阿迪到了餐廳。點菜的是阿迪：牛肉麵、小籠包、臭豆腐，也有湯。\n阿迪說：「這家店的臭豆腐最有名，一定要點。這碗牛肉麵是辣的，誰要吃？」\n星野說：「我！我不怕辣！」\n星野吃了辣的牛肉麵，不說什麼，喝茶。一杯，兩杯。\n阿迪說：「怎麼樣，辣嗎？」\n星野說：「不辣！……這茶真好喝！」\n阮草說：「這碗臭豆腐是誰的？我沒點臭豆腐。」\n星野說：「不是我的！」\n阮草說：「你們都說沒點，那是誰——」\n阿迪說：「小籠包是星野的，牛肉麵是阮草的，臭豆腐是我的。吃吧，熱的好吃。」\n沒有人說什麼了。\n沈文看阿迪，說：「臭豆腐是你點的吧？」\n阿迪說：「是啊。怎麼樣，好吃嗎？」\n星野和阮草都說：「好吃！」\n菜都吃了。阿迪說：「明天晚上，我們吃什麼？」\n星野說：「明天？！」\n阿迪說：「是啊。臺灣好吃的店這麼多！」","synopsis":"The first proper group meal: Adi picks the place, orders for everyone, and runs the table — the spicy-noodle dare (Hoshino won't admit defeat; the tea disappears), then a who-ordered-the-stinky-tofu squabble that dies the instant he redistributes the dishes.\nOnly Shen Wen clocks that Adi ordered it himself; the meal ends with Adi already planning tomorrow's — the table has become a table."},{"id":"B1L05-C2","k":"C2","title_zh":"最好的一塊牛肉","han":238,"text":"今天沈文、阮草和星野去一家小店吃牛肉麵。星野說：「林薇說，這家店的牛肉麵很有名。」\n麵來了。沈文的碗牛肉少。\n阮草不說什麼。最大的一塊牛肉，到了沈文的碗。\n沈文說：「這是妳的牛肉。」\n阮草說：「你吃。」\n沈文說：「為什麼？」\n阮草說：「你的碗牛肉少。吃吧。」\n星野看了，說：「我的碗呢？」\n阮草說：「妳的牛肉不少。」\n星野說：「好吧……」\n沈文吃了牛肉，說：「謝謝。妳常這麼做嗎？」\n阮草喝湯，說：「我家吃飯，我媽媽也這麼做。媽媽不說什麼，可是最好的一塊，一定到你的碗。」\n沈文說：「不說什麼……」\n阮草說：「是啊。不說，可是你知道。」\n沈文不說什麼了。他看自己的碗，牛肉多了。\n星野說：「明天我們也一起來吃麵，好不好？」\n阮草說：「好。」\n最小的一塊牛肉，到了阮草自己的碗。","synopsis":"Ruan Cao wordlessly slides the best piece of beef into Shen Wen's bowl; drawn out, she explains her mother did the same — nobody said the words, the best piece just arrived in your bowl. The last line shows the provider keeping the smallest piece for herself.\n"},{"id":"B1L05-C3","k":"C3","title_zh":"我都可以","han":226,"text":"晚上，星野、阿迪和阮草去吃小吃。\n阿迪說：「星野，妳想吃什麼？牛肉麵還是小籠包？」\n星野說：「我都可以！你們點吧。」\n阮草說：「妳最喜歡吃什麼？」\n星野說：「我什麼都喜歡，真的！」\n阿迪點了小籠包。小籠包來了，一共五個。\n阿迪說：「五個，有一點少。星野，妳吃。」\n星野說：「你們吃，你們吃！我不想吃，你們吃吧！」\n阿迪吃了兩個，阮草吃了兩個。\n星野吃了最小的一個，說：「真好吃！」\n阮草說：「妳吃得太少了。」\n星野說：「不少！我吃得很多了，真的！」\n阿迪說：「我要買小籠包，幫妳也買一個？」\n星野說：「不要不要！你們不要幫我買！我真的吃得很多了！」\n阿迪說：「好吧。」\n星野照相，說：「你們看，小籠包的照片真好看！」\n照片很好看。小籠包沒有了。","synopsis":"Snack-run breather: Hoshino states no preference, waves everyone ahead, eats the last and smallest xiaolongbao, and refuses — twice, brightly — to let anyone buy her more. She photographs the empty basket: the photos are beautiful; the food is gone. Nobody at the table notices; only the reader does."}]}},{"id":"B1L06","book":1,"n":6,"title":"Their School Is Up in the Mountains","theme":"位置","tag":"","topic":"locations & positions · near/far · describing places","grammar":"在 · existential 有 · V(一)V · 不是 · location-of-activity","cards":[{"k":"RU1","role":"runup","title":"first half — mountain/scenery: 在山上·遠·風景·美·前面海·後面山·花蓮·附近","note":"","text":"postcard texture — a friend's school in 花蓮, sea in front, mountains behind; pure scenery redundancy.","cast":[],"label":null},{"k":"RU2","role":"runup","title":"second half — campus: 圖書館·宿舍·教室·旁邊·裡面外面·商店·大樓·方便","note":"","text":"campus-tour notice — where everything 在/有; **max 圖書館 density (warms the naming word for Core)**.","cast":[],"label":null},{"role":"marquee","title":"THE NAMING","note":"series-level","text":"studying in the 圖書館, the robot chirps at the worst moment; the apology tour ends with a name — 圖書館's 圖, 圖靈's 圖 — ironic-grand, given the way a family gives a nickname: **小圖**. (機器人 introduced here — CAST law, early; 機 is an early char.)","k":"C1","cast":["xiaotu"],"label":"xiaotu"},{"role":"subplot","title":"the fixer intro","note":"","text":"the group gets hopelessly lost finding a mountain temple; 林薇 saves the day without breaking stride; 沈文's bag, of course, had the umbrella and water (prepared-one texture).","k":"C2","cast":["shenwen","linwei"],"label":"linwei"},{"k":"HUMOR","role":"humor","title":"小圖 × 沈文","note":"","text":"owner apologizing for his robot, now with a name to apologize for: 「小圖。對不起。」 (the printed pairing's B1 form: behavioral, object-scale).","cast":["shenwen","xiaotu"],"label":"xiaotu"}],"plants":[{"text":"the name 小圖 (→ everything)","to":[]},{"text":"林薇 = the one who knows the way (→ her fixer lane; the leaned-on ache accrues silently)","to":[]},{"text":"prepared-bag texture","to":[]}],"core_note":"","holes":0,"marquee":"THE NAMING","label":"xiaotu","in_marquee":["xiaotu"],"named":["shenwen","linwei","xiaotu"],"third":2,"slot":"","title_en":"Their School Is Up in the Mountains","theme_en":"Locations & positions","tone_words":["funny"],"tone":2.0,"status":"packet","packet":{"readings":[{"id":"B1L06-RU1","k":"RU1","title_zh":"他們的學校在山上","han":193,"text":"星野：「阮草，妳看這張照片！」\n\n阮草：「這是哪裡？」\n\n星野：「花蓮！我的朋友在那裡上課。」\n\n阮草：「他的學校在花蓮？」\n\n星野：「是啊！他們的學校在山上。妳看，學校前面是海，後面是山！」\n\n阮草：「山上的學校……遠嗎？」\n\n星野：「有一點遠。可是妳看這張，風景真美！」\n\n阮草：「真的很美。我聽說，花蓮的風景最美。」\n\n星野：「是啊！在那個地方上課，前面是海，後面是山，真好！」\n\n阮草：「你的朋友喜歡那裡嗎？」\n\n星野：「很喜歡。他說，學校附近有很多好吃的小吃，也有好喝的咖啡。」\n\n阮草：「他現在在花蓮嗎？」\n\n星野：「不在！他現在在我們學校——在樓下！我們去樓下找他吧！」","synopsis":"Hoshino narrates her phone photos again — a friend's school in Hualien, sea in front, mountains behind — while Ruan Cao asks the practical questions.\nPunchline: the faraway friend is downstairs right now, so they go find him."},{"id":"B1L06-RU2","k":"RU2","title_zh":"歡迎新學生！","han":242,"text":"歡迎新學生！你們好！\n\n歡迎你們來我們學校上課。請看：\n\n我們學校有五棟大樓。前面這棟大樓有五樓，你們的教室都在裡面。你們在這裡上課，也在這裡找老師。\n\n圖書館在教室的旁邊。圖書館很大，裡面有很多書，也有很多中文書。學生都喜歡在圖書館看書。可是，在圖書館裡面，不可以吃東西，也不可以喝咖啡。\n\n宿舍在圖書館的後面，很近。宿舍很新，也很方便。宿舍的樓下有商店，商店裡面東西很多，也很便宜。\n\n你們在哪裡吃飯呢？宿舍的旁邊有餐廳，餐廳的菜好吃，也不貴。學校的外面有很多小吃店，都很近，很方便。\n\n喜歡游泳嗎？我們有游泳池！游泳池在大樓的後面，學生常去那裡游泳。\n\n歡迎你們！請常來圖書館看書！","synopsis":"A welcome notice for new students walks the campus wall by wall: classrooms, dorm, shops, pool — and the library, named over and over.\nThe no-food, no-coffee library rule installs the hush that the naming scene will shatter."},{"id":"B1L06-C1","k":"C1","title_zh":"他叫小圖","han":275,"text":"週末的圖書館裡面人很多。學生都在看書。沒有人吃東西，沒有人喝咖啡。\n\n沈文也在看書。他的機器人很小，在書的旁邊。星野和阮草在沈文的旁邊看書。\n\n機器人：「風景真美！」\n\n圖書館裡面沒有風景。學生都看沈文。\n\n沈文：「對不起。」\n\n機器人：「老師好看！」\n\n圖書館裡面也沒有老師。學生都看沈文。\n\n沈文：「對不起！對不起！」\n\n他們去外面。\n\n星野：「你的機器人真好玩！他叫什麼名字？」\n\n沈文：「他沒有名字。」\n\n阮草：「為什麼沒有名字？」\n\n沈文想一想，說：「你們知道圖靈嗎？」\n\n星野：「圖靈？他是誰？」\n\n沈文：「一個很有名的人。他是機器人的爸爸。」\n\n星野：「機器人的爸爸？！」\n\n阮草看看機器人，也看看圖書館，說：「圖書館的圖，圖靈的圖。」\n\n星野：「叫他小圖，好不好？」\n\n機器人：「小圖！小圖！」\n\n沈文：「……好。他叫小圖。」\n\n他們去圖書館裡面看書。\n\n小圖：「小圖好玩！」\n\n學生都看沈文。\n\n沈文：「小圖。對不起。」","synopsis":"The robot detonates the library hush twice — \"beautiful scenery!\" where there is none — and the apology tour ends outside with a name: 圖 from library, 圖 from Turing.\nBack inside, the first thing 小圖 does with his new name is yell it; 沈文's apology now has a name in it."},{"id":"B1L06-C2","k":"C2","title_zh":"看海的地方","han":254,"text":"星野說：「聽說山上有一個地方，風景最美，前面可以看海。這個週末我們去吧！」\n\n週末，星野、阿迪、沈文和林薇一起去山上。\n\n山上很熱，沒有商店，也沒有人。那個地方在哪裡？\n\n阿迪：「我們現在在哪裡？」\n\n星野：「不知道……」\n\n星野的手機在山上不能上網。\n\n阿迪：「我想吃飯。這裡有餐廳嗎？」\n\n山上沒有餐廳。\n\n沈文有熱茶，也有包子。\n\n阿迪：「為什麼你有包子？！」\n\n沈文：「山上沒有商店。」\n\n他們喝茶，吃包子。可是，那個看海的地方在哪裡呢？\n\n林薇喝茶，說：「你們找那個看海的地方嗎？」\n\n星野：「妳知道那裡？！」\n\n林薇：「我常來。很近，在前面。」\n\n那個地方真的很美。前面是海，後面都是山。\n\n星野照相，照很多張。阿迪吃包子。\n\n星野：「林薇，妳知道很多地方！」\n\n林薇：「這裡是我的家啊。」\n\n沈文看看林薇。林薇不看海，林薇看他們。","synopsis":"The group hunts a famous sea-view spot in the mountains and gets thoroughly lost — no shops, no signal, and 沈文's bag of course has hot tea and baozi.\n林薇 solves it in two sentences without breaking stride; at the view, 沈文 notices she watches the group, not the sea."}]}},{"id":"B1L07","book":1,"n":7,"title":"Going to KTV at 9 O'clock in the Morning","theme":"時間","tag":"","topic":"time-when & time-duration · appointments · habits","grammar":"從…到 · progressive 在 · 每 · 可以","cards":[{"k":"RU1","role":"runup","title":"first half — appointments: 點·分·見面·從·中午·有空·沒問題·再見","note":"","text":"phone-tag texture — the group tries to find one shared free hour; 從幾點到幾點 volleys; nobody writes anything down.","cast":[],"label":null},{"k":"RU2","role":"runup","title":"second half — schedule: 每天·下課·下午·書法·課·開始·寫字·忙","note":"","text":"the 書法-class flyer + a day-in-the-schedule texture; 每天早上 redundancy.","cast":[],"label":null},{"role":"marquee","title":"the 9 AM KTV disaster","note":"","text":"someone books morning-nine, everyone reads night-nine; the time-confusion plays out to the bitter, sleepy end (ensemble comedy; the group survives its first logistics failure together).","k":"C1","cast":[],"label":null},{"role":"subplot","title":"","note":"orbit glimpse","text":"the 書法 class — the quiet girl nobody knows writes the best hand in the room and says nothing (金多恩's channel-split seeded: the flawless hand arrives before the voice).","k":"C2","cast":["jinduoen"],"label":"jinduoen"},{"k":"HUMOR","role":"humor","title":"","note":"","text":"星野 over-enthusiasm — the booking traces back to her 「什麼時候都可以！」; at 9 AM she is the only one singing (behavioral hyperbole).","cast":["xingye"],"label":"xingye"}],"plants":[{"text":"the flawless hand (→ L12 一百, B2 decode gag)","to":["B1L12"]},{"text":"group-logistics comedy bank","to":[]}],"core_note":"","holes":0,"marquee":"the 9 AM KTV disaster","label":null,"in_marquee":[],"named":["xingye","jinduoen"],"third":2,"slot":"","title_en":"KTV at 9 in the Morning","theme_en":"Time (point & duration)","tone_words":["funny"],"tone":2.0,"status":"packet","packet":{"readings":[{"id":"B1L07-RU1","k":"RU1","title_zh":"你們什麼時候有空？","han":263,"text":"星野：「你們好！你們在做什麼？」\n\n阿迪：「我剛打棒球，現在在吃午餐。」\n\n沈文：「我在圖書館看書。」\n\n阮草：「我在做飯。」\n\n星野：「對了！這個週末我們去大安KTV唱歌，怎麼樣？」\n\n阿迪：「好啊！我們什麼時候見面？」\n\n星野：「明天中午十二點，好不好？」\n\n沈文：「明天中午我沒有空，我得去銀行。」\n\n星野：「明天晚上呢？從七點到十點！」\n\n阿迪：「明天晚上我有事，我們家人一起吃晚飯。」\n\n星野：「後天中午呢？」\n\n阮草：「後天中午我得上課。」\n\n星野：「你們什麼時候有空？」\n\n沈文：「後天晚上八點到十點，我有空。」\n\n阿迪：「後天晚上，從七點到九點，我有空。」\n\n阮草：「後天中午十二點二十分到兩點四十分，我有空。」\n\n星野：「七點到九點？八點到十點？十二點二十分？！你們都沒有空！」\n\n阿迪：「對不起，下次吧！」\n\n星野：「沒問題！下次我們一定去大安KTV唱歌，在KTV見面！」\n\n阮草：「再見。」\n\n星野：「再見！」","synopsis":"A group-chat log that schedules nothing: Hoshino proposes KTV, and every volley of \"from X o'clock to Y o'clock\" lands on a different free hour.\nNobody writes anything down, everybody says \"next time\" — the failed-plans genre piece, dissolved with cheerful goodbyes."},{"id":"B1L07-RU2","k":"RU2","title_zh":"書法課，後天開始！","han":292,"text":"書法課，後天開始！\n\n你想學寫字嗎？書法很有意思！\n\n我們的書法課後天開始，每天都有課。每天下午四點半上課，五點半下課。教室在圖書館的旁邊。\n\n不會寫字嗎？沒問題！老師教你寫，你也可以問老師。\n\n書法課不貴，一個人三百塊。歡迎你們來學書法！\n\n星野和阿迪在大樓的外面。\n\n星野：「阿迪，你看！書法課！很有意思啊！我們一起去學吧！」\n\n阿迪：「我最近很忙，每天下午都有棒球比賽。」\n\n星野：「比賽什麼時候結束？」\n\n阿迪：「四點結束。」\n\n星野：「書法課四點半開始！沒問題啊！」\n\n阿迪：「等一下，等一下……比賽結束，我想吃晚飯。」\n\n星野：「你可以外帶！」\n\n阿迪：「後天下午我也有事……」\n\n星野：「你有什麼事？」\n\n阿迪：「我……我得看棒球比賽。」\n\n星野：「阿迪！」\n\n阿迪：「我不會寫字，字太多了！」\n\n星野：「我每天早上九點上中文課，中午十二點下課，下午都有空！我要學書法！」\n\n阿迪：「妳去學吧！我等一下得去看比賽，再見！」\n\n星野：「阿迪——！」","synopsis":"The calligraphy-class flyer (every day, 4:30 to 5:30, beginners welcome) — then Adi dodges it through four increasingly thin excuses while Hoshino demolishes each one.\nHis last defense is honest: too many characters. She's going anyway."},{"id":"B1L07-C1","k":"C1","title_zh":"早上九點的KTV","han":295,"text":"下午四點，下課。星野說：「後天我們去大安KTV唱歌吧！我什麼時候都可以！」\n\n阮草：「太貴了吧。」\n\n星野：「我問KTV什麼時候便宜！」\n\n晚上，星野說：「後天九點，從九點到十二點，一共三百塊！」\n\n阿迪：「真便宜！沒問題！」\n\n阿迪問沈文：「後天晚上八點吃晚飯，九點去唱歌？」\n\n沈文：「好啊。」\n\n後天早上八點四十分。\n\n星野：「你們在哪裡？！」\n\n阿迪：「星野……現在幾點？」\n\n星野：「八點四十分！KTV九點開始！」\n\n沈文：「九點是早上九點？！」\n\n星野：「是啊！早上最便宜！」\n\n阮草：「……我們現在去。」\n\n早上九點的大安KTV，裡面沒有人。\n\n老闆說：「歡迎！請進！」\n\n星野在唱歌，唱得很好。\n\n阿迪在喝咖啡——大杯的熱咖啡。\n\n沈文在喝熱茶。\n\n阮草說：「早上的KTV真便宜……」\n\n星野：「你們為什麼不唱歌？」\n\n阿迪：「現在是早上九點……」\n\n星野：「早上也可以唱歌！」\n\n星野一個人唱歌，從九點唱到十二點。\n\n十二點，結束。他們去吃午餐。\n\n阿迪：「下次晚上來吧……」\n\n星野：「晚上太貴了！」\n\n阮草：「下次也早上來。」\n\n阿迪看看他的咖啡。","synopsis":"Hoshino hunts the cheap KTV slot and books \"nine o'clock\" — everyone plans dinner-then-singing around night-nine, and the phone rings at 8:40 in the morning.\nAt the empty 9 AM KTV she sings alone for three hours while the others nurse hot drinks; the vote afterward splits 2–2, money against sleep."},{"id":"B1L07-C2","k":"C2","title_zh":"最美的字","han":274,"text":"書法課今天開始。教室在圖書館的旁邊，裡面有十個學生，星野和沈文也在。\n\n老師：「歡迎你們來上書法課！我們現在開始。今天學寫『山』。」\n\n學生都在寫字。\n\n星野的『山』很大，太大了。\n\n老師看看她的字，說：「……很大。」\n\n星野：「大的『山』好看啊！書法真有意思！」\n\n沈文的『山』不大也不小，很好看。\n\n教室的後面有一個學生。她不問老師，也不看人，她在寫字。\n\n老師去她的旁邊，看她寫字。\n\n老師：「你們都來看看！」\n\n學生都去看。她的『山』真美，教室裡面最美。\n\n星野：「太美了！妳寫得真美！」\n\n她看看星野，沒有說「謝謝」，也沒有說什麼。她在寫她的字。\n\n老師：「妳寫得真好。誰教妳寫字？」\n\n她看看老師，寫她的字。\n\n五點半，下課。星野想問她的名字，可是教室的後面沒有人。\n\n星野：「她是誰？」\n\n沈文：「不知道。」\n\n星野：「她的字真美！」\n\n沈文：「是啊。」他看看自己的『山』，說：「我們得每天來上課。」","synopsis":"First day of calligraphy class: Hoshino's mountain is enormous, Shenwen's is tidy — and the girl at the back writes the most beautiful character in the room and answers nothing, not even a thank-you.\nBy the time class ends she's gone; Shenwen looks at his own page and decides they'd better come every day."}]}},{"id":"B1L08","book":1,"n":8,"title":"Taking a Train to Tainan","theme":"交通","tag":"","topic":"transportation · comparing modes · plans","grammar":"跟 · 怎麼 · 比較 · 又…又 · 比","cards":[{"k":"RU1","role":"runup","title":"first half — the train: 坐火車·高鐵·快慢·車票·舒服·站·鐘頭","note":"","text":"ticket-window and platform texture — train vs HSR argued 又…又 by everyone with an opinion.","cast":[],"label":null},{"k":"RU2","role":"runup","title":"second half — around town: 騎機車·載·捷運·公車·計程車·參觀·故宮","note":"","text":"林薇's transport rundown — scooter vs MRT vs bus, delivered with local authority (pure competence texture; her lane).","cast":["linwei"],"label":"linwei"},{"role":"marquee","title":"the weekend south","note":"","text":"the group rides to 林薇's Tainan; she's oddly tense the closer home gets — the one who knows every route is quietest on this one (shown only; no explanation).","k":"C1","cast":["linwei"],"label":"linwei"},{"role":"subplot","title":"","note":"","text":"in Tainan she 載s them two at a time on the family scooter — the mechanic texture planted small (her open call ④ lean: roads/scooters from B1).","k":"C2","cast":[],"label":null},{"role":"breather","title":"","note":"","text":"星野 films everything; 林薇 watches her hometown be adored by a tourist and can't decide how she feels (foil seed, one beat).","k":"C3","cast":["xingye","linwei"],"label":"xingye"},{"k":"HUMOR","role":"humor","title":"林薇 × 星野","note":"","text":"sass × rapture: every landmark 星野 gasps at, 林薇 has a two-word local correction for (behavioral; the foil pairing's B1 form).","cast":["xingye","linwei"],"label":"linwei"}],"plants":[{"text":"Tainan tension (→ B2 foil plant \"aches to leave\")","to":[]},{"text":"scooter/載 texture (→ end-B2 accident staging)","to":[]},{"text":"foil geometry","to":[]}],"core_note":"","holes":0,"marquee":"the weekend south","label":"linwei","in_marquee":["linwei"],"named":["xingye","linwei"],"third":2,"slot":"","title_en":"Taking a Train to Tainan","theme_en":"Transportation","tone_words":["warm"],"tone":1.5,"status":"packet","packet":{"readings":[{"id":"B1L08-RU1","k":"RU1","title_zh":"火車或是高鐵？","han":238,"text":"早上，在教室裡面，蘇老師問：「從這裡到臺南，怎麼去？」\n\n星野說：「坐高鐵！高鐵非常快，兩個鐘頭！」\n\n阿迪說：「坐火車。火車又便宜又舒服。」\n\n星野說：「可是火車太慢了！要五個鐘頭！」\n\n阿迪說：「高鐵的車票太貴了！」\n\n「火車慢！」\n\n「高鐵貴！」\n\n蘇老師說：「好，好。坐火車或是坐高鐵，都可以。」\n\n沈文說：「坐火車比較慢，但是車票便宜；坐高鐵比較快，但是車票貴。」\n\n蘇老師說：「沈文說得非常好。」\n\n星野問：「老師，車票在哪裡買？」\n\n蘇老師說：「在火車站買。」\n\n阿迪說：「老師，火車上能吃東西嗎？能吃，我坐火車。」\n\n蘇老師說：「能。火車上又能吃東西，又能看風景，非常舒服。」\n\n中午下課，星野跟阿迪說：「明天我們坐火車去花蓮玩，怎麼樣？」\n\n阿迪問：「到花蓮要幾個鐘頭？」\n\n星野說：「我不知道！」","synopsis":"Classroom exercise: how do you get to Tainan? 星野 champions the HSR, 阿迪 the slow cheap train, and 沈文 settles it with one level comparison.\nZero plot — pure train-vs-HSR texture; ends on 星野 proposing a train trip to a place she can't time."},{"id":"B1L08-RU2","k":"RU2","title_zh":"問林薇，沒問題","han":223,"text":"在學校，同學都知道：不知道的東西，問林薇。\n\n沈文問：「我想去參觀故宮，怎麼去？」\n\n林薇說：「坐捷運，或是坐公車。」\n\n「公車？」\n\n「公共汽車，我們叫公車。」\n\n沈文問：「捷運比公車快嗎？」\n\n林薇說：「差不多。故宮裡面有很多中國古代的東西，你可以看一天。」\n\n星野問：「計程車呢？」\n\n「計程車比較貴。」\n\n星野問：「你為什麼騎機車？」\n\n林薇說：「騎機車最方便，也最快。」\n\n「你的機車能載幾個人？」\n\n「一個。載兩個人，不行。」\n\n沈文問：「高鐵的車票在哪裡買？」\n\n林薇說：「在網路上買，或是在便利商店買，都可以。便利商店也能買火車票。」\n\n阿迪問：「捷運上能吃東西嗎？」\n\n「不行。」\n\n「公車上呢？」\n\n「也不行。」\n\n「計程車呢？」\n\n「可以。」林薇說。「但是老闆喜歡不喜歡，我不知道。」","synopsis":"The classmates' standing FAQ desk: 林薇 fields every getting-around question — MRT vs bus to the Palace Museum, scooter passenger law, where tickets are sold.\nEnds on 阿迪 stress-testing where one may eat; pure local-authority texture, no story."},{"id":"B1L08-C1","k":"C1","title_zh":"去臺南的火車","han":253,"text":"週末，他們坐火車去臺南——林薇的家在臺南。\n\n車票，林薇在網路上買，五張，非常便宜。\n\n早上，五個人在火車站見面。阿迪有很多吃的東西：包子、甜點、烏龍茶。\n\n星野問：「我們坐五個鐘頭的火車，你有五天的東西？」\n\n阿迪說：「火車上不能買包子。」\n\n火車上，星野非常忙：看風景、照相、問這個、問那個。\n\n「臺南有什麼好玩的？」\n\n「很多。」林薇說。\n\n「有什麼好吃的？」\n\n「很多。」\n\n「你家在火車站附近嗎？」\n\n「不遠。」\n\n星野跟阿迪吃東西，阮草看書。沈文看林薇。\n\n林薇看外面的風景。火車很快，風景很美。星野問，林薇說「很多」；星野不問，林薇不說。\n\n沈文看林薇，沒問什麼。\n\n火車到臺南站了。\n\n站的外面，林薇的媽媽來接他們。媽媽說：「歡迎！歡迎！」\n\n「媽媽。」林薇說。\n\n媽媽問林薇：「火車坐得怎麼樣？」\n\n「好。」林薇說。\n\n那個「好」，非常小。","synopsis":"The group takes the slow train south to 林薇's Tainan; the local who answers everything answers in single words the closer home gets, and only 沈文 notices.\nHer mother meets them at the station — 林薇's \"good\" comes out very small. Nothing is explained."},{"id":"B1L08-C2","k":"C2","title_zh":"爸爸的機車","han":197,"text":"在臺南，林薇家有機車，是爸爸的，非常舊。\n\n林薇看一看機車，說：「好了。我載你們去玩。」\n\n星野問：「機車能載幾個人？」\n\n「一個。」林薇說。「載兩個人，不行。一個一個來。」\n\n阿迪問：「這麼舊的機車，能騎嗎？」\n\n林薇說：「舊，但是好。」\n\n林薇騎機車，騎得非常快，也非常好。臺南的地方，林薇都知道，不看手機。\n\n星野坐在後面。「太快了！太快了！」\n\n「坐好。」林薇說。\n\n林薇載他們去看海。海又大又美。\n\n在海的附近，機車有一點不舒服。林薇說：「等一下。」林薇看一看機車的裡面。「好了。」機車真的好了。\n\n阿迪說：「這個機車不舊。這個機車很好。」\n\n星野照相：海、機車，和林薇。","synopsis":"林薇 ferries the friends one at a time on her father's old scooter — no map, every road known — out to the sea.\nWhen the scooter falters she opens it, touches something, and it runs; the mechanic arrives before anyone names her one."},{"id":"B1L08-C3","k":"C3","title_zh":"一百張照片","han":234,"text":"晚上，他們在林薇家的附近玩。附近有很多舊房子和小店。\n\n舊房子、小店、牛肉湯——星野都要照相。\n\n「這個房子是古代的嗎？」星野問。\n\n「不是。」林薇說。「舊，不是古代。」\n\n「這家店一定非常有名！」\n\n「我家旁邊的店。」\n\n「這個湯叫什麼？這麼好吃！」\n\n「牛肉湯。」\n\n星野的照片很多：舊房子、小店、牛肉湯，和一個學校。\n\n「那是你的學校嗎？」星野問。\n\n「是。」林薇說。\n\n星野照相。林薇不照相，林薇看。\n\n星野說：「臺南這麼好玩，你為什麼不在臺南？」\n\n林薇沒說什麼。\n\n「我們去買甜點。」林薇說。「這裡的甜點又便宜又好吃。」\n\n晚上，在林薇的家，星野看手機。手機上有一百張照片。\n\n「你看！」星野跟林薇說。「你的家真美！」\n\n林薇看照片，一張、一張，看得很慢。\n\n「美。」林薇說。\n\n那個「美」，也非常小。","synopsis":"星野 photographs 林薇's neighborhood into her phone — every rapture met with a two-word local correction — until one question (why aren't you here?) gets no answer, only dessert.\nThat night 林薇 goes through all hundred photos slowly; the foil seed planted, feelings undecided and unnamed."}]}},{"id":"B1L09","book":1,"n":9,"title":"Where Will You Go for the Holidays?","theme":"假期","tag":"","topic":"leisure · travel plans · hypotheticals · suggestions","grammar":"的時候 · 有時候…有時候 · 要是…就","cards":[{"k":"RU1","role":"runup","title":"first half — break plans: 放假·回國·打算·旅行·多久·下個星期","note":"","text":"break-plans survey texture — who's going where, 有時候…有時候 waffling; a departures-board mood.","cast":[],"label":null},{"k":"RU2","role":"runup","title":"second half — suggestions: 建議·夜市·應該·逛·茶館·貓空·要是…就","note":"","text":"the stay-here itinerary — 貓空 tea, night markets, 要是天氣好就… (林薇-grade suggestions texture).","cast":["linwei"],"label":"linwei"},{"role":"marquee","title":"\"where's home for the break?\"","note":"","text":"the question goes around the table; 阮草 and 沈文 both discover they can't easily answer it — two different silences, same shape (bittersweet; held light — the full two-hander waits for B2L15).","k":"C1","cast":["shenwen","ruancao"],"label":"ruancao"},{"role":"subplot","title":"the dread flicker","note":"locked chain","text":"星野 dodges with extra brightness — over-answers with three fun facts about 貓空, a flicker too long. The genki is a mask; B1 only shows the seam.","k":"C2","cast":["xingye"],"label":"xingye"},{"k":"HUMOR","role":"humor","title":"","note":"","text":"星野 hyperbole — the three unsolicited fun facts, delivered at 超-volume (the comedy IS the dodge; the ache stays subtext).","cast":["xingye"],"label":"xingye"}],"plants":[{"text":"星野 axis-1 dread (→ B2L14 dread-mirror)","to":["B2L14"]},{"text":"the two-who-can't-go-home pairing (→ B2L15 圍爐)","to":["B2L15"]}],"core_note":"","holes":0,"marquee":"\"where's home for the break?\"","label":"ruancao","in_marquee":["shenwen","ruancao"],"named":["shenwen","ruancao","xingye","linwei"],"third":2,"slot":"climax","title_en":"Where Will You Go for the Holidays?","theme_en":"Leisure","tone_words":["bittersweet"],"tone":-0.5,"status":"packet","packet":{"readings":[{"id":"B1L09-RU1","k":"RU1","title_zh":"你們打算做什麼？","han":248,"text":"下個星期放假，放假一個星期。早上上課的時候，蘇老師問：「放假的時候，你們打算做什麼？」\n\n阿迪說：「我打算回國！」\n\n蘇老師問：「回國多久？」\n\n「大概一個星期。不……大概五天。」阿迪想想。「老師，我有時候想回國，有時候想去臺東旅行。臺東的海很美！」\n\n蘇老師說：「回國很好，旅行也很好。你想想吧。」\n\n一個女同學說：「我不出去。我打算在家看電視、看影片。」\n\n蘇老師問：「功課呢？」\n\n「有時候寫。」\n\n「有時候？」\n\n「……大概有時候。」\n\n蘇老師看看那個女同學。女同學說：「我寫！我寫！」\n\n白龍說：「我不回國，也不出去。」\n\n蘇老師問：「你打算做什麼呢？」\n\n「看。」\n\n「看電視嗎？」\n\n「不是。」\n\n白龍看外面。蘇老師說：「……好。」\n\n下課的時候，蘇老師說：「放假的時候，在家很好，出去也很好。有時候看電視，有時候寫功課，有時候出去玩——都很好。」","synopsis":"Morning class before the one-week break: 蘇老師 surveys everyone's holiday plans and gets 阿迪's waffling (home? Taitung? both?), a classmate's \"approximately sometimes\" homework schedule, and 白龍's complete plan: \"Watching.\" Pure survey texture — no story moved."},{"id":"B1L09-RU2","k":"RU2","title_zh":"林薇的建議","han":212,"text":"下個星期放假！林薇有很多建議，她寫：\n\n「你們放假一個星期。要是你不回國，也不去旅行，就看看我的建議吧！\n\n建議一：去貓空喝茶。\n\n貓空在山上，山上有很多茶館。茶館的茶很特別，非常好喝。要是很熱，就去山上吧，山上比較舒服。你們應該去看看那裡的風景。\n\n建議二：晚上去逛夜市。\n\n夜市有很多小吃，又便宜又好吃。夜市還有很多好玩的東西。要是你想買東西，就去夜市逛逛吧。\n\n建議三：帶朋友一起去。\n\n一個人出去不好玩。你應該帶朋友去——帶他、帶她，都可以！\n\n十一月十號開始放假。你們想想：幾月幾號去貓空？幾月幾號去逛夜市？想想，就決定吧！」","synopsis":"林薇's written stay-in-Taiwan itinerary for anyone not flying home: Maokong tea houses in the hills, night-market crawls, and rule three — always bring a friend. An authentic local-recommendations list; zero story."},{"id":"B1L09-C1","k":"C1","title_zh":"兩杯茶","han":260,"text":"晚上，他們在珍貓喝茶。將軍坐在阿迪的旁邊。\n\n阿迪說：「下個星期放假！放假的時候，我要回國！我媽媽的菜最好吃！湯最好喝！甜點也最好吃！」\n\n林薇問：「你回國多久？」\n\n「大概一個星期。我打算吃一個星期！」\n\n阿迪問阮草：「妳呢？妳打算回國嗎？越南很近！」\n\n阮草看她的茶，沒說什麼。\n\n「我不回國，」她說，「太貴了。」\n\n「可是——」\n\n「下次吧。」她喝茶。\n\n林薇問沈文：「你呢？你家在美國，很遠。」\n\n「是啊，很遠。」沈文也看他的茶。「放假的時候，我在這裡。」\n\n沒有人說什麼。吳老闆帶熱茶來，他沒問什麼。\n\n林薇說：「要是你們都在臺灣，我們就一起玩吧！我帶你們去逛夜市、去貓空的茶館！」\n\n阿迪說：「我不在……」他看看他的功課。「還有，放假的時候，我不想寫功課！」\n\n將軍坐在阿迪的功課上。\n\n「將軍！」\n\n阮草說：「將軍的建議不錯。放假也應該寫功課。」","synopsis":"The break-plans question goes around the café table: 阿迪 plans a week of his mother's cooking, but 阮草 (\"too expensive\") and 沈文 (\"I'll be here\") each answer with the same quiet look into their tea — two silences, one shape, no one explains. 林薇 pivots the table to stay-here plans, and 將軍 delivers his verdict by sitting on 阿迪's homework."},{"id":"B1L09-C2","k":"C2","title_zh":"我們應該去貓空！","han":231,"text":"中午，他們在珍貓吃飯。\n\n林薇說：「放假的時候，我們一起出去玩吧！我有很多建議！」\n\n星野說：「好！好！我們去哪裡？」\n\n林薇問她：「妳不回國嗎？放假一個星期，日本很近。」\n\n星野看她的手機，沒說什麼。她看外面，外面沒有什麼。\n\n沈文看星野。\n\n「我不回國！」星野說，「我們應該去貓空！貓空的茶館非常有名！貓空在山上，風景特別美！在貓空寫功課，寫得特別快！」\n\n她說得非常快。\n\n林薇問：「……寫功課？」\n\n「真的！特別快！」\n\n沈文沒問什麼。\n\n林薇說：「好，我們決定吧。要是你們都有空，我們就去貓空，晚上還可以去逛夜市。」\n\n星野說：「太好了！」她照相。\n\n林薇問：「妳照什麼？」\n\n「都照！」星野說，「貓空的照片、夜市的照片、你們的照片！放假的照片，一定都很好看！」","synopsis":"林薇 asks the natural question — Japan is so close, why isn't 星野 going home? — and gets one beat of silence at a phone, then three unsolicited Maokong fun facts at full volume, including \"homework writes itself faster up there.\" 沈文 notices and asks nothing; the group books Maokong, and 星野's camera is already out."}]}},{"id":"B1L10","book":1,"n":10,"title":"The Fruit in Taiwan Tastes Really Good","theme":"外表","tag":"","topic":"appearance of people & things · colors/tastes · reasons","grammar":"VV看 · reduplication · sentential 了 · 因為…所以","cards":[{"k":"RU1","role":"runup","title":"first half — fruit: 水果·芒果·西瓜·香·甜·黃色紅色·吃吃看","note":"","text":"fruit-stand tasting texture — mango vs watermelon partisanship; 吃吃看 dares.","cast":[],"label":null},{"k":"RU2","role":"runup","title":"second half — describing people: 穿衣服·高矮·藍色·乾淨·男女","note":"","text":"who-wears-what texture — the class described item by item, colors and heights.","cast":[],"label":null},{"role":"marquee","title":"the describe-someone game","note":"","text":"the core four play describe-a-classmate; the clues keep converging on \"that quiet girl who's always watching everyone\" and \"the tall one with the binoculars\" — and the group realizes they don't know either name (金多恩 & 白龍 glimpsed as orbits; the six's missing pieces named by shape).","k":"C1","cast":["jinduoen","bailong"],"label":"jinduoen"},{"role":"subplot","title":"","note":"distance glimpse","text":"a page of 金多恩's sketching seen across the room — she's caught someone in three lines; she notices them noticing and turns the iPad over. (Made-genius alluded; the see-er at range.)","k":"C2","cast":["jinduoen"],"label":"jinduoen"},{"k":"HUMOR","role":"humor","title":"","note":"","text":"小圖 innocent non-sequitur — he plays the game too, misusing known words: 「高！高！」 at the shortest person; flawless confidence, zero accuracy.","cast":["xiaotu"],"label":"xiaotu"}],"plants":[{"text":"the two unnamed orbits (→ L13 they get names and chairs)","to":["B1L13"]},{"text":"金多恩 sees","to":[]},{"text":"the game format (reusable ensemble device)","to":[]}],"core_note":"","holes":0,"marquee":"the describe-someone game","label":"jinduoen","in_marquee":["jinduoen","bailong"],"named":["jinduoen","bailong","xiaotu"],"third":2,"slot":"boundary","title_en":"The Fruit in Taiwan Is Great","theme_en":"Appearance of people/things","tone_words":["funny"],"tone":2.0,"status":"packet","packet":{"readings":[{"id":"B1L10-RU1","k":"RU1","title_zh":"吃吃看！","han":173,"text":"夜市裡有一家賣水果的小店，很有名。黃色的芒果、紅色的西瓜，都香香的。\n\n老闆給星野一塊芒果：「請妳吃吃看！」\n\n星野不吃。她拍照片，一張、兩張、十張。\n\n她的那一塊芒果，阿迪吃了。\n\n「我的芒果呢？」\n\n「對不起，太香了。」\n\n老闆笑了，給星野一塊大的。\n\n星野吃了。她笑得很開心：「太甜了！以前在日本，我沒有機會吃芒果。芒果太貴了！」\n\n老闆說：「我的西瓜也很甜，比芒果甜！」\n\n阿迪說：「不對，芒果最好吃。」\n\n星野說：「都好吃！都最好吃！」\n\n星野很開心，也拍西瓜的照片，一張、兩張、十張。\n\n**⛔ HOLE (2026-07-26):** the closing movement of this run-up stood on a retired 阿迪 frame and is deleted. Nothing goes here until it is generated up from the character as he now is (ADI.md · CAST-PROFILES.md, newest by mtime). Consequences left standing rather than repaired: 吧(guess) and 請(treat) no longer land anywhere in RU1, and han_count falls 219 → 173.","synopsis":"Night-market fruit-stand texture: free tastes, mango-vs-watermelon partisanship, and 星野 photographing everything before eating it — including 阿迪 eating her sample while she shoots it.\nZero story advancement; 星野's no-mango-in-Japan delight carries the comedy."},{"id":"B1L10-RU2","k":"RU2","title_zh":"這些照片","han":243,"text":"上課的時候，蘇老師說：「今天我們看照片，說一說照片裡的人。」\n\n星野的手機裡有很多照片：「老師，看這些！上個月我去花蓮！」\n\n照片裡有一家旅館。旅館很新，窗戶都很乾淨。\n\n星野說：「因為這家旅館又便宜又乾淨，所以我住這裡。從窗戶往外面看，前面就是海！」\n\n蘇老師問：「照片裡的這個男人是誰？」\n\n照片裡的男人很高，穿藍色的衣服。他旁邊的女人穿黃色的衣服。\n\n星野說：「他是旅館的老闆，那是老闆的太太。他們人很好！」\n\n還有一張照片，照片裡有兩個男學生，一個高，一個矮。\n\n阿迪說：「矮的是弟弟吧？」\n\n星野說：「不對！高的是弟弟，矮的是哥哥！」\n\n阿迪說：「真的嗎？」\n\n蘇老師說：「星野的照片真多。」\n\n星野說：「還有三百張！老師，妳要看嗎？」\n\n蘇老師說：「……下次吧。」","synopsis":"Classroom texture: 蘇老師 has the class describe the people in 星野's endless Hualien camera roll — the spotless hotel, the tall owner in blue, his wife in yellow, the tall-younger/short-older brother trap.\nZero story advancement; 星野's three-hundred-more-photos threat and 蘇老師's 「……下次吧。」 close the loop on her L02 camera-roll bit."},{"id":"B1L10-C1","k":"C1","title_zh":"他們叫什麼名字？","han":287,"text":"晚上，沈文、阮草、星野、阿迪坐在珍貓裡面。吳老闆給他們西瓜，紅紅的，甜甜的。將軍坐在沈文的旁邊。\n\n星野說：「我們玩一玩吧！我說一個同學，你們說他的名字！」\n\n「好啊！」\n\n星野說：「這個人最喜歡吃，也常請我們吃！」\n\n阿迪說：「是我！」他們都笑了。\n\n阮草說：「我說一個。一個女同學，她說得很少，每天一個人坐在教室後面，窗戶旁邊，寫東西。」\n\n星野說：「我知道！是那個……那個……」\n\n她不知道名字。阿迪也不知道。\n\n沈文說：「我也說一個。一個男同學，很高很高，常一個人，常看很遠的地方。」\n\n阿迪說：「我知道！是那個很高的……」\n\n沒有人知道他的名字。\n\n小圖也想玩：「高！高！」\n\n他們都看小圖。小圖在說將軍。\n\n阿迪笑了：「將軍？將軍不高！將軍很矮！」\n\n小圖說：「高！」\n\n沈文說：「對不起。」\n\n阮草不笑了。她說：「他們每天都在。我們每天都看他們，可是我們不知道他們的名字。」\n\n西瓜都吃了，他們還在說那兩個同學。","synopsis":"The core four play describe-a-classmate over café watermelon; the clues converge on the quiet girl who's always writing something and the very tall one who's always looking far away — and nobody can produce either name.\n小圖 plays too (「高！高！」 aimed at the cat, delivered with total confidence); 阮草 stops laughing first: they see these two every day and don't know them. Plants the two orbits for the L13 six-close."},{"id":"B1L10-C2","k":"C2","title_zh":"不是字","han":197,"text":"下午，下課了，教室裡人很少。\n\n那個說得很少的女同學還坐在窗戶旁邊，寫東西。她寫的東西比手機大。\n\n沈文和阮草還在教室裡。沈文看了看那個東西：裡面有一個人。那個人在笑，笑得很開心。\n\n阮草問：「她在寫什麼？是字嗎？」\n\n沈文說：「不是字，是人。妳看，那個人在笑……是星野吧？」\n\n阮草看了看，也笑了：「真的是星野！她寫人寫得真好。她也會寫你吧？」\n\n沈文說：「……星野比我好看。」\n\n那個女同學不寫了。她不看他們，她看窗戶外面。\n\n沈文和阮草不說了。\n\n女同學帶她的東西，往教室外面去了。\n\n窗戶外面，星野真的在笑，笑得很開心。","synopsis":"After class, 沈文 catches the quiet girl's screen at range: not characters — a person, laughing, unmistakably 星野; the moment she notices them noticing, she stops, looks out the window, and leaves.\nOutside, 星野 really is laughing — the sketch was true. Plants 金多恩-sees while keeping her unnamed and silent; the group's word for what she does is still, wrongly, 寫."}]}},{"id":"B1L11","book":1,"n":11,"title":"I Would Like to Rent a Place","theme":"租屋","tag":"","topic":"renting · describing rooms · landlord requests","grammar":"來+VP · 就 · existential 有 · 會1/會2","cards":[{"k":"RU1","role":"runup","title":"first half — the rooms: 租·套房·客廳·廚房·浴室·左邊右邊·走路·分鐘","note":"","text":"room-viewing walkthrough texture — a 套房 toured wall by wall; 走路五分鐘就到 redundancy.","cast":[],"label":null},{"k":"RU2","role":"runup","title":"second half — the landlord: 打電話·喂·房租·熱水器·好像·裝·付·不好意思","note":"","text":"landlord phone-call genre piece — the broken water heater, apologies volleyed 不好意思/沒關係.","cast":[],"label":null},{"role":"marquee","title":"the rooftop deal","note":"","text":"白龍 rents the apartment above 珍貓 — negotiation conducted in six sentences total, and 將軍 closes it by sitting on him; 吳老闆 shrugs at the cat's judgment. The stargazing perch, the future clubhouse, the loner now living above the family's room (he doesn't know it yet).","k":"C1","cast":["bailong","wulaoban","jiangjun"],"label":"bailong"},{"role":"subplot","title":"","note":"","text":"星野 flat-hunts a too-good-to-be-true place — is it haunted? she wants it MORE (comic; all-in enthusiasm) — and the viewing reveals 金多恩 lives next door (the orbit acquires an address).","k":"C2","cast":["xingye","jinduoen"],"label":"xingye"},{"k":"HUMOR","role":"humor","title":"白龍 × 吳老闆","note":"","text":"deadpan duel #1: two flat faces agree a rent neither will admit is a kindness; 將軍 outranks both (the printed pairing's first round; the feeds-you/teases-you split already visible on 吳老闆's side).","cast":["bailong","wulaoban","jiangjun"],"label":"wulaoban"}],"plants":[{"text":"the rooftop (→ the signals/astro perch — antennas & long exposures live here)","to":[]},{"text":"金多恩 next door (→ L13 drift-over)","to":["B1L13"]},{"text":"將軍 chose 白龍 first, unexplained (→ B1 grace)","to":[]}],"core_note":"","holes":0,"marquee":"the rooftop deal","label":"bailong","in_marquee":["bailong","wulaoban","jiangjun"],"named":["xingye","jinduoen","bailong","wulaoban","jiangjun"],"third":3,"slot":"","title_en":"I'd Like to Rent a Place","theme_en":"Renting a place","tone_words":["funny"],"tone":2.0,"status":"packet","packet":{"readings":[{"id":"B1L11-RU1","k":"RU1","title_zh":"走路五分鐘就到","han":285,"text":"【租房子】大安附近，一間空套房，很新，很乾淨。走路五分鐘就到捷運站。想看房間，請給房東太太電話。\n\n房東太太：「請進，請進！這就是套房。」\n學生：「真大。」\n房東太太：「是啊。左邊是客廳，右邊是廚房。你看，客廳的窗戶很大，很漂亮吧？」\n學生：「浴室在哪裡？」\n房東太太：「浴室在廚房旁邊。有一點小，可是很乾淨。」\n學生：「這間房間，現在是空的嗎？」\n房東太太：「是空的。你這個週末就能來住。」\n學生：「附近方便嗎？」\n房東太太：「太方便了！走路五分鐘就到超市。」\n學生：「捷運站呢？」\n房東太太：「走路五分鐘就到！」\n學生：「學校呢？」\n房東太太：「走路五分鐘就到！」\n學生：「……超市、捷運站、學校，都是走路五分鐘嗎？」\n房東太太：「我走路比較快。」\n學生：「我回去想一想，再給你電話。」\n房東太太：「好啊。可是這麼好的套房，很多人想租！」\n學生：「……超市，真的走路五分鐘就到嗎？」\n房東太太：「你走路走得快，三分鐘就到！」","synopsis":"A rental ad and the walkthrough behind it: a landlady tours a student through a suite room by room, and everything in the neighborhood is \"five minutes' walk\" away.\nThe student catches on — the punchline is that the landlady just walks fast."},{"id":"B1L11-RU2","k":"RU2","title_zh":"喂，林太太嗎？","han":263,"text":"晚上八點半，學生打電話給房東林太太。\n「喂，請問是林太太嗎？」\n「是的。你是三樓的學生吧？」\n「是。不好意思，晚上八點半還打電話給你。」\n「沒關係，沒關係。有什麼問題嗎？」\n「熱水器好像有問題。今天晚上不熱了。」\n「不好意思！那個熱水器已經很舊了。」\n「沒關係。可以請人來看看嗎？」\n「沒問題。我明天會請人來看。要是太舊了，就裝一個新的。」\n「謝謝林太太！」\n「等一下，對了，這個月的房租——」\n「我已經付了！你收到了嗎？」\n「收到了，收到了。不過，你付了八千五。房租就八千。」\n「……真不好意思！」\n「沒關係，下個月你就付七千五吧。」\n「林太太，有線電視也能看了，謝謝你請人來裝。」\n「你已經習慣這裡了嗎？」\n「已經習慣了。這裡很方便，我很喜歡。」\n「那就好。熱水器的問題，等我電話。」\n「好的，謝謝！真不好意思——」\n「沒關係！」\n「不好意思！」\n「沒關係，沒關係！」","synopsis":"A tenant phones landlady Mrs. Lin about a water heater that has quietly given up; apologies volley back and forth 不好意思/沒關係 until both sides are apologizing at once.\nAlong the way the rent turns out to have been overpaid by five hundred — which the landlady simply credits forward."},{"id":"B1L11-C1","k":"C1","title_zh":"四樓的空套房","han":295,"text":"咖啡店裡人很少。白龍坐在窗戶旁邊，在網路上看房子。將軍坐在他旁邊。\n吳老闆來了，給他一杯熱茶，看看手機：「你在找房子？」\n「嗯。」\n「這棟樓的四樓，有一間空套房。一個月五千。」\n「……太便宜了。」\n「舊房子，沒有有線電視。」\n「沒關係。」\n「熱水器也舊，熱得慢。」\n「沒關係。」\n「那，你要看看嗎？」\n「要。」\n兩個人走到四樓。套房是空的：左邊客廳，右邊小廚房，浴室在後面。窗戶很大，前面是大樓，後面是山。\n白龍走到窗戶旁邊，往外面看。\n「在這裡，可以看得很遠。」\n「嗯。」吳老闆說。\n「我租。」\n「你不想一想嗎？」\n「不想。」\n白龍坐在空客廳裡。將軍也來了，看看他，坐在他的手機上。\n吳老闆看看將軍：「好吧，將軍說可以。」\n「房租六千。」\n「五千。舊房子就是五千。」\n將軍不看他們。\n「……好，五千。」\n「你什麼時候來住？」\n「明天。」\n白龍帶東西來的時候，東西很少：一個碗，兩張照片，一個看得很遠的東西。晚上，他坐在窗戶旁邊，往外面看。樓下，咖啡店的茶很香。","synopsis":"白龍 rents the empty top-floor suite above the cat café in a negotiation of almost no sentences — 吳老闆 talks the place down, 白龍 tries to pay MORE, and 將軍 closes the deal by sitting on the phone with all the other listings.\nHe moves in with one bowl, two photos, and a thing for seeing far; downstairs, the family's room he doesn't know is a family's room yet."},{"id":"B1L11-C2","k":"C2","title_zh":"太便宜的套房","han":292,"text":"星野在網路上找房子。她看到一間套房：大客廳，新廚房，乾淨的浴室，走路兩分鐘就到夜市。房租一個月三千。\n「三千？為什麼這麼便宜？好像太便宜了吧！」\n她打電話給房東：「我今天就去看！」\n下午，房東在套房外面等她。\n「這間套房很好。可是……」\n「可是什麼？」\n「以前住在這裡的人，都很快就回去了。」\n「為什麼？」\n「他們說，晚上好像有人在唱歌。不知道是誰。所以，房租便宜。」\n「太好玩了！我最喜歡特別的地方！」\n「……你不怕嗎？」\n「不怕！要是晚上有人唱歌，我就跟她一起唱！」\n這個時候，一個女學生從旁邊的房間出去。是書法課上那個字寫得最好看的女學生！\n「是妳！妳住在這裡？」\n那個女學生看看他們兩個，說：「晚上唱歌的，是三樓的太太。不好聽。」\n她說了，就去超市了。\n「沒關係！我要租！這裡真的太特別了！」\n「好，好……」\n星野很開心：「字最好看的女學生，就住在我旁邊！」\n房東看看她，說：「你們……都很特別。」","synopsis":"星野 finds a suite too cheap to be true; the landlord confesses that previous tenants fled the mysterious nighttime singing — which only makes her want it more.\nThe girl next door (the flawless calligraphy hand from L07) deflates the ghost in one cold verdict — it's the lady on the third floor, and she sings badly — and the orbit quietly acquires an address."}]}},{"id":"B1L12","book":1,"n":12,"title":"How Long Will You Be Studying Chinese in Taiwan?","theme":"學習","tag":"","topic":"study & future plans · sequences · past experience","grammar":"先…再 · 是…的 · 以後 · 好/難+V","cards":[{"k":"RU1","role":"runup","title":"first half — study plans: 計畫·念大學·需要·花·獎學金·成績·學費·希望","note":"","text":"scholarship-form Q&A texture — 「你計畫念幾年？」; grades and fees counted out loud.","cast":[],"label":null},{"k":"RU2","role":"runup","title":"second half — work/trying: 工作·去年·做生意·好找難找·試試看·加油","note":"","text":"jobs-and-futures chatter — what everyone did 去年, what's 難找; 加油 volleyed around.","cast":[],"label":null},{"role":"marquee","title":"the quake in the library","note":"","text":"studying on a high floor when a small quake (M2–3) sways the building — the newcomers freeze; the locals and the office workers don't look up. First contact with the island's physics (funny/uneasy).","k":"C1","cast":[],"label":null},{"role":"subplot","title":"","note":"orbit glimpse","text":"grades day at the center — the quiet girl doesn't check the posted list: 「不用看了。一百。」 *(line vocab-gated — 不用 formally B1L15; rephrase in-gate or stage behaviorally: she walks past the list; someone reads her score aloud; she was right not to look.)* The made-genius glimpsed, never explained.","k":"C2","cast":[],"label":null},{"role":"breather","title":"","note":"","text":"the how-long-will-you-stay round — everyone names a number except 星野, whose answer is bright and shapeless (one beat, no lantern).","k":"C3","cast":["xingye"],"label":"xingye"},{"k":"HUMOR","role":"humor","title":"","note":"","text":"金多恩 cold-verdict, behavioral — during the quake she doesn't look up either; she's local-calibrated by pure indifference (the verdict lane in object-scale form).","cast":["jinduoen"],"label":"jinduoen"}],"plants":[{"text":"the small quake","to":[]},{"text":"一百 (→ the flat made-genius law; B2+ decode gag)","to":[]},{"text":"stay-length dodge (→ B2L14 visa clock)","to":["B2L14"]}],"core_note":"","holes":0,"marquee":"the quake in the library","label":null,"in_marquee":[],"named":["xingye","jinduoen"],"third":3,"slot":"","title_en":"How Long Will You Study Chinese?","theme_en":"Study, work","tone_words":["funny","uneasy"],"tone":0.5,"status":"packet","packet":{"readings":[{"id":"B1L12-RU1","k":"RU1","title_zh":"先說獎學金，再說成績","han":299,"text":"【獎學金】學校有兩個獎學金，成績好的學生可以來問。\n\n老師：「請坐。你想要獎學金？」\n學生：「是的。老師，念書需要花很多錢。」\n老師：「你是什麼時候到臺灣的？」\n學生：「我是九月到的。」\n老師：「你計畫在這裡念多久？」\n學生：「很久！先念一年中文，以後再念大學。」\n老師：「念大學要四年，需要很多時間。」\n學生：「沒問題，我有時間。」\n老師：「學費也很多，一年大概十萬塊。」\n學生：「所以我需要獎學金啊！」\n老師：「你的成績怎麼樣？」\n學生：「老師，可以先說獎學金，再說成績嗎？」\n老師笑了：「不行。成績呢？」\n學生：「……八十五。」\n老師：「不錯。現在誰替你付學費？」\n學生：「我爸爸替我付。可是我希望以後自己付。」\n老師：「你以後想做什麼？」\n學生：「我想到大公司上班，替爸爸媽媽買房子。」\n老師：「好。」她開始寫字。「下個星期，學校會給你電話。」\n學生：「謝謝老師！」\n他出去的時候，問：「老師，請問獎學金是多少錢？」\n老師：「一年五萬塊。」\n學生：「太好了！我念十年也沒問題！」","synopsis":"A scholarship interview at the school: the teacher walks a student through the form's questions — how long, how many years, whose money, what future — and the student tries to negotiate the order (\"scholarship first, grades second\").\nThe punchline: he only asks how much the scholarship IS on his way out — and instantly upgrades his study plan to ten years."},{"id":"B1L12-RU2","k":"RU2","title_zh":"難找也要找","han":297,"text":"下午四點，語言中心的課結束了。三個同學在樓下喝茶。\n\n男同學：「好累！在語言中心念書，比在我們國家難。」\n女同學：「你去年做什麼？」\n男同學：「我去年在銀行工作。」\n女同學：「那你為什麼學中文？」\n男同學：「因為我想做生意。會說中文，做生意比較方便。」\n林同學：「我爸爸就是做生意的。他常說，現在生意難做。」\n女同學：「工作也難找。我姐姐去年開始找工作，現在還在找。」\n男同學：「你們國家，工作這麼難找嗎？」\n女同學：「是啊。可是我姐姐說，難找也要找。」\n男同學：「我們國家也是這樣。」\n林同學：「會說中文的人，工作比較好找。」\n女同學：「所以我來語言中心念書啊！以後，我的工作就好找了。」\n林同學：「做生意難，找工作也難。可是可以試試看！先試試看，要是不行，那麼再試！」\n男同學：「說得對！……可是我現在好累。」\n女同學：「加油！」\n男同學：「妳也累。」\n女同學：「我們都累，我們都加油吧！」\n林同學：「加油，加油！明天還有課！」","synopsis":"After-class tea at the language center: three classmates trade what they did last year and why they came — business is hard to do, jobs are hard to find, and Chinese supposedly makes both easier.\nEveryone is exhausted; everyone tells everyone else 加油 anyway."},{"id":"B1L12-C1","k":"C1","title_zh":"大樓在走路","han":296,"text":"晚上七點，沈文、星野和林薇在圖書館九樓做功課。從大窗戶能看到外面的大樓和山。\n\n星野：「我念書念得好累……」\n林薇：「先做功課。」\n七點半，星野的茶開始走路——從左邊到右邊，再從右邊到左邊。\n星野：「……我的茶在走路！」\n沈文不寫字了。窗戶外面的大樓，好像也在走路。\n星野：「林薇！大樓在走路！為什麼？！」\n林薇還在寫功課，說：「小的。」\n在圖書館上班的人，都還在看書、看手機。\n沈文說：「這裡是九樓……」\n星野：「我們快出去吧！」\n林薇：「等一下。」\n七點三十一分，茶不走路了，大樓也不走路了。\n星野：「……結束了？」\n林薇：「結束了。」\n旁邊，那個字寫得最好看的女生還在寫字，沒有看窗戶，也沒有看他們。\n星野問她：「妳不怕嗎？」\n女生：「很小。常有。」\n星野：「常有？！」\n林薇：「臺灣就是這樣。習慣就好。」\n沈文看看自己的茶：「在美國，大樓不走路。」\n林薇：「在臺灣，大樓走路，人不走。」\n星野已經開心了：「我要照相！會走路的大樓！」\n林薇：「……先做功課。」","synopsis":"Homework night on the library's ninth floor when a small quake sways the building — 星野's tea \"walks\" left to right, the newcomers freeze, and the locals (林薇, the staff, and the quiet girl at the next table) never look up.\nOne minute later it's over; 林薇's verdict is 臺灣就是這樣, and 星野 is already trying to photograph the building that walks."},{"id":"B1L12-C2","k":"C2","title_zh":"不看了。一百。","han":279,"text":"星期五早上，語言中心樓下人很多——這個月的成績，就在樓下的大窗戶上。學生都想看自己的成績。\n\n阿迪：「八十！上個月七十，這個月八十！不錯不錯！」\n星野：「我七十五……為什麼？我每天都做功課！」\n阿迪：「妳每天也都去夜市。」\n星野：「夜市也是學校！我在夜市學中文！」\n這個時候，那個字寫得最好看的女生來了。她不看窗戶上的成績，就往教室去。\n星野：「妳不看成績嗎？」\n女生：「不看了。一百。」\n她就去教室了。\n阿迪在窗戶上找「一百」。真的有一個一百——就一個。\n阿迪：「……真的是一百。」\n星野：「她為什麼不看？」\n阿迪：「不知道。可是她說一百，就是一百。」\n星野：「聽說成績最好的學生，有獎學金，不付學費……」\n阿迪：「所以，獎學金是她的了。」\n星野看看自己的七十五：「下個月，我也要一百！我要請她教我！」\n阿迪已經在看手機了：「加油。」\n星野：「你說『加油』的時候，為什麼不看我？」","synopsis":"Grades day at the language center: 阿迪 is cheerfully pleased with his own seventy-to-eighty, 星野 defends her night-market study method — and the quiet girl walks past the posted list without looking: 「不看了。一百。」 She was right not to look; there is exactly one 100 on the sheet.\nThe scholarship math dawns on everyone except her; 阿迪's 加油 is delivered while already back on his phone."},{"id":"B1L12-C3","k":"C3","title_zh":"你打算念多久？","han":276,"text":"週末晚上，咖啡店裡人不多。四個同學坐在窗戶旁邊喝茶。\n\n林薇：「你們都是九月到的吧？到臺灣已經三個多月了。」\n沈文：「對，我是九月到的。」\n林薇：「那你們打算在臺灣念多久？」\n阮草：「兩年。我的獎學金是兩年，我就念兩年。」\n沈文：「兩年以後呢？」\n阮草：「回國，替我媽媽做生意。我們家有一個小店。」\n林薇：「沈文呢？你計畫念多久？」\n沈文：「先念一年，以後的……以後再想。」\n林薇：「星野呢？妳打算念多久？」\n星野：「我？我要念很久很久！你們看，臺灣這麼好玩，夜市這麼好吃，貓空的茶這麼好喝——我為什麼要回國？」\n林薇：「所以，是幾年？」\n星野：「幾年？誰知道！很久就是很久！」\n老闆來了，給他們一個甜點，就回去了。\n星野：「老闆最好！我要在臺灣念十年！」\n林薇：「你剛說『很久』，現在是十年？」\n星野：「有甜點，就是十年！」\n阮草喝她的茶。沈文看看星野，也喝他的茶。\n林薇：「好，很久。」","synopsis":"Weekend tea at the café: the how-long-will-you-stay question goes around — 阮草 answers in exact scholarship-years, 沈文 in an easygoing \"one year, then we'll see,\" and 星野 in numbers that change with the dessert.\nEveryone names a figure except her; nobody points it out, and the round closes on 「好，很久。」"}]}},{"id":"B1L13","book":1,"n":13,"title":"Happy Birthday","theme":"社交","tag":"","topic":"social life · phone invitations · dietary preferences · well-wishing","grammar":"一…就 · verbal 了 · 不/沒 · 跟…一樣","cards":[{"k":"RU1","role":"runup","title":"first half — the invitation: 生日·回來·記得·忘了·當然·我就是·好久不見·門口","note":"","text":"the surprise-party phone chain — who calls whom, who forgot, 「我就是！」 comedy of errors.","cast":[],"label":null},{"k":"RU2","role":"runup","title":"second half — the party/customs: 禮物·訂·蛋糕·豬腳·麵線·傳統·祝·萬事如意","note":"","text":"豬腳麵線 vs cake — the birthday-custom explainer, 林薇/吳老闆 lane; blessing-phrase texture.","cast":["linwei","wulaoban"],"label":"linwei"},{"role":"marquee","title":"THE SIX CLOSE","note":"book-level 🔒","text":"a café birthday. 沈文 crosses the room and sits down with 白龍 & 將軍; 金多恩 drifts over from the next table; the party absorbs them both without a vote. And 阮草 slides the best piece onto 沈文's plate — she's chosen him; the reader who met her mother's fish at L05 knows exactly what it means. **The group becomes six.**","k":"C1","cast":["shenwen","ruancao","jinduoen","bailong","jiangjun"],"label":"shenwen"},{"role":"breather","title":"","note":"","text":"the party itself — 豬腳麵線 meets birthday cake; 蘇老師's intake card comes full circle as 白龍 finally says his own too-grand name out loud.","k":"C2","cast":["bailong","sulaoshi"],"label":"sulaoshi"},{"k":"HUMOR","role":"humor","title":"白龍 × room","note":"","text":"«白龍», White Dragon, announced in the deepest voice in the building, attached to a man holding a bubble tea; 將軍's unimpressed reaction shot beside him (the name comedy lands where the name-holder does).","cast":["bailong","jiangjun"],"label":"bailong"}],"plants":[{"text":"the six (→ everything)","to":[]},{"text":"阮草's adoption (→ B2 peak bond)","to":[]},{"text":"白龍 let in as grace, not effort","to":[]}],"core_note":"congested — 2 cores; quiet around the marquee","holes":0,"marquee":"THE SIX CLOSE","label":"shenwen","in_marquee":["shenwen","ruancao","jinduoen","bailong","jiangjun"],"named":["shenwen","ruancao","jinduoen","bailong","linwei","sulaoshi","wulaoban","jiangjun"],"third":3,"slot":"","title_en":"Happy Birthday","theme_en":"Social life","tone_words":["warm"],"tone":1.5,"status":"packet","packet":{"readings":[{"id":"B1L13-RU1","k":"RU1","title_zh":"我就是！","han":299,"text":"星期一晚上，星野打電話給林薇。\n\n「喂，請問是林薇嗎？」\n\n「我就是。」\n\n「我是星野！好久不見！妳回來了嗎？」\n\n「我是昨天回來的。」\n\n「太好了！下個星期六是沈文的生日，我們給他過生日！六點左右，咖啡店門口，好嗎？」\n\n「當然去！可是那天下午我有語言交換，從四點到六點。」\n\n「語言交換？」\n\n「我的朋友是西班牙人。我教他中文，他教我西班牙文。他跟妳一樣熱心！」\n\n「那麼，妳六點半來吧！」\n\n「沒問題！」\n\n星野也打電話給阿迪。\n\n「阿迪，下個星期六是誰的生日，你記得嗎？」\n\n「……當然記得！」\n\n「是誰的？」\n\n「……我忘了。」\n\n「你怎麼忘了！是沈文的！」\n\n「啊！對！妳一說我就記得了！」\n\n「六點左右，咖啡店門口。他一到門口，我們就說：『生日快樂！』」\n\n「好！不能跟沈文說！」\n\n星野再打一個電話。\n\n「喂！星期六沈文的生日！六點左右，咖啡店門口！他一到門口，我們就說『生日快樂』！」\n\n電話裡的人說：「……我就是沈文。」\n\n「……」\n\n「星野，我就是沈文。」\n\n「你！你什麼都不知道！」\n\n「好，我什麼都不知道。星期六見。」","synopsis":"The surprise-party phone chain: 星野 books 林薇 (back from Tainan, language-exchange clash), catches 阿迪 having forgotten the date entirely — and then misdials the last call straight to the birthday boy himself, briefing 沈文 on his own surprise party.\nZero story advancement; pure phone-genre texture — 「我就是」 lands once straight and once as catastrophe, and 沈文's dry 「好，我什麼都不知道」 closes the error."},{"id":"B1L13-RU2","k":"RU2","title_zh":"豬腳麵線","han":299,"text":"星期四，阮草和林薇來咖啡店。\n\n阮草說：「老闆，星期六我們給沈文過生日，我想訂一個大蛋糕。」\n\n吳老闆說：「好。蛋糕上要寫什麼？」\n\n「寫『祝沈文生日快樂』。」\n\n「好，我寫了：大蛋糕。」\n\n林薇說：「蛋糕是年輕人的。臺灣人過生日，傳統是吃豬腳麵線和紅色的蛋。」\n\n阮草問：「豬腳麵線？是不是很好吃？」\n\n「當然！吃了豬腳麵線，一年都萬事如意。」\n\n「今年沈文在臺灣過生日。蛋糕、麵線，我們都要！」\n\n林薇笑了：「大部分的年輕人吃蛋糕，不吃麵線。」\n\n吳老闆說：「麵線我來做。要多做一點嗎？」\n\n阮草說：「多做一點！我們人很多。」\n\n「好。麵線和蛋，是我給沈文的。」\n\n「一共多少錢？」\n\n「蛋糕的錢。」\n\n「老闆，你太客氣了！」\n\n「哪裡，哪裡。」\n\n林薇說：「我們要對沈文說：『祝你萬事如意！心想事成！』」\n\n阮草說：「萬事如意……越南人也說這個！我一聽就知道了。」\n\n她想了想，說：「我已經買了禮物。」\n\n吳老闆看了看他寫的：「蛋糕、麵線、紅色的蛋。星期六見。」\n\n阮草說：「謝謝老闆！」\n\n「不必客氣。」","synopsis":"Birthday-custom texture at the café: 阮草 orders the cake, 林薇 explains 豬腳麵線-and-red-egg tradition versus the young-person cake, and the blessing phrases get rehearsed — 阮草 discovers 萬事如意 exists in Vietnamese too.\nZero story advancement; 吳老闆's gruff kindness (the noodles are on him) volleys all three politeness phrases, and his read-back order slip closes the scene."},{"id":"B1L13-C1","k":"C1","title_zh":"一起坐","han":295,"text":"星期六晚上六點左右，咖啡店裡人很多。星野他們給沈文過生日。\n\n沈文一到門口，他們就說：「祝你生日快樂！」\n\n星野拍照片，一張、兩張、十張。阿迪唱歌。林薇給每個人熱茶。\n\n很高的那個同學一個人坐在裡面，喝一大杯甜甜的茶。將軍在他的旁邊，誰都不看。\n\n沈文看了看他，帶自己的碗到那裡去了。\n\n「今天我過生日。一起吃，好不好？」\n\n高同學看了看沈文，也看了看將軍。\n\n將軍沒說什麼。\n\n「……好。」\n\n沈文坐在他的旁邊。\n\n星野先去，阿迪也去，林薇和阮草也都去了。誰都沒問為什麼。\n\n旁邊的那個女同學也帶她的茶來了，坐在星野的旁邊。誰都沒問，星野給她一塊蛋糕。\n\n阮草的碗裡有豬腳麵線。最好的那一塊豬腳，她給了沈文。\n\n「吃啊。」她說。\n\n沈文看了看她，吃了。\n\n麵線很香，茶很熱，他們說了很多，笑了很多。\n\n吳老闆給高同學一杯新的熱茶。\n\n「謝謝。」\n\n「不必客氣。」\n\n將軍看了看他們，就不看了。","synopsis":"The marquee: at his own birthday party 沈文 carries his bowl across the café and sits down with the tall loner and 將軍; the group follows one by one, the next-table girl drifts over with her tea, and nobody asks why — the party absorbs them both without a vote. **The group becomes six.**\n阮草 slides the best piece of 豬腳 onto 沈文's plate — the reader who met her mother's fish at L05 knows she has chosen him; 將軍's dismissive final glance is the humor beat."},{"id":"B1L13-C2","k":"C2","title_zh":"白龍","han":299,"text":"蘇老師也來了。她給沈文一個小禮物。\n\n林薇說：「先吃豬腳麵線，再吃蛋糕——這是傳統！」\n\n沈文吃了麵線，吃了紅色的蛋，也吃了一大塊蛋糕。他什麼都吃了。\n\n他們都對他說：「祝你萬事如意！」「心想事成！」\n\n蘇老師看了看那個很高的同學，笑了：「他們都還不知道你的名字吧？你來說。」\n\n高同學喝了一點茶。\n\n「白龍。」\n\n「白龍」兩個字那麼大，他的那杯甜茶那麼小。\n\n他們都不說了。星野拍了一張照片。\n\n坐在旁邊的女同學看了看白龍，說：「名字比人大。」\n\n他們都笑了。白龍沒笑。\n\n「對。」他說。\n\n將軍沒看白龍。將軍在看蛋糕。\n\n林薇問那個女同學：「妳呢？妳叫什麼名字？」\n\n女同學沒說。她在那個比手機大的東西上寫了三個字。\n\n林薇看了看：「金多恩。妳寫的字真好看！」\n\n金多恩喝她的茶，沒說什麼。\n\n蛋糕都沒有了，麵線也都沒有了。將軍在白龍的旁邊。\n\n十點左右，他們在咖啡店門口說：「再見！」\n\n白龍說：「明天見。」\n\n是他先說的。","synopsis":"The breather: 豬腳麵線 meets birthday cake (tradition first, 林薇's law), the blessing phrases fly — and the intake-card name comes full circle: prompted by 蘇老師, 白龍 finally says his own too-grand name out loud, two characters too big for a man holding a large sweet tea.\n金多恩's verdict (「名字比人大」) doubles as her own naming beat — she writes her three characters instead of saying them; 白龍's parting 「明天見」, said first, is the loner's first transmission."}]}},{"id":"B1L14","book":1,"n":14,"title":"It's So Cold!","theme":"天氣","tag":"","topic":"weather · typhoons · seasons · comparing events","grammar":"V了+duration · double 了 · 快…了 · 更 · 沒有…","cards":[{"k":"RU1","role":"runup","title":"first half — cold/seasons: 天氣冷·風·冬天·春天·紅葉·下雪·玉山·紐約","note":"","text":"first-cold-snap whining — everyone compares winters back home; Taiwan's damp cold wins ugly.","cast":[],"label":null},{"k":"RU2","role":"runup","title":"second half — rain/typhoon: 雨·傘·颱風·濕·新聞·小心·可怕·停","note":"","text":"TV-news-and-umbrella texture — typhoon vocabulary in its native genre; 大家小心 density.","cast":[],"label":null},{"role":"marquee","title":"the winter huddle","note":"","text":"the newcomers' first Taiwan winter, colder and damper than \"tropical\" promised; a cozy café lock-in where 林薇 & 吳老闆 warn them what summer really brings — **typhoon season** (alluded, no storm) — and 吳老闆, one tired gesture at the room: a place like this doesn't run forever. Waved off, forgotten by everyone but the reader.","k":"C1","cast":["linwei","wulaoban"],"label":"wulaoban"},{"role":"breather","title":"ORACLE #1","note":"","text":"白龍, flat, to nobody: 「四點，雨停。」 Nobody heeds. At four the rain stops. He says nothing. (Fully in-gate: 點 L07 · 雨/停 L14.)","k":"C2","cast":["bailong"],"label":"bailong"},{"k":"HUMOR","role":"humor","title":"白龍 × room","note":"","text":"the oracle cycle, inaugural run (forecast → ignored → correct → silence). The gag is the Ghost in minor key; play it purely funny here.","cast":["bailong"],"label":"bailong"}],"plants":[{"text":"café-clock seed 🔒-binding","to":[]},{"text":"typhoon warning","to":[]},{"text":"oracle gag (→ five books)","to":[]},{"text":"first-light/hours texture (→ 吳老闆 arc)","to":[]}],"core_note":"","holes":0,"marquee":"the winter huddle","label":"wulaoban","in_marquee":["linwei","wulaoban"],"named":["bailong","linwei","wulaoban"],"third":3,"slot":"climax","title_en":"It's So Cold!","theme_en":"Weather","tone_words":["warm"],"tone":1.5,"status":"packet","packet":{"readings":[{"id":"B1L14-RU1","k":"RU1","title_zh":"好冷！","han":291,"text":"十二月底，早上八點。教室裡很冷，外面風很大。\n\n阿迪穿了很多衣服，可是他還說：「好冷！好冷！臺灣的冬天怎麼這麼冷？」\n\n星野笑了：「你穿這麼多衣服，還冷嗎？」\n\n「我家沒有冬天，每天都很熱！」\n\n林薇說：「今天天氣真的不好。」\n\n星野說：「日本的冬天比臺灣冷，常下雪，可是我覺得臺灣比較冷！」\n\n林薇笑了：「每個人都這麼說。」\n\n「我們家冬天去滑雪，秋天看紅葉，紅葉真美！」星野說，「明年秋天，你們跟我一起去日本吧！」\n\n阿迪說：「我想看雪！我只在電視上看雪。臺灣下雪嗎？」\n\n林薇說：「臺灣不常下雪，只有玉山有時候下雪。想看很多雪，去美國紐約吧！聽說那裡冬天雪非常多。」\n\n阮草說：「快新年了……我很想我的父母。」\n\n林薇問：「妳新年回越南嗎？」\n\n「今年不回去，太貴了。明年新年，我一定回去。」\n\n星野說：「那麼，今年我們一起過新年！」\n\n阿迪問：「春天什麼時候來？」\n\n林薇想了想：「三月吧。」\n\n「還有三個月……太久了！」","synopsis":"First cold snap at the language center: 阿迪 (no winter at home) suffers loudest in all his clothes at once, 星野 concedes Japan is colder on paper yet Taiwan *feels* colder — 林薇's knowing 「每個人都這麼說」 is the local's verdict — and snow talk runs from 玉山's rare dusting to New York's plenty.\nZero story advancement; 阮草 misses her parents with New Year coming and won't fly home this year (too expensive — her standing count-every-dollar trait, texture only), so 星野 declares a together-New-Year on the spot."},{"id":"B1L14-RU2","k":"RU2","title_zh":"請大家小心","han":297,"text":"星期五晚上，外面下大雨。咖啡店裡人不多，電視在說新聞。\n\n新聞說：「今天晚上雨很大，明天還要下雨，請大家小心。」\n\n阿迪來了。他沒帶傘，衣服都濕了。\n\n「討厭！」\n\n吳老闆給他一杯熱茶：「怎麼不帶傘？」\n\n「早上沒下雨啊！」\n\n星野說：「我帶了傘，可是我的傘太小，我也濕了。」\n\n吳老闆說：「雨下了三天了。十二月的雨不大，可是每天都下。」\n\n阿迪問：「臺灣的雨都這麼多嗎？」\n\n「這不多。」吳老闆說，「夏天颱風來的時候，雨更大，風也更大。」\n\n「颱風可怕嗎？」\n\n「上次的颱風很可怕，很多商店三天不能做生意。這次的雨，沒有颱風那麼可怕。」\n\n星野說：「我聽說，颱風一來就不上課！」\n\n林薇說：「對，可是不能出去玩，大家都在家裡看電視。」\n\n阿迪問：「雨什麼時候停？」\n\n吳老闆說：「新聞說，後天停。」\n\n十點了，他們要回去，外面還在下雨。\n\n吳老闆說：「店裡有傘，你們帶回去吧。」\n\n「謝謝老闆！」\n\n「慢走！小心！」\n\n將軍到門口看了看外面的雨，就回店裡去了。","synopsis":"Rainy-night café with the TV news running: 阿迪 arrives umbrella-less and soaked (星野's umbrella was too small to matter), and 吳老闆 counts the rain — three days now — then gives the typhoon primer in its native genre: last time's storm vs this rain, summer wind vs winter drizzle, shops shut for days.\nZero story advancement; the typhoon-day-off culture bit lands (「颱風一來就不上課！」— 「可是不能出去玩」), the house umbrellas go out the door with 「慢走！小心！」, and 將軍 inspects the rain and declines it."},{"id":"B1L14-C1","k":"C1","title_zh":"冬天的晚上","han":297,"text":"冬天的晚上，外面下雨，又濕又冷。咖啡店裡很熱。\n\n他們都在：沈文和阮草在看書，白龍喝他的大杯甜茶，金多恩在寫字。\n\n星野問：「老闆，店裡哪裡最熱？」\n\n吳老闆看了看將軍：「將軍在的地方。」\n\n阿迪說：「十二月太冷了……我想夏天！」\n\n林薇說：「夏天有颱風。明年夏天，你們就知道了。」\n\n吳老闆說：「冬天沒有夏天的颱風可怕。颱風一來，風大雨大，大家都不能出去。」\n\n星野問：「老闆，你每天幾點來店裡？」\n\n「早上五點。」\n\n「幾點回家？」\n\n「晚上十一點。」\n\n「老闆，你不累嗎？」\n\n吳老闆看了看他的店。\n\n「我在這裡做了二十年的生意了。二十年了……以後這個店在不在，誰知道呢？」\n\n星野說：「老闆！明年我們還要來！明年的明年也要來！」\n\n他們都笑了，吳老闆也笑了，沒有再說什麼。\n\n金多恩沒有笑。她看了看吳老闆，沒說什麼。\n\n快十一點了，雨小了，他們回去了。\n\n吳老闆在門口說：「慢走。」\n\n他一個人回店裡去了。明天早上五點，他還要來。","synopsis":"The marquee: the newcomers' first Taiwan winter drives the six into a cozy café lock-in, where 林薇 and 吳老闆 warn them what summer really brings — typhoon season, alluded, no storm — and 星野's innocent hours question uncovers the café's whole day (five a.m. to eleven p.m., twenty years of it).\nThen the seed, one tired look at the room: 「以後這個店在不在，誰知道呢？」 — waved off with laughter and 星野's 「明年的明年也要來！」, forgotten by everyone but the reader; only 金多恩 doesn't laugh."},{"id":"B1L14-C2","k":"C2","title_zh":"四點，雨停","han":254,"text":"星期六下午，雨下了兩天了。早上雨很大，下午雨更大。\n\n他們在咖啡店裡等雨停。晚上大家想去逛夜市，可是外面的雨還很大。\n\n星野看了看窗戶：「討厭！要是晚上還下雨，我們就不能去夜市了！」\n\n阿迪在看手機：「新聞說，今天的雨不會停。」\n\n白龍在窗戶旁邊。他看外面，看了很久。\n\n「四點，雨停。」他說。\n\n沒有人聽。星野在說夜市的小吃，阿迪在看手機，林薇在喝茶。\n\n三點半，雨還很大。\n\n快四點的時候，雨小了。\n\n四點，雨停了。\n\n他們都看窗戶。\n\n「停了！」星野說，「真的停了！」\n\n林薇問白龍：「新聞說今天不會停……你是怎麼知道的？」\n\n白龍喝他的茶。\n\n「嗯。」\n\n他沒有再說什麼。\n\n「走吧！」阿迪說，「去夜市！」\n\n大家都出去了。外面沒有雨了，風也小了。\n\n吳老闆在門口說：「慢走。」將軍沒有出去。\n\n白龍走在後面，沒說什麼。","synopsis":"The breather — ORACLE #1: two days of rain hold the night market hostage; the TV news says it won't stop today; 白龍, who has been watching the window a long time, states flatly to nobody: 「四點，雨停。」 Nobody heeds — snacks are discussed, phones are watched.\nAt four the rain stops. Asked how he knew — against the news, no less — he drinks his tea: 「嗯。」 The inaugural run of the oracle cycle (forecast → ignored → correct → silence), played purely funny; he leaves at the back of the group, saying nothing."}]}},{"id":"B1L15","book":1,"n":15,"title":"I Don't Feel Well","theme":"生病","tag":"","topic":"falling sick · symptoms · suggestions · accepting/rejecting care","grammar":"把 · V了…就 · 一點 · question-words non-committal · degree complements","cards":[{"k":"RU1","role":"runup","title":"first half — symptoms/clinic: 醫生·感冒·發燒·喉嚨發炎·頭痛·藥·休息","note":"","text":"health-center visit texture — the doctor's question battery; symptom vocabulary in its native room.","cast":[],"label":null},{"k":"RU2","role":"runup","title":"second half — care/recovery: 陪·看病·關心·別吃冰的·多喝水·好多了·回家","note":"","text":"the nurse-a-friend playbook — what you bring, what you forbid, how long you stay; 關心 density.","cast":[],"label":null},{"role":"subplot","title":"","note":"warm, first","text":"someone catches the winter's cold; the six nurse them in shifts — 沈文 simply *there* (presence-love, tender), 阿迪 arrives with congee and jokes the fever down, 阮草 issues care as commands. The family working exactly as built.","k":"C1","cast":["shenwen","ruancao","adi"],"label":"shenwen"},{"role":"marquee","title":"THE SCAM CALL","note":"🔒 closes Book 1","text":"a call from Hanoi lands mid-warmth. 阮草's face falls; she steps out; she comes back with the warmth switched off and says nothing is wrong. The family shop — lost overnight. The reader sees only the face and the silence; B2 will explain. *(Staging open call: one-sided call on-page vs aftermath-only.)*","k":"C2","cast":["ruancao"],"label":"ruancao"},{"k":"HUMOR","role":"humor","title":"阿迪 × the sick-room","note":"","text":"defuse-by-food (the congee logistics operation), placed BEFORE the call so the cut lands clean; after the call, nobody's funny.","cast":["adi"],"label":"adi"}],"plants":[{"text":"THE SHIFT (→ B2L04 secret jobs, B2L13 scam-fear echo)","to":["B2L04","B2L13"]},{"text":"the nursing pattern (→ who carries whom, the book's thesis in miniature)","to":[]}],"core_note":"2 cores — the shadow needs a clean edge","holes":0,"marquee":"THE SCAM CALL","label":"ruancao","in_marquee":["ruancao"],"named":["shenwen","ruancao","adi"],"third":3,"slot":"boundary","title_en":"I Don't Feel Well","theme_en":"Falling sick","tone_words":["warm","shadow"],"tone":0.25,"status":"packet","packet":{"readings":[{"id":"B1L15-RU1","k":"RU1","title_zh":"醫生的問題","han":299,"text":"冬天，生病的人很多。星期一早上，看醫生的地方有很多學生。\n\n醫生問：「你哪裡不舒服？」\n\n「我感冒了。頭很痛，還一直流鼻水。」\n\n「喉嚨呢？」醫生看了看他的喉嚨，「發炎了。發燒了嗎？」\n\n「早上發燒，現在沒有了。」\n\n「胃口怎麼樣？」\n\n「很差，不想吃東西。」\n\n「肚子痛不痛？吐了嗎？」\n\n「不痛，也沒吐。」\n\n「你感冒了。到旁邊的藥局拿藥，回去把藥吃了，多喝水，早一點睡覺。」\n\n「謝謝醫生。」\n\n他後面的女學生來了。\n\n「你也感冒了嗎？」\n\n「是。」\n\n「也一直流鼻水？」\n\n「是。」\n\n「頭也痛嗎？」\n\n「痛。」\n\n「喉嚨也發炎了？」\n\n「醫生，你怎麼知道？」\n\n醫生笑了：「今天你們都一樣。藥局拿藥，把藥吃了，多喝水，早一點睡覺。」\n\n一個臉色很難看的學生來了。\n\n「你的臉色真難看。哪裡不舒服？」\n\n「肚子很痛，吐了。」\n\n「吐了幾次？」\n\n「三次。」\n\n「你不是感冒，是吃了不乾淨的東西。今天不要吃東西，多喝水。」\n\n「藥呢？」\n\n「這個藥，一天吃三次。吃了藥就休息。」\n\n中午了。醫生喝茶的時候說：「冬天，大家都感冒了……」\n\n他也一直流鼻水。","synopsis":"Winter cold season at the doctor's: the question battery runs three student patients in a row — the full-symptom textbook case, the identical follow-up the doctor can pre-fill himself, and the food-poisoning outlier with the terrible 臉色.\nZero story advancement; pure clinic-genre redundancy — the doctor's closing self-diagnosis (he's sniffling too) is the button."},{"id":"B1L15-RU2","k":"RU2","title_zh":"別吃冰的","han":298,"text":"星期三下午，咖啡店裡的人不多。\n\n阿迪說：「很多同學都感冒了，上課的人真少。」\n\n林薇問：「朋友生病的時候，要做什麼，你們知道嗎？」\n\n星野說：「知道！買好吃的給他！」\n\n「不是。你要先問他：『怎麼了？』——先關心他。」\n\n「問了以後呢？」\n\n「他會說：『不用了，我很好。』生病的人都這樣說。別聽。」\n\n林薇說：「最好陪他去看病。學校裡就有健康中心。你們都有健康保險，看病很便宜。醫生會給他幾包藥。」\n\n阿迪問：「吃的呢？生病的人能吃什麼？」\n\n「熱湯最好。別給他油的，也別給他冰的。感冒的人別喝冰的！」\n\n星野看了看自己的冰咖啡：「冬天喝冰的也不好嗎？」\n\n「不好！」\n\n林薇說：「還有，跟他說：多喝水，早一點睡覺，一天最好睡八個小時。要是還發燒，就別去上課，最好回家休息。」\n\n吳老闆說：「還有一個。」\n\n大家都看他。\n\n「常去看他。生病的人一個人在房間裡，最不舒服。」\n\n林薇笑了：「對。這就是關心。」\n\n星野把冰咖啡給了吳老闆：「請給我一杯熱茶！」","synopsis":"The nurse-a-friend playbook, delivered at the café: 林薇 runs the full curriculum — ask 怎麼了 first, never believe 「不用了，我很好」, escort them to the health center (insurance makes it cheap), hot soup only, nothing oily, nothing iced — and 吳老闆 adds the one rule that matters: keep showing up.\nZero story advancement; 星野's winter iced coffee gets confiscated by her own conscience as the button."},{"id":"B1L15-C1","k":"C1","title_zh":"熱湯","han":294,"text":"星期五早上，星野生病了：感冒、發燒，喉嚨也發炎了。她的臉色很難看，可是她說：「我很好！」\n\n沒有人聽她的。\n\n早上，阮草先來。她給星野一杯熱水：「先把水喝了。」\n\n「不用了！我真的很好！明天我們不是要去夜市——」\n\n「不去了。喝了就睡覺。」\n\n星野把水喝了，就睡了。\n\n下午，林薇陪她去健康中心看病，醫生給了她幾包藥。\n\n晚上，大家都來了。白龍沒說什麼，他帶了很多水。\n\n阿迪帶了一個大碗：「我自己做的熱湯！你吃吃看。吃了我的湯，感冒就怕你了！」\n\n「我胃口很差，不想——」\n\n星野吃了一碗，還想吃。\n\n阿迪笑了：「胃口很差的人，吃三碗？我的湯比藥好，明天你就不發燒了！」\n\n沈文坐在旁邊看書，沒說什麼。星野睡覺的時候，他就在那裡。\n\n九點，星野睡覺以前說：「今天……謝謝大家。」\n\n阮草說：「別說了。睡覺。」\n\n這個時候，小圖說：「大家都在！大家都在！」\n\n「小圖，對不起。」沈文說。\n\n可是星野笑了：「沒關係。」\n\n她睡了。她睡得很好。","synopsis":"The winter's cold finally lands on 星野, and the family works exactly as built: 阮草 issues care as commands (「喝了就睡覺」), 林薇 escorts her through the health center, 白龍 wordlessly delivers the playbook's water, 阿迪 arrives with soup and jokes the fever down, and 沈文 is simply there.\n小圖's mistimed chirp — 「大家都在！」 — half-lands for once: 沈文 apologizes on reflex, but it happens to be true, and 星野 falls asleep smiling."},{"id":"B1L15-C2","k":"C2","title_zh":"沒什麼","han":299,"text":"星期日晚上，星野好多了，不發燒了。\n\n大家都來了，住在旁邊的金多恩也來了。小小的套房裡人很多。\n\n星野的胃口回來了，吃得比誰都多。\n\n阿迪笑她：「昨天是誰說『胃口很差』的？」\n\n湯裡最好的那塊牛肉，阮草給了星野：「生病的人先吃。」\n\n有人打電話給阮草。她看了看手機，笑了：「是我媽媽。」就到外面去了。\n\n外面很冷，也在下雨。裡面，大家說了很多，笑了很多。\n\n半個小時了，阮草還在外面。\n\n沈文從窗戶看外面：阮草在門口，已經沒在打電話了，可是還沒回來。雨很大，她沒有傘。\n\n她回來的時候，大家都在笑。\n\n她的臉色很難看——比生病的人更難看。\n\n星野問：「怎麼了？」\n\n「沒什麼。」\n\n「是伯母的電話嗎？家裡好嗎？」\n\n「沒什麼。你們吃吧。」\n\n阿迪給她一碗湯：「妳也喝一點吧！」\n\n「不用了。」\n\n她坐在旁邊，沒喝湯，也沒說什麼。\n\n十點，她說：「我先回去了。」\n\n她的那碗湯還在。冷了。\n\n沈文看了看門口，也看了看那碗湯。\n\n外面一直下雨。","synopsis":"The marquee that closes Book 1: mid-warmth — 星野 recovered, the six loud in her tiny flat, 阮草 sliding the best piece as always — a call from home lands. She steps out smiling; half an hour later 沈文 sees her through the window, phone down, standing in the rain, not coming back in.\nShe returns with the warmth switched off: 「沒什麼」, twice; the soup refused with the same 「不用了」 the sick-room laughed at; she leaves first, her bowl going cold. The reader sees only the face and the silence — B2 will explain."}]}},{"id":"B2L01","book":2,"n":1,"title":"Excuse Me. How Do You Get to Shida?","theme":"問路","tag":"","topic":"asking directions · locations · concurrent actions · sensory impressions","grammar":"從…往… · V-起來 · 著 · 一邊…一邊 · 離","cards":[{"k":"RU1","role":"runup","title":"first half — streets/directions: 迷路·路口·過·第·紅綠燈·告訴·提款機·超商·郵局·往前·右轉","note":"","text":"a lost-newcomer street piece — the new-semester classic: asking three 路人 the way to 師大, three different answers; ATM/post-office landmark texture.","cast":[],"label":null},{"k":"RU2","role":"runup","title":"second half — map/errands: 下載·地圖·好用·經過·巷子·一邊·發現·離·背包·正好·枝·筆·本子·左轉·麵店","note":"","text":"the school-supplies walk — map app vs alley reality; pens and notebooks bought, a noodle shop discovered 正好 on the way.","cast":[],"label":null},{"role":"marquee","title":"THE TIME CAPSULE","note":"","text":"first day of the new class — the six finally in one room, 蘇老師 at the front. Her class-opening ritual: everyone writes a sealed page to a future self (\"when your Chinese can laugh at this\"). The class buries the box by the café (site open call — the planter lean), and 林薇 draws the treasure map in the lesson's own grammar — 從門口往前走，第二個路口… 沈文's page goes in sealed like everyone's.","k":"C1","cast":["shenwen","linwei","sulaoshi"],"label":"sulaoshi"},{"role":"subplot","title":"the class assembles","note":"","text":"the decode gag opens [A] — 金多恩's four-character sting lands wrong on the new classmates; one member translates (\"she means she was worried\" — 沈文 lean); the group's private grammar becomes visible as a thing newcomers must learn. + 蘇老師 installs the Friday table: 「星期五，都來。」 (peak-pour year begins).","k":"C2","cast":["shenwen","jinduoen","s
