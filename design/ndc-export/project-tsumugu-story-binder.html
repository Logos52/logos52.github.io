"L14","at":["B2L14"],"pays":"her tradition-creed","to":[]},{"book":2,"n":34,"plant":"Rooftop rig shared (let in by inches)","at_raw":"L14","at":["B2L14"],"pays":"","to":[]},{"book":2,"n":35,"plant":"Extra places for the absent (hosting absence)","at_raw":"L15","at":["B2L15"],"pays":"","to":["B2L08"]},{"book":2,"n":36,"plant":"沈文's 圍爐 words (the photo-gap's first words)","at_raw":"L15","at":["B2L15"],"pays":"F stakes","to":[]},{"book":2,"n":37,"plant":"白龍's 「不回去。」","at_raw":"L15","at":["B2L15"],"pays":"","to":[]},{"book":2,"n":38,"plant":"**THE ACCIDENT** (trip killed; life silently saved)","at_raw":"L15","at":["B2L15"],"pays":"worth-vs-function","to":[]},{"book":2,"n":39,"plant":"**THE FIRST SECRET SHIFT** (dawn market)","at_raw":"L15","at":["B2L15"],"pays":"","to":[]},{"book":2,"n":40,"plant":"星野's relief + the video-call performance","at_raw":"L15","at":["B2L15"],"pays":"axis-1","to":[]}]}</script>
<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var $ = function(s, r){ return (r || document).querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<i>$2</i>').replace(/~~(.+?)~~/g, '<s>$1</s>').replace(/\n/g, '<br>'); }
function plain(s){ return String(s || '').replace(/\*\*|~~/g, '').replace(/(^|[^*])\*([^*]+)\*/g, '$1$2'); }
var CAST = D.cast, CBY = {}; CAST.forEach(function(c){ CBY[c.id] = c; });
var L = D.lessons, LI = {}; L.forEach(function(l, i){ LI[l.id] = i; });
var OUT = {}, INN = {};
D.links.forEach(function(k){ (OUT[k.a] = OUT[k.a] || []).push(k); (INN[k.b] = INN[k.b] || []).push(k); });
var ROLE = {marquee:'MARQUEE', subplot:'SUBPLOT', breather:'BREATHER', core:'CORE', runup:'RUN-UP', humor:'HUMOR'};
var S = {node:'root', pick:'root', mode:'cards', size:'m', threads:false, tint:false, syn:true, read:'both', binder:true, insp:true, theme:'light', q:'',
         open:{root:1, cast:1, col:1}, exp:{}};
var HIST = [], HI = -1;
function SW(s){ return D.meta.site ? String(s).replace(/packets? drafted/g, 'drafted').replace(/spine only/g, 'outlined').replace(/\bspine\b/g, 'outlined').replace(/\bpacket\b/g, 'drafted') : s; }
function col(c){ return S.theme === 'dark' ? c.d : c.c; }
function ltitle(l){ return l.title_en || l.title; }
function loadFlag(t){ return /🔴/.test(t.load || '') ? 'red' : /⚠/.test(t.load || '') ? 'amber' : ''; }
function loadText(t){ return (t.load || '').replace(/[🔴⚠✅]\s*/g, '').trim(); }
function firstCast(text){ var best = null, at = 1e9; CAST.forEach(function(c){ var i = text.indexOf(c.m); if (i >= 0 && i < at){ at = i; best = c.id; } }); return best; }
function allCast(text){ return CAST.filter(function(c){ return text.indexOf(c.m) >= 0; }).map(function(c){ return c.id; }); }

/* ---------- the tree: every item is a node, as in a binder ---------- */
var N = {};
function mk(id, kind, title, o){ var n = {id:id, kind:kind, title:title, kids:[], refs:null, parent:null, cast:[], label:null, status:'', syn:'', code:''}; for (var k in (o || {})) n[k] = o[k]; N[id] = n; return n; }
function add(p, c){ c.parent = p.id; p.kids.push(c.id); return c; }
var root = mk('root', 'series', 'Manuscript', {code:'Tsumugu Story', syn: D.meta.site ? D.meta.lessons + ' lessons and ' + D.thirds.length + ' thirds.' : D.meta.lessons + ' lessons in ' + D.books.length + ' books and ' + D.thirds.length + ' thirds, read from the book spines as they stand.'});
D.books.forEach(function(b){
  var bn = add(root, mk('B' + b.n, 'book', b.name || ('Book ' + b.n), {code:'Book ' + b.n, syn:b.question || '', book:b, stub:!!b.stub}));
  D.thirds.filter(function(t){ return t.book === b.n; }).forEach(function(t){
    var tn = add(bn, mk(t.id, 'third', t.phase || ('Third ' + t.t), {code:'T' + t.t + ' · L' + t.a + '–' + t.z, third:t, status:loadText(t), flag:loadFlag(t),
      syn:[t.climax ? '**Climax** ' + t.climax : '', t.aftermath ? '**Aftermath** ' + t.aftermath : ''].filter(Boolean).join('\n')}));
    L.filter(function(l){ return l.book === b.n && l.third === t.t; }).forEach(function(l){
      var mq = l.cards.filter(function(c){ return c.role === 'marquee'; })[0] || l.cards.filter(function(c){ return c.role !== 'runup'; })[0];
      var ln = add(tn, mk(l.id, 'lesson', ltitle(l), {code:l.id, lesson:l, cast:l.in_marquee, label:l.label || l.in_marquee[0] || null, status:l.status, slot:l.slot, holes:l.holes,
        syn: mq ? ((mq.title ? '**' + plain(mq.title) + '.** ' : '') + mq.text) : ''}));
      l.cards.forEach(function(c){ var rd = l.packet ? l.packet.readings.filter(function(r){ return r.k === c.k; })[0] : null;
        add(ln, mk(l.id + '/' + c.k, 'card', c.role === 'runup' ? c.title.split(':')[0] : (c.title || ''), {code:ROLE[c.role] + (c.role === 'runup' ? ' ' + c.k.slice(2) : ''), card:c, lesson:l,
          cast:c.cast, label:c.label || c.cast[0] || null, syn:c.text, status:rd ? 'drafted' : 'spine', hole:!!c.hole, reading:rd || null})); });
    });
  });
});
var castF = mk('cast', 'folder', 'Cast', {syn:'The eleven. A character opens onto the lessons whose marquee names them.'});
CAST.forEach(function(c){ var n = add(castF, mk('cast/' + c.id, 'person', c.zh, {code:c.py, syn:c.arc || '', status:c.arc_status || '', label:c.id, cast:[c.id], person:c}));
  n.refs = L.filter(function(l){ return l.in_marquee.indexOf(c.id) >= 0; }).map(function(l){ return l.id; }); });
var plantF = mk('plants', 'folder', 'Plants', {syn:'The plants ledgers: what is planted where, and where it pays off.'});
var callF = mk('calls', 'folder', 'Open calls', {syn:'The open calls listed at the foot of each spine.'});
D.books.forEach(function(b){
  var rows = D.ledger.filter(function(g){ return g.book === b.n; });
  var pf = rows.length ? add(plantF, mk('plants/B' + b.n, 'folder', 'Book ' + b.n, {syn:'Plants ledger, Book ' + b.n + '.'})) : null;
  rows.forEach(function(g){
    var n = add(pf, mk('plants/B' + b.n + '/' + g.n, 'plant', plain(g.plant), {code:'#' + g.n + ' · ' + g.at_raw, syn:g.pays ? '**Pays off** ' + g.pays : '', label:firstCast(g.plant + ' ' + g.pays), cast:allCast(g.plant + ' ' + g.pays), plant:g}));
    var r = g.at.concat(g.to).filter(function(x, i, a){ return LI[x] != null && a.indexOf(x) === i; }); if (r.length) n.refs = r; });
  var cf = b.open_calls.length ? add(callF, mk('calls/B' + b.n, 'folder', 'Book ' + b.n, {syn:'Open calls, Book ' + b.n + '.'})) : null;
  b.open_calls.forEach(function(c, i){ var m = c.match(/^\*\*(.+?)\*\*/), t = m ? m[1] : plain(c).split(' — ')[0];
    add(cf, mk('calls/B' + b.n + '/' + (i + 1), 'call', t.length > 90 ? t.slice(0, 88) + '…' : t, {code:'Open call ' + (i + 1), syn:c, label:firstCast(c), cast:allCast(c), call:c})); });
});
var colF = mk('col', 'folder', 'Collections', {syn:'Saved searches over the manuscript.'});
function coll(id, title, syn, refs){ if (!refs.length) return; var n = add(colF, mk('col/' + id, 'folder', title, {syn:syn})); n.refs = refs; n.isCol = true; }
var allCards = Object.keys(N).filter(function(id){ return N[id].kind === 'card'; });
coll('holes', 'Holes', 'Beats marked ⛔ HOLE in a spine: deleted and waiting to be written again.', allCards.filter(function(id){ return N[id].hole; }));
coll('climax', 'Climax slots', 'The penultimate lesson of each third.', L.filter(function(l){ return l.slot === 'climax'; }).map(function(l){ return l.id; }));
coll('boundary', 'Boundary slots', 'The last lesson of each third.', L.filter(function(l){ return l.slot === 'boundary'; }).map(function(l){ return l.id; }));
coll('drafted', D.meta.site ? 'Drafted' : 'Packets drafted', D.meta.site ? 'Lessons with drafted readings.' : 'Lessons with a drafted packet of readings.', L.filter(function(l){ return l.status === 'packet'; }).map(function(l){ return l.id; }));
coll('unmarked', 'No marquee marked', 'Lessons whose spine section names no marquee.', L.filter(function(l){ return !l.marquee; }).map(function(l){ return l.id; }));
mk('search', 'folder', 'Search', {syn:''});
var TOP = ['root', 'cast', 'plants', 'calls', 'col'].filter(function(id){ return N[id].kids.length; });
function kidsOf(n){ return n.refs || n.kids; }
function path(id){ var p = []; while (id){ p.unshift(id); id = N[id].parent; } return p; }
var STAT = {};
function stat(n){
  if (STAT[n.id]) return STAT[n.id];
  var s = {lessons:0, cards:0, planned:0, drafted:0, han:0, holes:0};
  if (n.kind === 'card'){ s.cards = 1; s.planned = n.card.role === 'humor' ? 0 : 1; s.drafted = n.reading ? 1 : 0; s.han = (n.reading && n.reading.han) || 0; s.holes = n.hole ? 1 : 0; }
  else { if (n.kind === 'lesson') s.lessons = 1; kidsOf(n).forEach(function(id){ var k = stat(N[id]); for (var f in s) s[f] += k[f]; }); }
  return (STAT[n.id] = s);
}
function tt(x){ if (x.title) return md(x.title); var w = plain(x.syn).split(/\s+/).slice(0, 6).join(' '); return '<span style="color:var(--faded);font-weight:400">' + esc(w) + (w ? '…' : 'untitled') + '</span>'; }
function lc(n){ return n.label && CBY[n.label] ? col(CBY[n.label]) : ''; }
function dots(ids){ return ids.map(function(id){ return '<i class="dot" title="' + CBY[id].zh + '" style="background:' + col(CBY[id]) + '"></i>'; }).join(''); }
function chips(ids){ return ids.map(function(id){ return '<span class="badge"><i class="dot" style="background:' + col(CBY[id]) + '"></i>' + CBY[id].zh + '</span>'; }).join(''); }

/* ---------- navigation ---------- */
function go(id, pick, keep){
  if (!N[id]) return;
  if (!keep){ HIST = HIST.slice(0, HI + 1); HIST.push([id, pick || id]); HI = HIST.length - 1; }
  S.node = id; S.pick = pick || id; S.exp = {};
  var n = N[id]; if (n.kind === 'book' || n.kind === 'series') n.kids.forEach(function(k){ if (N[k].kind === 'third') S.exp[k] = 1; });
  path(id).forEach(function(p){ S.open[p] = 1; });
  draw();
  var r = $('.bn-row.sel,.bn-sec.sel'); if (r && r.scrollIntoView) r.scrollIntoView({block:'nearest'});
  $('#edbody').scrollTop = 0;
}
function pick(id){ S.pick = id; var b = $('#edbody');
  [].forEach.call(b.querySelectorAll('[data-p]'), function(e){ e.classList.toggle('sel', e.getAttribute('data-p') === id); });
  drawInsp(); writeHash(); }
function readHash(){ location.hash.replace(/^#/, '').split('&').forEach(function(p){ var i = p.indexOf('='), k = p.slice(0, i), v = decodeURIComponent(p.slice(i + 1));
  if (k === 'n' && N[v]){ S.node = v; S.pick = v; } if (k === 'p' && N[v]) S.pick = v; if (k === 'm' && /^(cards|outline|read)$/.test(v)) S.mode = v; }); if (!N[S.pick]) S.pick = S.node; }
function writeHash(){ try { history.replaceState(null, '', '#n=' + encodeURIComponent(S.node) + '&m=' + S.mode + (S.pick !== S.node ? '&p=' + encodeURIComponent(S.pick) : '')); } catch (e) {} }

/* ---------- binder ---------- */
function bnTitle(n){
  if (n.kind === 'book') return '<u>' + n.code + '</u>' + esc(n.title);
  if (n.kind === 'third') return '<u>T' + n.third.t + '</u>' + esc(n.title);
  if (n.kind === 'lesson') return '<u>' + n.id + '</u>' + esc(n.title);
  if (n.kind === 'card') return '<u>' + n.code + '</u>' + tt(n);
  if (n.kind === 'plant' || n.kind === 'call') return '<u>' + esc(n.code.split(' · ')[0].replace('Open call ', '#')) + '</u>' + esc(n.title);
  return esc(n.title);
}
function drawBinder(){
  var pth = path(S.node), o = '';
  function row(id, d){ var n = N[id], has = n.kids.length > 0, c = lc(n), cnt = '';
    if (n.kind === 'book' || n.kind === 'third') cnt = stat(n).lessons || ''; else if (n.kind === 'folder') cnt = kidsOf(n).length; else if (n.kind === 'person') cnt = (n.refs || []).length;
    o += '<div class="bn-row' + (S.node === id ? ' sel' : pth.indexOf(id) >= 0 ? ' path' : '') + '" style="padding-left:' + (6 + d * 13) + 'px">' +
      (has ? '<button type="button" class="tw on' + (S.open[id] ? ' open' : '') + '" data-tw="' + id + '" aria-expanded="' + !!S.open[id] + '" aria-label="' + (S.open[id] ? 'Collapse ' : 'Expand ') + esc(n.title) + '"></button>' : '<span class="tw"></span>') +
      '<button type="button" class="bn-b" data-n="' + id + '"><span class="ic k-' + n.kind + '"' + (c ? ' style="--c:' + c + '"' : '') + '></span><span class="bn-t">' + bnTitle(n) + '</span>' +
      (n.flag ? '<i class="bn-f" style="background:var(--' + n.flag + ')"></i>' : '') + (n.hole || n.holes ? '<i class="bn-f" style="background:var(--red)" title="hole"></i>' : '') +
      (cnt !== '' ? '<span class="bn-c">' + cnt + '</span>' : '') + '</button></div>';
    if (has && S.open[id]) n.kids.forEach(function(k){ row(k, d + 1); }); }
  TOP.forEach(function(id){ var n = N[id];
    o += '<button type="button" class="bn-sec' + (S.node === id ? ' sel' : '') + '" data-n="' + id + '">' + esc(n.title) + '</button>';
    n.kids.forEach(function(k){ row(k, 0); }); });
  $('#binder').innerHTML = o;
}

/* ---------- index cards ---------- */
function cardFoot(x){
  var st = stat(x);
  if (x.kind === 'lesson') return dots(x.cast) + '<span class="r">' + SW(x.status === 'packet' ? 'packet · ' + st.drafted + ' readings' : 'spine') + '</span>';
  if (x.kind === 'card') return dots(x.cast) + '<span class="r">' + SW(x.reading ? 'drafted' + (x.reading.han ? ' · ' + x.reading.han + ' Han' : '') : 'spine') + '</span>';
  if (x.kind === 'third') return '<span>' + st.lessons + ' lessons</span><span class="r">' + esc(x.status) + '</span>';
  if ((x.kind === 'book' || x.kind === 'series') && !st.lessons) return '';
  if (x.kind === 'book' || x.kind === 'series') return '<span>' + st.lessons + ' lessons · ' + st.cards + ' cards</span><span class="r">' + (st.drafted || !D.meta.site ? st.drafted + ' of ' + st.planned + ' drafted' : '') + '</span>';
  if (x.kind === 'person') return '<span>marquee in ' + (x.refs || []).length + ' lessons</span><span class="r">' + esc(x.status) + '</span>';
  if (x.kind === 'plant') return dots(x.cast) + '<span class="r">' + (x.plant.to.length ? '→ ' + x.plant.to.join(' ') : '') + '</span>';
  if (x.kind === 'call') return dots(x.cast);
  return '<span>' + kidsOf(x).length + ' items</span>';

  if ((e = t.closest('.tg'))){ if (e.id === 't-theme') S.theme = S.theme === 'dark' ? 'light' : 'dark'; else if (e.id === 't-binder') S.binder = !S.binder; else if (e.id === 't-insp'){ if (window.innerWidth <= 980) S.wi = !S.wi; else { S.insp = !S.insp; S.wi = false; } } draw(); }
});
document.addEventListener('dblclick', function(ev){ var e = ev.target.closest('#edbody [data-p]'); if (e) openNode(e.getAttribute('data-p')); });
document.addEventListener('keydown', function(ev){
  if (/input|textarea/i.test(ev.target.tagName)){ if (ev.key === 'Escape'){ ev.target.value = ''; ev.target.dispatchEvent(new Event('input')); ev.target.blur(); } return; }
  var i = VIS.indexOf(S.pick);
  var ae = document.activeElement, fp = ae && ae.getAttribute && ae.closest && ae.closest('#edbody') ? ae.getAttribute('data-p') : null;
  if (ev.key === 'Enter' && fp){ openNode(fp); ev.preventDefault(); }
  else if (ev.key === 'Enter' && S.pick !== S.node && !(ae && /^(BUTTON|A)$/.test(ae.tagName))){ openNode(S.pick); ev.preventDefault(); }
  else if (ev.key === 'Escape'){ var p = N[S.node].parent; if (p) go(p, S.node); }
  else if (/^Arrow(Right|Down)$/.test(ev.key) && VIS.length){ pick(VIS[Math.min(VIS.length - 1, i + 1)]); ev.preventDefault(); scrollPick(); }
  else if (/^Arrow(Left|Up)$/.test(ev.key) && VIS.length){ pick(VIS[Math.max(0, i - 1)]); ev.preventDefault(); scrollPick(); }
});
function scrollPick(){ var e = $('#edbody [data-p="' + S.pick.replace(/"/g, '') + '"]'); if (e && e.scrollIntoView) e.scrollIntoView({block:'nearest', inline:'nearest'}); }
var back = null;
$('#q').addEventListener('input', function(){
  S.q = this.value.trim(); var q = S.q.toLowerCase();
  if (!q){ if (S.node === 'search') go(back || 'root'); return; }
  if (S.node !== 'search') back = S.node;
  N.search.refs = Object.keys(N).filter(function(id){ var x = N[id]; return /^(lesson|card|plant|call|person)$/.test(x.kind) && (x.title + ' ' + x.syn + ' ' + x.code).toLowerCase().indexOf(q) >= 0; }).slice(0, 240);
  delete STAT.search; S.node = 'search'; S.pick = 'search'; S.exp = {}; drawBinder(); drawEditor(); drawInsp();
});
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) S.theme = 'dark';
readHash(); HIST = [[S.node, S.pick]]; HI = 0; path(S.node).forEach(function(p){ S.open[p] = 1; });
var n0 = N[S.node]; if (n0.kind === 'book' || n0.kind === 'series') n0.kids.forEach(function(k){ if (N[k].kind === 'third') S.exp[k] = 1; });
draw();
})();
</script>
