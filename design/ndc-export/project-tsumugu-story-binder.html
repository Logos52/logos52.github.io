<style>
:root{--bg:#f9f9f9;--ink:#1a1a1a;--surface:#fff;--link:#0090cc;--line:rgba(26,26,26,.10);--hair:rgba(26,26,26,.16);--mute:rgba(26,26,26,.70);--faded:rgba(26,26,26,.62);--inkrgb:26,26,26;--red:#d2462e;--amber:#d99a1c;--board:rgba(26,26,26,.045);
--font:"IBM Plex Sans","PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;--neon:"Monaspace Neon",ui-monospace,monospace;--cw:208px;--ch:158px}
html[data-theme=dark]{--bg:#1f2021;--ink:#ececea;--surface:#2c2d2e;--link:#4cc9f5;--line:rgba(255,255,255,.12);--hair:rgba(255,255,255,.2);--mute:rgba(237,237,237,.76);--faded:rgba(237,237,237,.56);--inkrgb:236,236,234;--red:#f0705a;--amber:#e9b343;--board:rgba(0,0,0,.22);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--bg);color:var(--ink);-webkit-text-size-adjust:none}
body{font:400 13px/19px var(--font);-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;min-height:640px;overflow:hidden}
.back,.sib{font-size:12.5px;color:var(--mute);text-decoration:none;white-space:nowrap}
.back:hover,.sib:hover{color:var(--ink)}
.back::before{content:"← "}
.sib{border:1px solid var(--hair);border-radius:5px;padding:3px 10px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
b{font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.grow{flex:1 1 0}

/* toolbar */
.bar{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line)}
.bar h1{font:700 15px/1.2 var(--font);white-space:nowrap}
.bar h1 span{font:400 10.5px var(--neon);color:var(--faded);margin-left:7px;letter-spacing:.05em}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:5px;overflow:hidden}
.seg button{padding:4px 12px;font-size:12.5px;color:var(--mute);border-right:1px solid var(--hair)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg.sm button{padding:2px 8px;font:400 11px/17px var(--neon)}
.q{border:1px solid var(--hair);border-radius:5px;background:var(--surface);padding:4px 9px;font-size:12.5px;width:190px;outline:0}
.q:focus{border-color:var(--ink)}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);padding:3px 0;white-space:nowrap}
.tg i{width:11px;height:11px;border:1px solid var(--faded);border-radius:2px;display:inline-block}
.tg[aria-pressed=true] i{background:var(--ink);border-color:var(--ink)}

.app{display:grid;grid-template-columns:268px minmax(0,1fr) 316px;min-height:0}
.app.nob{grid-template-columns:0 minmax(0,1fr) 316px}
.app.noi{grid-template-columns:268px minmax(0,1fr) 0}
.app.nob.noi{grid-template-columns:0 minmax(0,1fr) 0}
.app.nob .binder,.app.noi .insp{display:none}

/* binder */
.binder{overflow:auto;border-right:1px solid var(--line);padding:6px 0 30px;min-height:0;font-size:12.5px}
.bn-sec{font:400 10px/14px var(--neon);letter-spacing:.08em;color:var(--faded);text-transform:uppercase;padding:12px 12px 4px;display:block;width:100%}
.bn-sec.sel{color:var(--ink)}
.bn-row{display:flex;align-items:center;height:25px;padding-right:10px;white-space:nowrap;color:var(--mute)}
.bn-b{display:flex;align-items:center;gap:6px;flex:1 1 0;min-width:0;height:25px;color:inherit;font-weight:inherit}
.bn-row:hover{background:rgba(var(--inkrgb),.045)}
.bn-row.sel{background:rgba(var(--inkrgb),.1);color:var(--ink);font-weight:700}
.bn-row.path{color:var(--ink)}
.tw{width:14px;height:25px;flex:none;position:relative;margin-right:6px;display:inline-block}
.tw.on::before{content:"";position:absolute;left:4px;top:9px;border-left:5px solid var(--faded);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;transition:transform .12s}
.tw.on.open::before{transform:rotate(90deg)}
.ic{width:11px;height:12px;flex:none;border:1.3px solid var(--c,var(--faded));border-radius:2px}
.ic.k-book,.ic.k-folder,.ic.k-series{height:9px;border-radius:1.5px;background:var(--c,var(--faded));border-color:transparent;position:relative;margin-top:2px}
.ic.k-book::before,.ic.k-folder::before,.ic.k-series::before{content:"";position:absolute;left:0;top:-3px;width:5px;height:3px;background:inherit;border-radius:1.5px 1.5px 0 0}
.ic.k-third{height:10px;box-shadow:2px -2px 0 -0.6px var(--bg),2px -2px 0 0.7px var(--c,var(--faded))}
.ic.k-card,.ic.k-plant,.ic.k-call{height:8px}
.ic.k-person{border-radius:50%;height:11px;background:var(--c,var(--faded));border-color:transparent}
.bn-t{overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
.bn-t u{text-decoration:none;font:400 10px var(--neon);color:var(--faded);margin-right:6px;font-weight:400}
.bn-c{font:400 10px var(--neon);color:var(--faded);font-weight:400}
.bn-f{width:6px;height:6px;border-radius:50%;flex:none}

/* editor */
.editor{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.ed-head{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:7px 14px;border-bottom:1px solid var(--line);min-height:40px}
.nav button{width:22px;height:22px;border:1px solid var(--hair);border-radius:4px;text-align:center;color:var(--mute);font-size:13px;line-height:18px}
.nav button[disabled]{opacity:.3;cursor:default}
.crumb{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12.5px;color:var(--faded);min-width:0}
.crumb button{color:var(--mute)}
.crumb button:hover{color:var(--ink)}
.crumb b{color:var(--ink)}
.ed-body{overflow:auto;min-height:0}
.board{background:var(--board);min-height:100%;padding:16px 16px 40px}
.grp{margin-bottom:22px}
.grp-h{display:flex;align-items:baseline;gap:8px;padding:0 2px 8px;font-size:12px;color:var(--mute);cursor:pointer;width:100%}
.grp-h b{color:var(--ink)}
.grp-h i{font-style:normal;color:var(--faded)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:14px}
.card{position:relative;height:var(--ch);width:100%;background:var(--surface);border:1px solid var(--line);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column;cursor:pointer;overflow:hidden;text-align:left}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.c-rule,.c-s{display:block}
.card:hover{border-color:rgba(var(--inkrgb),.38)}
.card.sel{box-shadow:0 0 0 2px var(--ink)}
.card.tint{background:color-mix(in srgb,var(--c,transparent) 11%,var(--surface))}
.c-h{display:flex;justify-content:space-between;gap:8px;padding:7px 10px 0;font:400 9.5px/14px var(--neon);letter-spacing:.05em;color:var(--faded);white-space:nowrap}
.c-h span:first-child{overflow:hidden;text-overflow:ellipsis}
.c-t{padding:1px 10px 5px;font-weight:700;font-size:12.5px;line-height:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-rule{height:0;border-top:1.5px solid var(--c,rgba(var(--inkrgb),.28));margin:0 10px}
.c-s{flex:1 1 0;min-height:0;overflow:hidden;padding:0 10px;margin-top:5px;font-size:11.5px;line-height:16px;color:var(--mute);background-image:linear-gradient(to bottom,transparent 15px,rgba(var(--inkrgb),.07) 15px);background-size:100% 16px;background-origin:content-box;background-clip:content-box}
.c-s b{color:var(--ink)}
.c-f{display:flex;align-items:center;gap:4px;padding:5px 10px 7px;font-size:10.5px;line-height:14px;color:var(--faded);white-space:nowrap}
.c-f .dot{width:6px;height:6px}
.c-f .r{margin-left:auto;overflow:hidden;text-overflow:ellipsis}
.stamp{position:absolute;right:9px;bottom:28px;transform:rotate(-9deg);font:700 15px/1 var(--font);letter-spacing:.1em;color:var(--red);opacity:.5;border:2px solid currentColor;border-radius:3px;padding:3px 6px;pointer-events:none;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.stamp.sm{font-size:10.5px;letter-spacing:.06em;border-width:1.5px;padding:2px 5px}
.empty{color:var(--faded);padding:30px 4px;font-size:12.5px}
/* threads: cards on one line per label */
.threads{display:grid;gap:8px 8px;align-items:center;width:max-content;position:relative;padding-right:16px}
.th-lab{position:sticky;left:0;z-index:2;font-size:12px;display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--bg) 88%,transparent);padding:3px 8px 3px 2px;border-radius:3px;white-space:nowrap;width:98px}
.th-line{height:0;border-top:2px solid var(--c);opacity:.5;align-self:center}
.threads .card{width:152px;height:96px}
.threads .card .c-f{display:none}
.threads .card .c-t{-webkit-line-clamp:1;padding-bottom:4px}
.threads .card .c-s{margin-top:4px;padding-bottom:6px}
.threads .stamp{bottom:8px;font-size:10px;padding:1px 4px;border-width:1.5px}
.thw{overflow-x:auto;padding-bottom:10px}

/* outline */
table.ol{border-collapse:collapse;width:100%;font-size:12px;line-height:17px}
.ol th{position:sticky;top:0;background:var(--bg);font-weight:400;font-size:11px;color:var(--mute);text-align:left;padding:7px 8px 6px;border-bottom:1px solid rgba(var(--inkrgb),.34);white-space:nowrap;z-index:1}
.ol td{padding:5px 7px;border-bottom:1px solid var(--line);vertical-align:top}
.ol tr{cursor:pointer}
.ol tr:hover td{background:rgba(var(--inkrgb),.035)}
.ol tr.sel td{background:rgba(var(--inkrgb),.09)}
.ol .o-t{display:flex;align-items:flex-start;gap:6px;min-width:190px}
.ol .o-t .tw{height:17px}
.ol .o-t .tw.on::before{top:5px}
.ol .o-t .ic{margin-top:3px}
.ol .o-t u{text-decoration:none;font:400 10px var(--neon);color:var(--faded);margin-right:6px}
.ol tr.d0 .o-tt{font-weight:700}
.ol .o-s{color:var(--mute);min-width:170px;max-width:340px}
.ol .o-s div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ol .o-l{white-space:nowrap}
.ol .o-l span{display:inline-flex;align-items:center;gap:5px}
.ol .o-st{white-space:nowrap;color:var(--mute)}
.ol .o-st.hole{color:var(--red)}
.ol .num{font:400 10.5px/17px var(--neon);text-align:right;white-space:nowrap;color:var(--mute)}
.pg{display:inline-block;width:58px;height:6px;border-radius:3px;background:rgba(var(--inkrgb),.1);vertical-align:1px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--ink)}

/* read */
.read{max-width:740px;margin:0 auto;padding:26px 28px 80px}
.rd-b{font:700 20px/26px var(--font);margin:34px 0 4px}
.rd-b:first-child{margin-top:0}
.rd-b small{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.rd-th{font:400 10.5px var(--neon);letter-spacing:.07em;text-transform:uppercase;color:var(--faded);margin:26px 0 0;padding-top:10px;border-top:1px solid var(--hair)}
.rd-l{margin-top:22px}
.rd-l>header button{cursor:pointer}
.o-tt{text-align:left}
.rd-l>header u{text-decoration:none;font:400 10.5px var(--neon);color:var(--faded);margin-right:8px}
.rd-l>header b{font-size:16px;line-height:22px}
.rd-l>header span{color:var(--faded);font-size:12.5px;margin-left:8px}
.rd-c{margin-top:14px;padding-left:12px;border-left:2px solid var(--c,var(--line))}
.rd-k{font:400 9.5px/14px var(--neon);letter-spacing:.07em;color:var(--faded)}
.rd-c h3{font:700 13.5px/19px var(--font)}
.rd-c p{font-size:13.5px;line-height:21px;color:var(--mute);margin-top:2px}
.rd-c p b{color:var(--ink)}
.rd-c.hole p,.rd-c.hole h3{color:var(--faded)}
.zh{white-space:pre-wrap;font-size:16px;line-height:28px;color:var(--ink);margin-top:10px}
.zh-t{font-weight:700;font-size:15px;margin-top:10px}
.zh-t small{font:400 10.5px var(--neon);color:var(--faded);margin-left:8px}
.none{color:var(--faded);font-size:12.5px;margin-top:8px}

/* inspector */
.insp{overflow:auto;border-left:1px solid var(--line);padding:14px 16px 40px;min-height:0}
.insp .card{height:auto;min-height:150px;cursor:default;margin-bottom:6px}
.insp .card .c-s{flex:none;overflow:visible;padding-bottom:8px;max-height:260px;overflow-y:auto}
.insp .card .c-t{-webkit-line-clamp:4}
.i-k{font:400 10px/14px var(--neon);letter-spacing:.07em;color:var(--faded);text-transform:uppercase;margin:16px 0 5px}
.i-m{display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 10px;font-size:12px;line-height:17px}
.i-m dt{color:var(--faded)}
.i-m dd{color:var(--ink);min-width:0;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:15px;border:1px solid var(--hair);border-radius:3px;padding:0 5px;color:var(--mute);margin:0 3px 3px 0}
.badge.red{border-color:var(--red);color:var(--red)}.badge.amber{border-color:var(--amber);color:var(--amber)}
.pl{padding:5px 0;border-top:1px solid var(--line);font-size:12px;line-height:17.5px;color:var(--mute)}
.pl:first-of-type{border-top:0}
.go{font:400 10.5px/15px var(--neon);border:1px solid var(--hair);border-radius:3px;padding:0 5px;margin:0 3px 2px 0;color:var(--ink);display:inline-block}
.go:hover{border-color:var(--ink)}
.i-p{font-size:12px;line-height:17.5px;color:var(--mute)}
.i-src{font:400 10px/15px var(--neon);color:var(--faded);margin-top:18px;word-break:break-all}
.foot{display:flex;gap:6px 18px;flex-wrap:wrap;border-top:1px solid var(--line);padding:4px 14px;font:400 10.5px/16px var(--neon);color:var(--faded)}
@media (max-width:980px){.app{grid-template-columns:230px minmax(0,1fr) 0}.app .insp{display:none}.app.wi{grid-template-columns:0 minmax(0,1fr) 300px}.app.wi .insp{display:block}.app.wi .binder{display:none}.q{width:130px}}
</style>

<script id="data" type="application/json">{"meta":{"site":true,"books":[1,2],"lessons":30,"links":22,"plants":63,"open_calls":0,"holes":0,"packets":15},"cast":[{"id":"shenwen","zh":"沈文","py":"Shěn Wén","six":true,"c":"#0B8F86","d":"#35BAAE","m":"沈文","arc":"He builds: robotics, AI, whatever's broken on the table in front of him. He says the least of anyone there and is the reason there's a table; his handmade robot, 小圖, rides on his bag strap wherever he goes.","arc_status":"the builder"},{"id":"ruancao","zh":"阮草","py":"Ruǎn Cǎo","six":true,"c":"#6F9C3B","d":"#93BC55","m":"阮草","arc":"She grows mushrooms and runs ferments off a shelf in the corner of the café, and the group borrowed her word for it — mát tay, the cool hand. Headstrong, direct, and warmly certain she's right, she shows love by doing: the right mushroom pulled for the right person on the right day.","arc_status":"the Tender"},{"id":"xingye","zh":"星野遙香","py":"Xīngyě Yáoxiāng","six":true,"c":"#DA93BD","d":"#F5A9DC","m":"星野","arc":"The Osaka super-fan who's more into Taiwan than the locals are — loud, quick, and always behind her film camera. She's the group's energy, the half-step-ahead one who gets everyone out the door: first to try the stinky tofu, last to want the night to end.","arc_status":"the super-fan"},{"id":"jinduoen","zh":"金多恩","py":"Jīn Duō'ēn","six":true,"c":"#8A5FD0","d":"#A985E8","m":"金多恩","arc":"Quiet, sharp, unhurried — the group's best test-taker, who says the least and notices the most. She lands the plain hard verdict in a handful of cold words, then quietly picks up the broken thing everyone else stepped over and mends it.","arc_status":"the conservator"},{"id":"adi","zh":"阿迪","py":"Ā Dí","six":true,"c":"#C75B28","d":"#E07B42","m":"阿迪","arc":"The warm, laid-back maker from Jakarta who stitches batik into streetwear. What the shirts earn goes home to his family; he carries that quietly, and he is the last one in the room to decide anything.","arc_status":"the maker"},{"id":"bailong","
